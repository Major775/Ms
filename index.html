<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>ONG Project Pro — v3.0 (Google Sheets Only)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js">
    </script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js">
    </script>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <style>
        :root {
            --bg: #0F172A;
            --bg2: #1E293B;
            --bg3: #162033;
            --sidebar: #0A1628;
            --text: #E2E8F0;
            --text2: #94A3B8;
            --text3: #475569;
            --border: rgba(255, 255, 255, 0.07);
            --border2: rgba(255, 255, 255, 0.12);
            --accent: #6366F1;
            --accent2: #818CF8;
            --accentbg: rgba(99, 102, 241, 0.15);
            --green: #10B981;
            --greenbg: rgba(16, 185, 129, 0.15);
            --red: #EF4444;
            --redbg: rgba(239, 68, 68, 0.15);
            --yellow: #F59E0B;
            --yellowbg: rgba(245, 158, 11, 0.15);
            --blue: #3B82F6;
            --bluebg: rgba(59, 130, 246, 0.15);
            --orange: #F97316;
            --orangebg: rgba(249, 115, 22, 0.15);
            --purple: #A855F7;
            --purplebg: rgba(168, 85, 247, 0.15);
            --radius: 10px;
            --radius2: 14px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }

        body.light {
            --bg: #F8FAFC;
            --bg2: #FFFFFF;
            --bg3: #F1F5F9;
            --sidebar: #FFFFFF;
            --text: #1E293B;
            --text2: #64748B;
            --text3: #94A3B8;
            --border: rgba(0, 0, 0, 0.06);
            --border2: rgba(0, 0, 0, 0.1);
            --accent: #4F46E5;
            --accent2: #6366F1;
            --accentbg: rgba(79, 70, 229, 0.08);
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html {
            font-size: 13px;
            scroll-behavior: smooth
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px
        }

        ::-webkit-scrollbar-track {
            background: transparent
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px
        }

        body.light ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.12)
        }

        .shell {
            display: flex;
            min-height: 100vh
        }

        .sb {
            width: 220px;
            min-width: 220px;
            background: var(--sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 200;
            overflow-y: auto;
            transition: transform .3s
        }

        .sb-logo {
            padding: 16px 14px;
            display: flex;
            align-items: center;
            gap: 9px;
            border-bottom: 1px solid var(--border)
        }

        .sb-mark {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #4F46E5, #818CF8);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            color: #fff;
            flex-shrink: 0
        }

        .sb-name {
            font-weight: 700;
            font-size: 14px;
            color: var(--text)
        }

        .sb-tag {
            font-size: 9px;
            color: var(--text3);
            font-weight: 500;
            letter-spacing: .5px
        }

        .sb-section {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 1.3px;
            text-transform: uppercase;
            color: var(--text3);
            padding: 14px 14px 4px
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 9px;
            width: 100%;
            padding: 8px 14px;
            background: none;
            border: none;
            border-left: 3px solid transparent;
            color: var(--text2);
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            cursor: pointer;
            transition: all .15s;
            text-align: left;
            white-space: nowrap
        }

        .nav-btn i {
            width: 15px;
            text-align: center;
            font-size: 12px;
            flex-shrink: 0
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text)
        }

        .nav-btn.active {
            background: var(--accentbg);
            color: var(--accent2);
            border-left-color: var(--accent)
        }

        .nav-badge {
            margin-left: auto;
            background: var(--redbg);
            color: var(--red);
            border-radius: 10px;
            padding: 1px 6px;
            font-size: 9px;
            font-weight: 700
        }

        .sb-bottom {
            margin-top: auto;
            padding: 12px;
            border-top: 1px solid var(--border)
        }

        .main {
            margin-left: 220px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 100vh
        }

        .topbar {
            background: var(--sidebar);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            height: 52px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100
        }

        .tb-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text)
        }

        .tb-space {
            flex: 1
        }

        .page {
            display: none;
            padding: 20px;
            min-height: calc(100vh - 52px)
        }

        .page.active {
            display: block
        }

        .card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius2);
            overflow: hidden;
            margin-bottom: 16px
        }

        .card-head {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px
        }

        .card-title {
            font-size: 12.5px;
            font-weight: 700;
            color: var(--text);
            flex: 1
        }

        .card-body {
            padding: 16px
        }

        .g4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 16px
        }

        .g3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 16px
        }

        .g2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px
        }

        .stat {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius2);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: border-color .2s
        }

        .stat:hover {
            border-color: var(--accent)
        }

        .stat-ico {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0
        }

        .stat-val {
            font-size: 22px;
            font-weight: 700;
            line-height: 1;
            color: var(--text)
        }

        .stat-lbl {
            font-size: 10.5px;
            color: var(--text3);
            margin-top: 3px
        }

        .stat-delta {
            font-size: 10px;
            font-weight: 600;
            margin-top: 4px
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: 8px;
            border: 1px solid var(--border2);
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
            white-space: nowrap;
            text-decoration: none
        }

        .btn-primary {
            background: linear-gradient(135deg, #4F46E5, #818CF8);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 2px 8px rgba(79, 70, 229, .35)
        }

        .btn-primary:hover {
            opacity: .9;
            transform: translateY(-1px)
        }

        .btn-ghost {
            background: transparent;
            color: var(--text2)
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text)
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 11px
        }

        .btn-icon {
            width: 30px;
            height: 30px;
            padding: 0;
            justify-content: center;
            border-radius: 8px
        }

        .btn-success {
            background: var(--greenbg);
            color: var(--green);
            border-color: transparent
        }

        .btn-danger {
            background: var(--redbg);
            color: var(--red);
            border-color: transparent
        }

        .btn-warn {
            background: var(--yellowbg);
            color: var(--yellow);
            border-color: transparent
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .3px
        }

        .b-green {
            background: var(--greenbg);
            color: var(--green)
        }

        .b-red {
            background: var(--redbg);
            color: var(--red)
        }

        .b-yellow {
            background: var(--yellowbg);
            color: var(--yellow)
        }

        .b-blue {
            background: var(--bluebg);
            color: var(--blue)
        }

        .b-purple {
            background: var(--purplebg);
            color: var(--purple)
        }

        .b-gray {
            background: rgba(148, 163, 184, .15);
            color: var(--text2)
        }

        input,
        select,
        textarea {
            background: var(--bg3);
            border: 1px solid var(--border2);
            border-radius: 8px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            padding: 8px 11px;
            width: 100%;
            transition: border-color .15s;
            outline: none
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, .18)
        }

        input:disabled {
            opacity: .6;
            cursor: not-allowed
        }

        .fld {
            margin-bottom: 11px
        }

        .fld-lbl {
            font-size: 10px;
            font-weight: 700;
            color: var(--text3);
            margin-bottom: 4px;
            display: block;
            text-transform: uppercase;
            letter-spacing: .5px
        }

        .prog-track {
            height: 5px;
            background: rgba(255, 255, 255, .07);
            border-radius: 3px;
            overflow: hidden
        }

        .prog-fill {
            height: 100%;
            border-radius: 3px;
            transition: width .4s
        }

        .prog-lg {
            height: 8px
        }

        table.dataTable thead th {
            background: var(--bg3) !important;
            border-bottom: 1px solid var(--border) !important;
            font-weight: 700;
            font-size: 9.5px;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: var(--text3) !important;
            padding: 9px 11px !important
        }

        table.dataTable tbody td {
            padding: 9px 11px !important;
            border-bottom: 1px solid var(--border) !important;
            vertical-align: middle !important;
            color: var(--text);
            background: var(--bg2) !important;
            font-size: 12px
        }

        table.dataTable tbody tr:hover td {
            background: var(--bg3) !important;
            cursor: pointer
        }

        .dataTables_wrapper .dataTables_filter input {
            background: var(--bg3) !important;
            border: 1px solid var(--border2) !important;
            color: var(--text) !important;
            border-radius: 8px !important;
            padding: 5px 10px !important
        }

        .dataTables_wrapper .dataTables_info,
        .dataTables_wrapper .dataTables_paginate {
            font-size: 11px;
            color: var(--text2)
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button {
            border-radius: 6px !important;
            color: var(--text2) !important;
            background: transparent !important;
            border: none !important
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button.current {
            background: var(--accentbg) !important;
            color: var(--accent2) !important;
            border: 1px solid var(--accent) !important
        }

        .gantt-wrap {
            overflow: auto;
            border-radius: var(--radius2);
            background: var(--bg2);
            border: 1px solid var(--border)
        }

        .gantt-table {
            min-width: 900px;
            border-collapse: collapse;
            width: 100%
        }

        .gantt-table th {
            background: var(--bg3);
            border-bottom: 1px solid var(--border);
            padding: 7px 10px;
            font-size: 9.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: var(--text3);
            white-space: nowrap
        }

        .gantt-table td {
            border-bottom: 1px solid var(--border);
            padding: 6px 10px;
            font-size: 11.5px;
            color: var(--text2);
            vertical-align: middle;
            white-space: nowrap
        }

        .gantt-table tr:hover td {
            background: var(--bg3);
            cursor: pointer
        }

        .gantt-bar {
            height: 18px;
            border-radius: 4px;
            position: relative;
            min-width: 4px
        }

        .gantt-prog {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            border-radius: 4px;
            opacity: .8
        }

        .gantt-today-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #818CF8;
            z-index: 10;
            pointer-events: none
        }

        .alert-item {
            display: flex;
            align-items: flex-start;
            gap: 11px;
            padding: 11px 14px;
            border-radius: var(--radius);
            margin-bottom: 8px;
            transition: opacity .2s
        }

        .alert-item.error {
            background: var(--redbg);
            border: 1px solid rgba(239, 68, 68, .2)
        }

        .alert-item.warn {
            background: var(--yellowbg);
            border: 1px solid rgba(245, 158, 11, .2)
        }

        .alert-item.info {
            background: var(--bluebg);
            border: 1px solid rgba(59, 130, 246, .2)
        }

        .alert-ico {
            font-size: 13px;
            margin-top: 1px
        }

        .alert-item.error .alert-ico {
            color: var(--red)
        }

        .alert-item.warn .alert-ico {
            color: var(--yellow)
        }

        .alert-item.info .alert-ico {
            color: var(--blue)
        }

        .alert-text {
            flex: 1
        }

        .alert-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 2px
        }

        .alert-sub {
            font-size: 11px;
            color: var(--text2)
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .65);
            z-index: 500;
            align-items: center;
            justify-content: center
        }

        .modal-overlay.open {
            display: flex
        }

        .modal {
            background: var(--bg2);
            border: 1px solid var(--border2);
            border-radius: 16px;
            width: 700px;
            max-width: 95vw;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow)
        }

        .modal-head {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            background: var(--bg2);
            z-index: 1
        }

        .modal-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text)
        }

        .modal-body {
            padding: 20px
        }

        .modal-foot {
            padding: 14px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            position: sticky;
            bottom: 0;
            background: var(--bg2)
        }

        .chart-container {
            position: relative;
            width: 100%
        }

        .kanban-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px
        }

        .kanban-col {
            background: var(--bg3);
            border-radius: var(--radius2);
            padding: 12px
        }

        .kanban-col-head {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .8px;
            color: var(--text3);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between
        }

        .kanban-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 11px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: border-color .15s
        }

        .kanban-card:hover {
            border-color: var(--accent)
        }

        .kanban-card-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 5px
        }

        .kanban-card-meta {
            font-size: 10.5px;
            color: var(--text3);
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap
        }

        .heatmap-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 28px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: transform .15s
        }

        .heatmap-cell:hover {
            transform: scale(1.1);
            z-index: 1
        }

        .empty {
            text-align: center;
            padding: 36px;
            color: var(--text3)
        }

        .empty i {
            font-size: 28px;
            display: block;
            margin-bottom: 10px;
            opacity: .4
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 14px 0
        }

        .tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 7px;
            background: var(--accentbg);
            border: 1px solid var(--accent);
            border-radius: 8px;
            font-size: 10px;
            color: var(--accent2);
            margin: 2px
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 10.5px;
            font-weight: 600
        }

        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text)
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 10px;
            color: #fff;
            flex-shrink: 0
        }

        .fbar {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            flex-wrap: wrap;
            margin-bottom: 14px;
            padding: 12px 14px;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius2)
        }

        .fbar input,
        .fbar select {
            width: auto;
            min-width: 120px
        }

        .notif {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none
        }

        .notif-item {
            background: var(--bg2);
            border: 1px solid var(--border2);
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text);
            box-shadow: var(--shadow);
            pointer-events: auto;
            animation: slideIn .3s ease;
            display: flex;
            align-items: center;
            gap: 8px
        }

        @keyframes slideIn {
            from {
                transform: translateX(100px);
                opacity: 0
            }

            to {
                transform: translateX(0);
                opacity: 1
            }
        }

        @media(max-width:800px) {
            .sb {
                transform: translateX(-100%)
            }

            .main {
                margin-left: 0
            }

            .g4 {
                grid-template-columns: repeat(2, 1fr)
            }

            .kanban-board {
                grid-template-columns: 1fr 1fr
            }
        }

        .doc-preview {
            max-width: 80px;
            max-height: 80px;
            border-radius: 4px;
            object-fit: cover;
            margin-right: 10px;
            border: 1px solid var(--border);
        }

        .card[onclick] {
            cursor: pointer;
            transition: border-color 0.2s, transform 0.15s;
        }

        .card[onclick]:hover {
            border-color: var(--accent);
            transform: translateY(-3px);
        }

        .loading-indicator {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            background: var(--accentbg);
            border-radius: 8px;
            margin-bottom: 12px;
            border: 1px solid var(--accent);
        }

        .loading-indicator.active {
            display: flex;
        }

        .sync-status {
            font-size: 10px;
            color: var(--text3);
            padding: 4px 10px;
            background: var(--bg3);
            border-radius: 12px;

<body>

    <script>
        // ============================================================
        // CONFIGURATION GOOGLE SHEETS VIA APPS SCRIPT
        // ============================================================
        const GOOGLE_SHEETS_CONFIG = {
            webAppUrl: 'https://script.google.com/macros/s/AKfycbxlB521biVBHT0bijDHv0CwSi_eKNaoWBit8UJJUCaYX3hLM4kiqfHulweZOPLVx04ubg/exec',
            sheets: {
                projets: 'Projets',
                activites: 'Activites',
                ressources: 'Ressources',
                documents: 'Documents'
            }
        };

        // ============================================================
        // STATE
        // ============================================================
        let DB = {
            projets: [],
            activites: [],
            ressources: [],
            documents: []
        };
        let cur = 'accueil',
            selectedAct = null;
        let isSyncing = false;
        let isLoaded = false;

        // ============================================================
        // GESTION ROBUSTE DES DATES
        // ============================================================
        
        function parseDate(dateStr) {
            if (!dateStr) return null;
            if (typeof dateStr === 'string' && dateStr.match(/^\d{4}-\d{2}-\d{2}$/)) {
                const parts = dateStr.split('-').map(Number);
                if (parts.length === 3 && parts.every(p => !isNaN(p))) {
                    return new Date(parts[0], parts[1] - 1, parts[2]);
                }
            }
            if (dateStr instanceof Date) {
                const d = new Date(dateStr);
                d.setHours(0, 0, 0, 0);
                return d;
            }
            try {
                const d = new Date(dateStr);
                if (!isNaN(d.getTime())) {
                    d.setHours(0, 0, 0, 0);
                    return d;
                }
            } catch (e) {}
            return null;
        }

        function formatDateInput(dateStr) {
            if (!dateStr) return '';
            const date = parseDate(dateStr);
            if (!date) return '';
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function formatDateFr(dateStr) {
            if (!dateStr) return '—';
            const date = parseDate(dateStr);
            if (!date) return '—';
            return date.toLocaleDateString('fr-FR', { 
                day: '2-digit', 
                month: '2-digit', 
                year: 'numeric' 
            });
        }

        function getToday() {
            const now = new Date();
            now.setHours(0, 0, 0, 0);
            return now;
        }

        function compareDates(dateStr1, dateStr2) {
            if (!dateStr1 || !dateStr2) return 0;
            const d1 = parseDate(dateStr1);
            const d2 = parseDate(dateStr2);
            if (!d1 || !d2) return 0;
            return d1.getTime() - d2.getTime();
        }

        function isDatePast(dateStr) {
            if (!dateStr) return false;
            const date = parseDate(dateStr);
            if (!date) return false;
            const today = getToday();
            return date < today;
        }

        function daysLeft(dateStr) {
            if (!dateStr) return Infinity;
            const date = parseDate(dateStr);
            if (!date) return Infinity;
            const today = getToday();
            return Math.ceil((date - today) / (1000 * 60 * 60 * 24));
        }

        function daysLate(dateStr) {
            if (!dateStr) return 0;
            const date = parseDate(dateStr);
            if (!date) return 0;
            const today = getToday();
            return Math.floor((today - date) / (1000 * 60 * 60 * 24));
        }

        function isActivityLate(activite) {
            if (!activite || activite.statut === 'Terminée') return false;
            if (!activite.fp) return false;
            return isDatePast(activite.fp);
        }

        function isActivitySoon(activite, days = 7) {
            if (!activite || activite.statut === 'Terminée') return false;
            if (!activite.fp) return false;
            const left = daysLeft(activite.fp);
            return left >= 0 && left <= days;
        }

        function calcProgress(tc, nbt) {
            return nbt > 0 ? Math.round((tc / nbt) * 100) : 0;
        }

        // ============================================================
        // UTILITIES
        // ============================================================
        const pName = (id) => { const p = DB.projets.find(x => x.id == id); return p ? p.nom : '—' };
        const pById = (id) => DB.projets.find(x => x.id == id);
        const maxId = (arr) => arr.length ? Math.max(...arr.map(x => x.id)) + 1 : 1;
        const fd = formatDateFr;
        const fe = (v) => parseFloat(v || 0).toLocaleString('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
        const pct = calcProgress;
        const retards = () => DB.activites.filter(a => isActivityLate(a));
        const statusColor = (s) => ({ Terminée: 'b-green', 'En cours': 'b-blue', 'Non démarrée': 'b-gray', Suspendue: 'b-yellow' }[s] || 'b-gray');
        const prioColor = (p) => ({ Critique: 'b-red', Élevée: 'b-yellow', Moyenne: 'b-blue', Faible: 'b-gray' }[p] || 'b-gray');
        const avatarColor = (name) => { const colors = ['#6366F1', '#10B981', '#F59E0B', '#EF4444', '#3B82F6', '#A855F7', '#EC4899']; const i = name.charCodeAt(0) % colors.length; return colors[i] };

        function autoStatut(nbt, tc) { if (tc >= nbt) return 'Terminée'; if (tc > 0) return 'En cours'; return 'Non démarrée'; }

        function updateBadges() {
            const n = retards().length;
            document.getElementById('badge-nb').textContent = n;
            document.getElementById('top-badge').style.display = n > 0 ? 'flex' : 'none';
            document.getElementById('top-badge-n').textContent = n;
        }

        function notify(msg, type = 'success') {
            const z = document.getElementById('notif-zone');
            const ic = { success: 'check-circle', error: 'exclamation-circle', info: 'info-circle' }[type] || 'check-circle';
            const col = { success: 'var(--green)', error: 'var(--red)', info: 'var(--blue)' }[type] || 'var(--green)';
            const div = document.createElement('div');
            div.className = 'notif-item';
            div.innerHTML = `<i class="fas fa-${ic}" style="color:${col}"></i>${msg}`;
            z.appendChild(div);
            setTimeout(() => div.remove(), 4000);
        }

        function showLoading(show) {
            const el = document.getElementById('loading-indicator');
            if (show) el.classList.add('active');
            else el.classList.remove('active');
        }

        function updateSyncStatus(synced, message) {
            const statusEl = document.getElementById('syncStatus');
            if (synced) {
                statusEl.className = 'sync-status synced';
                statusEl.innerHTML = `<i class="fas fa-check-circle"></i> ${message || 'Synchronisé'}`;
            } else {
                statusEl.className = 'sync-status error';
                statusEl.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${message || 'Erreur'}`;
            }
        }

        // ============================================================
        // GOOGLE SHEETS - LECTURE VIA APPS SCRIPT
        // ============================================================
        function readFromSheets() {
            return new Promise((resolve, reject) => {
                const url = GOOGLE_SHEETS_CONFIG.webAppUrl + '?action=readAll';

                fetch(url)
                    .then(response => {
                        if (!response.ok) {
                            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                        }
                        return response.json();
                    })
                    .then(data => {
                        if (data.error) {
                            reject(new Error(data.error));
                        } else {
                            resolve({
                                projets: data.projets || [],
                                activites: data.activites || [],
                                ressources: data.ressources || [],
                                documents: data.documents || []
                            });
                        }
                    })
                    .catch(reject);
            });
        }

        // ============================================================
        // GOOGLE SHEETS - ÉCRITURE VIA APPS SCRIPT
        // ============================================================
        function writeToSheets() {
            return new Promise((resolve, reject) => {
                const url = GOOGLE_SHEETS_CONFIG.webAppUrl;

                const cleanData = {
                    projets: DB.projets.map(p => ({
                        ...p,
                        debut: p.debut || null,
                        fin: p.fin || null
                    })),
                    activites: DB.activites.map(a => ({
                        ...a,
                        dp: a.dp || null,
                        fp: a.fp || null,
                        dr: a.dr || null,
                        fr: a.fr || null,
                        tags: Array.isArray(a.tags) ? a.tags : []
                    })),
                    ressources: DB.ressources,
                    documents: DB.documents.map(d => ({
                        ...d,
                        date: d.date || null
                    }))
                };

                const payload = {
                    action: 'writeAll',
                    ...cleanData
                };

                fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.error) {
                        reject(new Error(data.error));
                    } else {
                        resolve(data);
                    }
                })
                .catch(error => {
                    console.error('❌ Erreur fetch:', error);
                    reject(error);
                });
            });
        }

        // ============================================================
        // SYNCHRONISATION
        // ============================================================
        async function syncAll(showNotification = true) {
            if (isSyncing) {
                if (showNotification) notify('Synchronisation déjà en cours...', 'info');
                return;
            }

            const btn = document.getElementById('syncBtn');
            const originalText = btn.innerHTML;

            try {
                isSyncing = true;
                showLoading(true);
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Chargement...';
                btn.disabled = true;
                updateSyncStatus(false, 'Chargement...');

                const data = await readFromSheets();

                DB.projets = data.projets || [];
                DB.activites = data.activites || [];
                DB.ressources = data.ressources || [];
                DB.documents = data.documents || [];

                isLoaded = true;
                updateSyncStatus(true, ``);

                if (showNotification) {
                    notify(`✅ ${DB.activites.length} activités chargées`, 'success');
                }

                refreshCurrentPage();
                updateBadges();

            } catch (error) {
                console.error('Erreur de chargement:', error);
                updateSyncStatus(false, '⚠️ Erreur de connexion');
                if (showNotification) {
                    notify(`⚠️ ${error.message || 'Impossible de charger les données'}`, 'error');
                }
                DB.projets = [];
                DB.activites = [];
                DB.ressources = [];
                DB.documents = [];
                isLoaded = true;
                refreshCurrentPage();
            } finally {
                isSyncing = false;
                showLoading(false);
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // ============================================================
        // SAUVEGARDE UNIQUEMENT SUR SHEETS
        // ============================================================
        function save() {
            writeToSheets()
                .then(() => {
                    updateSyncStatus(true, `✅ ${DB.activites.length} act. · ${DB.projets.length} proj.`);
                    notify('✅ Données sauvegardées sur Google Sheets', 'success');
                })
                .catch(err => {
                    console.error('❌ Erreur de sauvegarde:', err);
                    updateSyncStatus(false, '⚠️ Erreur de sauvegarde');
                    notify(`⚠️ Erreur: ${err.message || 'Impossible de sauvegarder'}`, 'error');
                });
        }

        // ============================================================
        // MODAL
        // ============================================================
        function openModal(title, body, foot = '') {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = body;
            document.getElementById('modal-foot').innerHTML = foot;
            document.getElementById('modal-overlay').classList.add('open');
        }

        function closeModal() { document.getElementById('modal-overlay').classList.remove('open') }

        // ============================================================
        // EXPORT CSV
        // ============================================================
        function exportCSV() {
            let csv = 'ID;Projet;Activité;Responsable;Priorité;Statut;Avancement;Budget Prévu;Budget Réel;Date Début;Date Fin\n';
            DB.activites.forEach(a => csv +=
                `${a.id};${pName(a.pid)};${a.nom};${a.resp};${a.prio};${a.statut};${pct(a.tc, a.nbt)}%;${a.bprev};${a.breel};${a.dp || ''};${a.fp || ''}\n`
            );
            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const l = document.createElement('a');
            l.href = URL.createObjectURL(blob);
            l.download = 'activites_ong.csv';
            l.click();
            notify('Export CSV téléchargé', 'success');
        }

        // ============================================================
        // NAVIGATION
        // ============================================================
        function go(p) {
            document.querySelectorAll('.nav-btn[data-p]').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
            const btn = document.querySelector(`.nav-btn[data-p="${p}"]`);
            const pg = document.getElementById('page-' + p);
            if (btn) btn.classList.add('active');
            if (pg) pg.classList.add('active');
            cur = p;
            const titles = {
                accueil: 'Accueil',
                saisie: 'Nouvelle activité',
                bdd: 'Base de données',
                projets: 'Gestion des projets',
                gantt: 'Diagramme de Gantt',
                kanban: 'Vue Kanban',
                ressources: 'Ressources humaines',
                tableau: 'Analytics & KPIs',
                alertes: 'Alertes & Retards',
                budget: 'Suivi budgétaire',
                docs: 'Documents & Rapports'
            };
            document.getElementById('top-title').textContent = titles[p] || p;
            updateBadges();
            refreshCurrentPage();
        }

        function refreshCurrentPage() {
            if (!isLoaded) {
                const c = document.getElementById('page-' + cur);
                if (c) {
                    c.innerHTML = `<div class="empty"><i class="fas fa-spinner fa-spin" style="font-size:32px;"></i><div style="margin-top:12px;">Chargement depuis Google Sheets...</div></div>`;
                }
                return;
            }
            const c = document.getElementById('page-' + cur);
            if (!c) return;
            ({ accueil: buildAccueil, saisie: buildSaisie, bdd: buildBDD, projets: buildProjets, gantt: buildGantt, kanban: buildKanban, ressources: buildRessources, tableau: buildTableau, alertes: buildAlertes, budget: buildBudget, docs: buildDocs }[cur] || (() => { }))(c);
        }

        // ============================================================
        // PAGE ACCUEIL
        // ============================================================
        function buildAccueil(c) {

              <div style="color:var(--text3); font-size:11px; margin-top:6px;"></div>
            </div>

            <div style="margin-bottom:36px;">
              <h3 style="font-size:18px; font-weight:700; color:var(--text); margin-bottom:16px;">Fonctionnalités principales</h3>
              <div class="g4">
                ${[
                    { icon: 'fa-pen', label: 'Saisie d\'activités', desc: 'Formulaire intelligent avec statut auto-calculé', page: 'saisie' },
                    { icon: 'fa-stream', label: 'Diagramme de Gantt', desc: 'Visualisation interactive des plannings avec zoom.', page: 'gantt' },
                    { icon: 'fa-bell', label: 'Alertes & Retards', desc: 'Détection automatique des retards et échéances', page: 'alertes' },
                    { icon: 'fa-chart-pie', label: 'Tableaux de bord', desc: 'Analyses visuelles avec graphiques interactifs et filtres', page: 'tableau' },
                    { icon: 'fa-wallet', label: 'Suivi budgétaire', desc: 'Comparaison budget prévu vs réel avec indicateurs de performance', page: 'budget' },
                    { icon: 'fa-file-alt', label: 'Documents & Rapports', desc: 'Gestion documentaire avec upload de PDF, images et galerie photo', page: 'docs' },
                    { icon: 'fa-database', label: 'Base de données', desc: 'Stockage persistant Sheets avec recherche, filtrage et export CSV', page: 'bdd' },
                    { icon: 'fa-palette', label: 'Thème adaptable', desc: 'Interface moderne avec mode sombre et clair pour un confort visuel optimal', page: null }
                ].map(f => `
                  <div class="card" style="padding:16px; text-align:center; cursor:${f.page ? 'pointer' : 'default'}; transition:border-color 0.2s;"
                       ${f.page ? `onclick="go('${f.page}')"` : ''}>
                    <i class="fas ${f.icon}" style="font-size:28px; color:var(--accent2); margin-bottom:8px;"></i>
                    <div style="font-weight:700; font-size:14px; color:var(--text);">${f.label}</div>
                    <div style="font-size:12px; color:var(--text2); margin-top:4px;">${f.desc}</div>
                  </div>
                `).join('')}
              </div>
            </div>

            <div style="margin-bottom:30px;">
              <h3 style="font-size:18px; font-weight:700; color:var(--text); margin-bottom:16px;">Comment ça marche ?</h3>
              <div class="g3">
                <div class="card" style="padding:20px; text-align:center;">
                  <i class="fas fa-folder-open" style="font-size:32px; color:var(--accent2); margin-bottom:8px;"></i>
                  <div style="font-weight:700; font-size:15px; color:var(--text);">Créez vos projets</div>
                  <div style="font-size:12px; color:var(--text2); margin-top:4px;">Ajoutez des projets et activités avec dates, budgets et responsables</div>
                </div>
                <div class="card" style="padding:20px; text-align:center;">
                  <i class="fas fa-chart-line" style="font-size:32px; color:var(--accent2); margin-bottom:8px;"></i>
                  <div style="font-weight:700; font-size:15px; color:var(--text);">Suivez l'avancement</div>
                  <div style="font-size:12px; color:var(--text2); margin-top:4px;">Visualisez les plannings Gantt, indicateurs et alertes automatiques</div>
                </div>
                <div class="card" style="padding:20px; text-align:center;">
                  <i class="fas fa-file-export" style="font-size:32px; color:var(--accent2); margin-bottom:8px;"></i>
                  <div style="font-weight:700; font-size:15px; color:var(--text);">Analysez et exportez</div>
                  <div style="font-size:12px; color:var(--text2); margin-top:4px;">Générez des rapports budgétaires et exportez vos données en CSV</div>
                </div>
              </div>
            </div>

            <div style="text-align:center; color:var(--text3); font-size:12px; border-top:1px solid var(--border); padding-top:18px; margin-top:10px;">
              © 2025 ONG Dashboard v3.0 — <i class="fas fa-cloud"></i> Stockage 100% Google Sheets
            </div>
          `;
        }

        // ============================================================
        // PAGE SAISIE
        // ============================================================
        function buildSaisie(c) {
            const a = selectedAct;
            
            const dpVal = a && a.dp ? formatDateInput(a.dp) : '';
            const fpVal = a && a.fp ? formatDateInput(a.fp) : '';
            const drVal = a && a.dr ? formatDateInput(a.dr) : '';
            const frVal = a && a.fr ? formatDateInput(a.fr) : '';
            
            c.innerHTML = `
            <div class="card">
                <div class="card-head">
                    <span class="card-title">${a ? '<i class="fas fa-edit" style="color:var(--yellow);margin-right:6px"></i>Modifier l\'activité' : '<i class="fas fa-plus-circle" style="color:var(--green);margin-right:6px"></i>Nouvelle activité'}</span>
                    ${a ? `<span class="badge ${statusColor(a.statut)}">${a.statut}</span>` : ''}
                    <span class="cloud-badge"><i class="fas fa-cloud"></i> Sheets</span>
                </div>
                <div class="card-body">
                    <div class="g2">
                        <div>
                            <div class="fld"><label class="fld-lbl">N° activité</label><input id="s-id" value="${a ? a.id : maxId(DB.activites)}" disabled></div>
                            <div class="fld"><label class="fld-lbl">Projet *</label><select id="s-pid">${DB.projets.map(p => `<option value="${p.id}" ${a && a.pid == p.id ? 'selected' : ''}>${p.nom}</option>`).join('')}</select></div>
                            <div class="fld"><label class="fld-lbl">Nom de l'activité *</label><input id="s-nom" value="${a ? a.nom : ''}" placeholder="Ex: Forage de puits zone nord"></div>
                            <div class="fld"><label class="fld-lbl">Responsable *</label><select id="s-resp">${DB.ressources.map(r => `<option ${a && a.resp == r.nom ? 'selected' : ''}>${r.nom}</option>`).join('')}<option ${a && !DB.ressources.find(r => r.nom == a?.resp) ? 'selected' : ''}>Autre</option></select></div>
                            <div style="display:flex;gap:10px">
                                <div class="fld" style="flex:1"><label class="fld-lbl">Priorité</label><select id="s-prio"><option>Faible</option><option>Moyenne</option><option>Élevée</option><option>Critique</option></select></div>
                                <div class="fld" style="flex:1"><label class="fld-lbl">Statut (auto)</label><input id="s-statut" value="${a ? a.statut : 'Non démarrée'}" disabled></div>
                            </div>
                            <div class="fld"><label class="fld-lbl">Domaine d'activité</label><input id="s-domaine" value="${a ? (Array.isArray(a.tags) ? a.tags.join(', ') : a.tags || '') : ''}" placeholder="Ex: Santé, Éducation, Eau, Logistique..."></div>
                        </div>
                        <div>
                            <div class="fld"><label class="fld-lbl">Dates prévues</label>
                                <div style="display:flex;gap:8px">
                                    <input type="date" id="s-dp" value="${dpVal}">
                                    <input type="date" id="s-fp" value="${fpVal}">
                                </div>
                            </div>
                            <div class="fld"><label class="fld-lbl">Dates réelles</label>
                                <div style="display:flex;gap:8px">
                                    <input type="date" id="s-dr" value="${drVal}">
                                    <input type="date" id="s-fr" value="${frVal}">
                                </div>
                            </div>
                            <div style="display:flex;gap:10px">
                                <div class="fld" style="flex:1"><label class="fld-lbl">Nb tâches</label><input type="number" id="s-nbt" value="${a ? a.nbt : 1}" min="1"></div>
                                <div class="fld" style="flex:1"><label class="fld-lbl">Complétées</label><input type="number" id="s-tc" value="${a ? a.tc : 0}" min="0"></div>
                            </div>
                            <div id="s-prog-wrap" style="margin-bottom:12px">
                                <div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:4px"><span style="color:var(--text3)">Avancement calculé</span><span id="s-prog-val" style="font-weight:700;color:var(--accent2)">0%</span></div>
                                <div class="prog-track prog-lg"><div class="prog-fill" id="s-prog-bar" style="width:0%;background:var(--accent)"></div></div>
                            </div>
                            <div style="display:flex;gap:10px">
                                <div class="fld" style="flex:1"><label class="fld-lbl">Budget prévu (€)</label><input type="number" id="s-bprev" value="${a ? a.bprev : 0}" min="0"></div>
                                <div class="fld" style="flex:1"><label class="fld-lbl">Budget réel (€)</label><input type="number" id="s-breel" value="${a ? a.breel : 0}" min="0"></div>
                            </div>
                            <div class="fld"><label class="fld-lbl">Variance budgétaire</label>
                                <div id="s-bvar" style="padding:8px 11px;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;font-size:12px;font-weight:700">—</div>
                            </div>
                        </div>
                    </div>
                    <div class="fld"><label class="fld-lbl">Notes / Commentaires</label><textarea id="s-notes" rows="3">${a ? a.notes || '' : ''}</textarea></div>
                    <div class="btn-group" style="justify-content:center;margin-top:14px">
                        <button class="btn btn-primary" id="btn-save"><i class="fas fa-save"></i> Enregistrer</button>
                        ${a ? '<button class="btn btn-danger" id="btn-del"><i class="fas fa-trash"></i> Supprimer</button>' : ''}
                        <button class="btn btn-ghost" id="btn-reset"><i class="fas fa-broom"></i> Réinitialiser</button>
                    </div>
                </div>
            </div>`;

            if (a) {
                document.getElementById('s-prio').value = a.prio || 'Moyenne';
                document.getElementById('s-tc').value = Math.min(a.tc || 0, a.nbt || 1);
            }

            function updateProg() {
                const nbt = parseInt(document.getElementById('s-nbt').value) || 1;
                const tc = Math.min(parseInt(document.getElementById('s-tc').value) || 0, nbt);
                const p = pct(tc, nbt);
                document.getElementById('s-statut').value = autoStatut(nbt, tc);
                document.getElementById('s-prog-val').textContent = p + '%';
                document.getElementById('s-prog-bar').style.width = p + '%';
                document.getElementById('s-prog-bar').style.background = p >= 80 ? 'var(--green)' : p >= 40 ? 'var(--yellow)' : 'var(--red)';
            }

            function updateBvar() {
                const bp = parseFloat(document.getElementById('s-bprev').value) || 0;
                const br = parseFloat(document.getElementById('s-breel').value) || 0;
                const v = bp - br;
                const el = document.getElementById('s-bvar');
                el.textContent = v >= 0 ? `✅ Économie: ${fe(v)}` : `⚠️ Dépassement: ${fe(Math.abs(v))}`;
                el.style.color = v >= 0 ? 'var(--green)' : 'var(--red)';
            }

            updateProg();
            updateBvar();

            document.getElementById('s-nbt').addEventListener('input', updateProg);
            document.getElementById('s-tc').addEventListener('input', updateProg);
            document.getElementById('s-bprev').addEventListener('input', updateBvar);
            document.getElementById('s-breel').addEventListener('input', updateBvar);

            document.getElementById('btn-save').addEventListener('click', () => {
                const nom = document.getElementById('s-nom').value.trim();
                const resp = document.getElementById('s-resp').value;
                if (!nom || !resp) { 
                    notify('Remplissez les champs obligatoires', 'error'); 
                    return; 
                }

                const dp = document.getElementById('s-dp').value || null;
                const fp = document.getElementById('s-fp').value || null;
                const dr = document.getElementById('s-dr').value || null;
                const fr = document.getElementById('s-fr').value || null;

                const nbt = parseInt(document.getElementById('s-nbt').value) || 1;
                const tc = Math.min(parseInt(document.getElementById('s-tc').value) || 0, nbt);

                const obj = {
                    id: a ? a.id : maxId(DB.activites),
                    pid: parseInt(document.getElementById('s-pid').value),
                    nom: nom,
                    resp: resp,
                    prio: document.getElementById('s-prio').value,
                    nbt: nbt,
                    tc: tc,
                    bprev: parseFloat(document.getElementById('s-bprev').value) || 0,
                    breel: parseFloat(document.getElementById('s-breel').value) || 0,
                    statut: document.getElementById('s-statut').value,
                    dp: dp,
                    fp: fp,
                    dr: dr,
                    fr: fr,
                    notes: document.getElementById('s-notes').value,
                    tags: document.getElementById('s-domaine').value ? 
                        document.getElementById('s-domaine').value.split(',').map(t => t.trim()).filter(t => t) : [],
                    deps: [],
                    progress: pct(tc, nbt)
                };

                if (dp && fp && compareDates(dp, fp) > 0) {
                    notify('⚠️ La date de début ne peut pas être après la date de fin', 'error');
                    return;
                }
                if (dr && fr && compareDates(dr, fr) > 0) {
                    notify('⚠️ La date de début réelle ne peut pas être après la date de fin réelle', 'error');
                    return;
                }

                if (a) {
                    const i = DB.activites.findIndex(x => x.id == a.id);
                    if (i >= 0) DB.activites[i] = obj;
                } else {
                    DB.activites.push(obj);
                }

                save();
                selectedAct = null;
                notify(a ? '✅ Activité mise à jour sur Sheets' : '✅ Activité créée sur Sheets', 'success');
                setTimeout(() => go('bdd'), 600);
            });

            if (a) {
                document.getElementById('btn-del').addEventListener('click', () => {
                    if (!confirm(`Supprimer "${a.nom}" ?`)) return;
                    DB.activites = DB.activites.filter(x => x.id != a.id);
                    save();
                    selectedAct = null;
                    notify('🗑️ Activité supprimée de Sheets', 'error');
                    go('bdd');
                });
            }

            document.getElementById('btn-reset').addEventListener('click', () => {
                selectedAct = null;
                buildSaisie(c);
            });
        }

        // ============================================================
        // PAGE BDD
        // ============================================================
        function buildBDD(c) {
            c.innerHTML = `
          <div class="fbar">
            <input id="bdd-q" placeholder="🔍 Rechercher..." style="width:200px">
            <select id="bdd-pid"><option value="">Tous projets</option>${DB.projets.map(p => `<option value="${p.id}">${p.nom}</option>`).join('')}</select>
            <select id="bdd-st"><option value="">Tous statuts</option><option>Non démarrée</option><option>En cours</option><option>Terminée</option><option>Suspendue</option></select>
            <select id="bdd-pr"><option value="">Toutes priorités</option><option>Faible</option><option>Moyenne</option><option>Élevée</option><option>Critique</option></select>
            <div class="tb-space"></div>
            <button class="btn btn-ghost btn-sm" onclick="exportCSV()"><i class="fas fa-download"></i> CSV</button>
            <button class="btn btn-primary btn-sm" onclick="selectedAct=null;go('saisie')"><i class="fas fa-plus"></i> Ajouter</button>
            <button class="btn btn-ghost btn-sm" onclick="syncAll()"><i class="fas fa-sync"></i> Rafraîchir</button>
          </div>
          <div class="card">
            <div class="card-head"><span class="card-title">Activités <span class="cloud-badge"><i class="fas fa-cloud"></i> Sheets</span></span><span id="bdd-cnt" style="font-size:11px;color:var(--text3)"></span></div>
            <div class="card-body"><table id="tbl-bdd" class="display" width="100%"></table></div>
          </div>`;

            function refresh() {
                const q = document.getElementById('bdd-q').value.toLowerCase();
                const pid = document.getElementById('bdd-pid').value;
                const st = document.getElementById('bdd-st').value;
                const pr = document.getElementById('bdd-pr').value;
                let data = DB.activites;
                if (q) data = data.filter(a => a.nom.toLowerCase().includes(q) || a.resp.toLowerCase().includes(q) || (a.tags &&
                    a.tags.some(t => t.toLowerCase().includes(q))));
                if (pid) data = data.filter(a => a.pid == pid);
                if (st) data = data.filter(a => a.statut === st);
                if (pr) data = data.filter(a => a.prio === pr);
                document.getElementById('bdd-cnt').textContent = data.length + ' activité(s)';
                const rows = data.map(a => [
                    a.id,
                    pName(a.pid),
                    `<span style="font-weight:600;color:var(--text)">${a.nom}</span>${a.tags && a.tags.length ? `<div>${a.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>` : ''}`,
                    `<div style="display:flex;align-items:center;gap:6px"><div class="user-avatar" style="background:${avatarColor(a.resp)};width:22px;height:22px;font-size:9px">${a.resp.charAt(0)}</div>${a.resp}</div>`,
                    `<span class="badge ${prioColor(a.prio)}">${a.prio}</span>`,
                    `<span class="badge ${statusColor(a.statut)}">${a.statut}</span>`,
                    `<div style="display:flex;align-items:center;gap:8px;min-width:80px"><div class="prog-track" style="flex:1;height:5px"><div class="prog-fill" style="width:${pct(a.tc, a.nbt)}%;background:${pct(a.tc, a.nbt) >= 80 ? 'var(--green)' : pct(a.tc, a.nbt) >= 40 ? 'var(--yellow)' : 'var(--red)'}"></div></div><span style="font-size:10px;font-weight:700;color:var(--text3);width:28px">${pct(a.tc, a.nbt)}%</span></div>`,
                    fd(a.fp),
                    isActivityLate(a) ?
                        `<span class="badge b-red">⚠ ${daysLate(a.fp)}j retard</span>` :
                        `<span style="font-size:11px;color:var(--text3)">${a.fp ? daysLeft(a.fp) + 'j restants' : '—'}</span>`
                ]);
                if ($.fn.DataTable.isDataTable('#tbl-bdd')) $('#tbl-bdd').DataTable().destroy();
                $('#tbl-bdd').DataTable({
                    data: rows,
                    columns: [
                        { title: '#' }, { title: 'Projet' }, { title: 'Activité' }, { title: 'Responsable' },
                        { title: 'Priorité' }, { title: 'Statut' }, { title: 'Avancement' }, { title: 'Fin prévue' },
                        { title: 'Délai' }
                    ],
                    pageLength: 10,
                    order: [
                        [0, 'asc']
                    ],
                    language: { url: '//cdn.datatables.net/plug-ins/1.10.11/i18n/French.json' }
                });
                $('#tbl-bdd tbody').off('click').on('click', 'tr', function () {
                    const id = parseInt($(this).find('td:first').text());
                    const act = DB.activites.find(a => a.id == id);
                    if (act) {
                        selectedAct = act;
                        go('saisie');
                    }
                });
            }
            refresh();
            ['bdd-q', 'bdd-pid', 'bdd-st', 'bdd-pr'].forEach(id => document.getElementById(id).addEventListener('input',
                refresh));
            ['bdd-pid', 'bdd-st', 'bdd-pr'].forEach(id => document.getElementById(id).addEventListener('change', refresh));
        }

        // ============================================================
        // PAGE PROJETS - AVEC MODIFICATION
        // ============================================================
        // ============================================================
// PAGE PROJETS - PARTIE À MODIFIER
// ============================================================
function buildProjets(c) {
    c.innerHTML = `
  <div class="section-head">
    <div class="section-title">Gestion des projets <span class="cloud-badge"><i class="fas fa-cloud"></i> Sheets</span></div>
    <button class="btn btn-primary btn-sm" onclick="showNewProjet()"><i class="fas fa-plus"></i> Nouveau projet</button>

  <div class="g3">
    ${DB.projets.map(p => {
        const acts = DB.activites.filter(a => a.pid == p.id);
        const av = acts.length ? Math.round(acts.reduce((s, a) => s + pct(a.tc, a.nbt), 0) / acts.length) : 0;
        const ret = acts.filter(a => isActivityLate(a)).length;
        const bprev = acts.reduce((s, a) => s + (a.bprev || 0), 0);
        const breel = acts.reduce((s, a) => s + (a.breel || 0), 0);
        const budgetPct = pct(breel, bprev);
        return `<div class="card" style="border-top:3px solid ${p.couleur};position:relative;cursor:pointer" onclick="openProjetDetail(${p.id})">
                <div class="card-head">
                  <span class="card-title">${p.nom}</span>
                  <div style="display:flex;align-items:center;gap:6px;margin:0 8px;">
                    <button class="btn btn-primary btn-icon btn-sm" onclick="event.stopPropagation();editProjet(${p.id})" title="Modifier le projet" style="padding:3px 8px;font-size:10px;min-height:26px;">
                      <i class="fas fa-edit"></i>
                    </button>
                    <button class="btn btn-danger btn-icon btn-sm" onclick="event.stopPropagation();deleteProjet(${p.id})" title="Supprimer le projet" style="padding:3px 8px;font-size:10px;min-height:26px;">
                      <i class="fas fa-trash"></i>
                    </button>
                  </div>
                  <span class="badge ${p.statut === 'En cours' ? 'b-blue' : p.statut === 'Terminé' ? 'b-green' : 'b-gray'}">${p.statut}</span>
                </div>
                <div class="card-body">
                  <div style="font-size:11.5px;color:var(--text2);margin-bottom:12px">${p.desc}</div>
                  <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--text3);margin-bottom:5px"><span>Avancement</span><span style="font-weight:700;color:${p.couleur}">${av}%</span></div>
                  <div class="prog-track prog-lg" style="margin-bottom:10px"><div class="prog-fill" style="width:${av}%;background:${p.couleur}"></div></div>
                  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:10.5px">
                    <div style="background:var(--bg3);border-radius:6px;padding:7px"><div style="color:var(--text3)">Activités</div><div style="font-weight:700;color:var(--text)">${acts.length}</div></div>
                    <div style="background:var(--redbg);border-radius:6px;padding:7px"><div style="color:var(--text3)">Retards</div><div style="font-weight:700;color:var(--red)">${ret}</div></div>
                    <div style="background:var(--bg3);border-radius:6px;padding:7px"><div style="color:var(--text3)">Budget prévu</div><div style="font-weight:700;color:var(--text)">${fe(bprev)}</div></div>
                    <div style="background:${budgetPct > 100 ? 'var(--redbg)' : 'var(--greenbg)'};border-radius:6px;padding:7px"><div style="color:var(--text3)">Exécuté</div><div style="font-weight:700;color:${budgetPct > 100 ? 'var(--red)' : 'var(--green)'}">${budgetPct}%</div></div>
                  </div>
                  <div class="divider"></div>
                  <div style="display:flex;align-items:center;justify-content:space-between;font-size:11px">
                    <div style="display:flex;align-items:center;gap:6px"><div class="user-avatar" style="background:${avatarColor(p.chef)};width:22px;height:22px;font-size:9px">${p.chef.charAt(0)}</div><span style="color:var(--text2)">${p.chef}</span></div>
                    <span style="color:var(--text3)">${p.pays} · ${fd(p.debut)} → ${fd(p.fin)}</span>

    }).join('')}

}

        // ============================================================
        // FONCTIONS DE GESTION DES PROJETS - AVEC MODIFICATION
        // ============================================================
        
        function deleteProjet(id) {
            const p = DB.projets.find(x => x.id === id);
            if (!p) return;
            if (!confirm(`Supprimer définitivement le projet "${p.nom}" et toutes ses activités associées ?`)) return;
            DB.activites = DB.activites.filter(a => a.pid !== id);
            DB.projets = DB.projets.filter(x => x.id !== id);
            save();
            notify('Projet et ses activités supprimés de Sheets', 'error');
            refreshCurrentPage();
            updateBadges();
        }

        function showNewProjet() {
            openModal('Nouveau projet', `
            <div class="g2"><div>
              <div class="fld"><label class="fld-lbl">Nom du projet *</label><input id="np-nom"></div>
              <div class="fld"><label class="fld-lbl">Description</label><textarea id="np-desc" rows="2"></textarea></div>
              <div class="fld"><label class="fld-lbl">Chef de projet *</label>
                <input id="np-chef" list="chef-list" placeholder="Nom du chef de projet">
                <datalist id="chef-list">${DB.ressources.map(r => `<option value="${r.nom}">`).join('')}</datalist>
              </div>
              <div class="fld"><label class="fld-lbl">Pays / Zone</label><input id="np-pays"></div>
            </div><div>
              <div class="fld"><label class="fld-lbl">Date de début</label><input type="date" id="np-deb"></div>
              <div class="fld"><label class="fld-lbl">Date de fin</label><input type="date" id="np-fin"></div>
              <div class="fld"><label class="fld-lbl">Budget prévu (€)</label><input type="number" id="np-bp" min="0"></div>
              <div class="fld"><label class="fld-lbl">Statut</label><select id="np-st"><option>En préparation</option><option>En cours</option><option>Terminé</option><option>Suspendu</option></select></div>
              <div class="fld"><label class="fld-lbl">Couleur</label><input type="color" id="np-col" value="#6366F1" style="width:60px;height:36px;cursor:pointer;padding:2px"></div>
            </div></div>
          `, `<button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="saveNewProjet()"><i class="fas fa-save"></i> Créer sur Sheets</button>`);
        }

        function saveNewProjet() {
            const nom = document.getElementById('np-nom').value.trim();
            const chef = document.getElementById('np-chef').value.trim();
            if (!nom) { notify('Nom requis', 'error'); return; }
            if (!chef) { notify('Chef de projet requis', 'error'); return; }
            DB.projets.push({
                id: maxId(DB.projets),
                nom,
                desc: document.getElementById('np-desc').value,
                chef,
                pays: document.getElementById('np-pays').value,
                debut: document.getElementById('np-deb').value,
                fin: document.getElementById('np-fin').value,
                bprev: parseFloat(document.getElementById('np-bp').value) || 0,
                breel: 0,
                statut: document.getElementById('np-st').value,
                couleur: document.getElementById('np-col').value
            });
            save();
            closeModal();
            notify('Projet créé sur Sheets !');
            refreshCurrentPage();
        }

        // ============================================================
        // NOUVELLE FONCTION : MODIFIER UN PROJET
        // ============================================================
        function editProjet(id) {
            const p = DB.projets.find(x => x.id === id);
            if (!p) { notify('Projet introuvable', 'error'); return; }

            const debVal = p.debut ? formatDateInput(p.debut) : '';
            const finVal = p.fin ? formatDateInput(p.fin) : '';

            openModal(`Modifier le projet : ${p.nom}`, `
            <div class="g2"><div>
              <div class="fld"><label class="fld-lbl">Nom du projet *</label><input id="ep-nom" value="${p.nom}"></div>
              <div class="fld"><label class="fld-lbl">Description</label><textarea id="ep-desc" rows="2">${p.desc || ''}</textarea></div>
              <div class="fld"><label class="fld-lbl">Chef de projet *</label>
                <input id="ep-chef" list="chef-list2" value="${p.chef}" placeholder="Nom du chef de projet">
                <datalist id="chef-list2">${DB.ressources.map(r => `<option value="${r.nom}">`).join('')}</datalist>
              </div>
              <div class="fld"><label class="fld-lbl">Pays / Zone</label><input id="ep-pays" value="${p.pays || ''}"></div>

        function saveEditProjet(id) {

            const nom = document.getElementById('ep-nom').value.trim();
            const chef = document.getElementById('ep-chef').value.trim();
            if (!nom) { notify('Nom du projet requis', 'error'); return; }
            if (!chef) { notify('Chef de projet requis', 'error'); return; }

            const oldNom = p.nom;
            const newNom = nom;

            // Mettre à jour le projet
            p.nom = newNom;
            p.desc = document.getElementById('ep-desc').value;
            p.chef = chef;
            p.pays = document.getElementById('ep-pays').value;

                    if (a.pid === p.id) {
                        // On ne change que l'affichage, le pid reste le même
                        // Le nom du projet est stocké séparément
                    }
                });
            }

            save();
            closeModal();
            notify(`✅ Projet "${newNom}" mis à jour sur Sheets`, 'success');
            refreshCurrentPage();
