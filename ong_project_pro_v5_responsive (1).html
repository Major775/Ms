<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>ONG Project Pro — v5.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
    <style>
        :root {
            --bg: #0F172A; --bg2: #1E293B; --bg3: #162033; --sidebar: #0A1628;
            --text: #E2E8F0; --text2: #94A3B8; --text3: #64748B;
            --border: rgba(255, 255, 255, 0.07); --border2: rgba(255, 255, 255, 0.12);
            --accent: #6366F1; --accent2: #818CF8; --accentbg: rgba(99, 102, 241, 0.15);
            --green: #10B981; --greenbg: rgba(16, 185, 129, 0.15);
            --red: #EF4444; --redbg: rgba(239, 68, 68, 0.15);
            --yellow: #F59E0B; --yellowbg: rgba(245, 158, 11, 0.15);
            --blue: #3B82F6; --bluebg: rgba(59, 130, 246, 0.15);
            --orange: #F97316; --orangebg: rgba(249, 115, 22, 0.15);
            --purple: #A855F7; --purplebg: rgba(168, 85, 247, 0.15);
            --radius: 10px; --radius2: 14px; --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }
        body.light {
            --bg: #F1F5F9; --bg2: #FFFFFF; --bg3: #F8FAFC; --sidebar: #FFFFFF;
            --text: #1E293B; --text2: #475569; --text3: #94A3B8;
            --border: rgba(0, 0, 0, 0.07); --border2: rgba(0, 0, 0, 0.12);
            --accent: #4F46E5; --accent2: #4F46E5; --accentbg: rgba(79, 70, 229, 0.09);
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
        html { font-size: 13px; scroll-behavior: smooth }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden }
        ::-webkit-scrollbar { width: 7px; height: 7px }
        ::-webkit-scrollbar-track { background: transparent }
        ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 4px }
        .shell { display: flex; min-height: 100vh }

        /* ---------- SIDEBAR ---------- */
        .sb { width: 228px; min-width: 228px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 200; overflow-y: auto; transition: transform .3s }
        .sb-logo { padding: 16px 14px; display: flex; align-items: center; gap: 9px; border-bottom: 1px solid var(--border) }
        .sb-mark { width: 32px; height: 32px; background: linear-gradient(135deg, #4F46E5, #818CF8); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #fff; flex-shrink: 0; overflow: hidden }
        .sb-mark img { width: 100%; height: 100%; object-fit: contain; background: #fff }
        .sb-name { font-weight: 700; font-size: 13.5px; color: var(--text); line-height: 1.2 }
        .sb-tag { font-size: 9px; color: var(--text3); font-weight: 500; letter-spacing: .5px }
        .sb-section { font-size: 9px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; color: var(--text3); padding: 14px 14px 4px }
        .nav-btn { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 14px; background: none; border: none; border-left: 3px solid transparent; color: var(--text2); font-size: 12px; font-family: 'Inter', sans-serif; font-weight: 500; cursor: pointer; transition: all .15s; text-align: left; white-space: nowrap }
        .nav-btn i { width: 15px; text-align: center; font-size: 12px; flex-shrink: 0 }
        .nav-btn:hover { background: rgba(148, 163, 184, 0.08); color: var(--text) }
        .nav-btn.active { background: var(--accentbg); color: var(--accent2); border-left-color: var(--accent) }
        .nav-btn.sub { padding-left: 34px; font-size: 11.5px }
        .nav-group-toggle .nav-caret { margin-left: auto; font-size: 9px; width: auto; transition: transform .2s }
        .nav-group.open .nav-group-toggle .nav-caret { transform: rotate(180deg) }
        .nav-group.has-active .nav-group-toggle { color: var(--accent2) }
        .nav-sub-list { display: none; position: relative }
        .nav-sub-list::before { content: ''; position: absolute; left: 21px; top: 4px; bottom: 4px; width: 1px; background: var(--border2) }
        .nav-group.open .nav-sub-list { display: block }
        .nav-new { margin-left: auto; background: var(--purplebg); color: var(--purple); border-radius: 10px; padding: 1px 6px; font-size: 8.5px; font-weight: 800; letter-spacing: .4px }
        .dw-lock { font-size: 9px; color: var(--text3); margin-left: 2px }
        .vis-row { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 6px }
        .vis-row .t { flex: 1; min-width: 0; font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
        .vis-row.off .t { color: var(--text3); text-decoration: line-through }
        .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px }
        .stat.kpi { position: relative; align-items: flex-start }
        .stat.kpi .kpi-txt { min-width: 0; flex: 1 }
        .kpi-sub { font-size: 10px; color: var(--text3); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
        .kpi-target { margin-top: 7px }
        .kpi-target .prog-track { height: 4px }
        .kpi-target div.l { font-size: 9.5px; color: var(--text3); margin-top: 3px }
        .kpi-acts { position: absolute; top: 6px; right: 6px; display: none; gap: 2px; background: var(--bg2); border-radius: 6px }
        .stat.kpi:hover .kpi-acts { display: flex }
        .kpi-add { border: 2px dashed var(--border2); border-radius: var(--radius2); display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--text3); cursor: pointer; font-weight: 600; font-size: 12px; min-height: 72px; transition: all .2s }
        .kpi-add:hover { border-color: var(--accent); color: var(--accent2); background: var(--accentbg) }
        .kpi-cat { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; margin-bottom: 10px }
        .kpi-chip { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--bg3); border: 1px solid var(--border2); border-radius: 8px; cursor: pointer; font-size: 11.5px; color: var(--text2); text-align: left; font-family: inherit }
        .kpi-chip:hover:not(:disabled) { border-color: var(--accent); color: var(--accent2) }
        .kpi-chip:disabled { opacity: .45; cursor: default }
        .kpi-chip i { width: 16px; text-align: center }
        @media(max-width:800px) { .kpi-acts { display: flex } }
        .nav-badge { margin-left: auto; background: var(--redbg); color: var(--red); border-radius: 10px; padding: 1px 6px; font-size: 9px; font-weight: 700 }
        .nav-badge.cnt { background: var(--bluebg); color: var(--blue) }
        .sb-bottom { margin-top: auto; padding: 12px; border-top: 1px solid var(--border) }

        /* ---------- MAIN ---------- */
        .main { margin-left: 228px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; min-width: 0 }
        .topbar { background: var(--sidebar); border-bottom: 1px solid var(--border); padding: 0 20px; height: 52px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100 }
        .tb-title { font-size: 14px; font-weight: 700; color: var(--text) }
        .tb-space { flex: 1 }
        #menu-btn, .show-m { display: none }
        .search-btn { display: flex; align-items: center; gap: 8px; background: var(--bg3); border: 1px solid var(--border2); border-radius: 8px; padding: 6px 10px; color: var(--text3); font: 500 11.5px 'Inter', sans-serif; cursor: pointer; min-width: 230px; transition: border-color .15s }
        .search-btn:hover { border-color: var(--accent); color: var(--text2) }
        .kbd { display: inline-block; padding: 1px 6px; border: 1px solid var(--border2); border-bottom-width: 2px; border-radius: 5px; font-size: 10px; font-family: ui-monospace, monospace; background: var(--bg3); color: var(--text2); white-space: nowrap }
        .page { display: none; padding: 20px; min-height: calc(100vh - 52px) }
        .page.active { display: block }

        .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius2); overflow: hidden; margin-bottom: 16px }
        .card-head { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px }
        .card-title { font-size: 12.5px; font-weight: 700; color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
        .card-body { padding: 16px }
        .g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px }
        .g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 16px }
        .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px }
        .stat { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius2); padding: 16px; display: flex; align-items: center; gap: 12px; transition: border-color .2s; min-width: 0 }
        .stat:hover { border-color: var(--accent) }
        .stat-ico { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0 }
        .stat-val { font-size: 20px; font-weight: 700; line-height: 1.1; color: var(--text); word-break: break-word }
        .stat-lbl { font-size: 10.5px; color: var(--text3); margin-top: 3px }

        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border2); font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; transition: all .15s; white-space: nowrap; text-decoration: none; background: transparent; color: var(--text2) }
        .btn:disabled { opacity: .5; cursor: not-allowed }
        .btn-primary { background: linear-gradient(135deg, #4F46E5, #818CF8); color: #fff; border-color: transparent; box-shadow: 0 2px 8px rgba(79, 70, 229, .35) }
        .btn-primary:hover:not(:disabled) { opacity: .92; transform: translateY(-1px) }
        .btn-ghost { background: transparent; color: var(--text2) }
        .btn-ghost:hover:not(:disabled) { background: rgba(148, 163, 184, 0.1); color: var(--text) }
        .btn-sm { padding: 5px 10px; font-size: 11px }
        .btn-icon { width: 30px; height: 30px; padding: 0; justify-content: center; border-radius: 8px }
        .btn-sm.btn-icon { width: 26px; height: 26px }
        .btn-success { background: var(--greenbg); color: var(--green); border-color: transparent }
        .btn-danger { background: var(--redbg); color: var(--red); border-color: transparent }
        .btn-warn { background: var(--yellowbg); color: var(--yellow); border-color: transparent }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }

        .badge { display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: 700; letter-spacing: .3px; white-space: nowrap }
        .b-green { background: var(--greenbg); color: var(--green) }
        .b-red { background: var(--redbg); color: var(--red) }
        .b-yellow { background: var(--yellowbg); color: var(--yellow) }
        .b-blue { background: var(--bluebg); color: var(--blue) }
        .b-purple { background: var(--purplebg); color: var(--purple) }
        .b-gray { background: rgba(148, 163, 184, .15); color: var(--text2) }

        input, select, textarea { background: var(--bg3); border: 1px solid var(--border2); border-radius: 8px; color: var(--text); font-family: 'Inter', sans-serif; font-size: 12px; padding: 8px 11px; width: 100%; transition: border-color .15s; outline: none }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99, 102, 241, .18) }
        input:disabled { opacity: .6; cursor: not-allowed }
        input[type=checkbox], input[type=radio] { width: auto; accent-color: var(--accent); cursor: pointer }
        input[type=color] { padding: 2px; height: 32px; cursor: pointer }
        textarea { resize: vertical }
        .fld { margin-bottom: 11px }
        .fld-lbl { font-size: 10px; font-weight: 700; color: var(--text3); margin-bottom: 4px; display: block; text-transform: uppercase; letter-spacing: .5px }
        .chk { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text2); cursor: pointer; white-space: nowrap }

        .prog-track { height: 5px; background: rgba(148, 163, 184, .15); border-radius: 3px; overflow: hidden }
        .prog-fill { height: 100%; border-radius: 3px; transition: width .4s }
        .prog-lg { height: 8px }

        table.dataTable thead th { background: var(--bg3) !important; border-bottom: 1px solid var(--border) !important; font-weight: 700; font-size: 9.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--text3) !important; padding: 9px 11px !important }
        table.dataTable tbody td { padding: 9px 11px !important; border-bottom: 1px solid var(--border) !important; vertical-align: middle !important; color: var(--text); background: var(--bg2) !important; font-size: 12px }
        table.dataTable tbody tr:hover td { background: var(--bg3) !important; cursor: pointer }
        .dataTables_wrapper .dataTables_filter input, .dataTables_wrapper .dataTables_length select { background: var(--bg3) !important; border: 1px solid var(--border2) !important; color: var(--text) !important; border-radius: 8px !important; padding: 5px 10px !important; width: auto }
        .dataTables_wrapper .dataTables_info, .dataTables_wrapper .dataTables_paginate, .dataTables_wrapper .dataTables_length, .dataTables_wrapper .dataTables_filter { font-size: 11px; color: var(--text2) !important }
        .dataTables_wrapper .dataTables_paginate .paginate_button { border-radius: 6px !important; color: var(--text2) !important; background: transparent !important; border: none !important }
        .dataTables_wrapper .dataTables_paginate .paginate_button.current { background: var(--accentbg) !important; color: var(--accent2) !important; border: 1px solid var(--accent) !important }

        .alert-item { display: flex; align-items: flex-start; gap: 11px; padding: 11px 14px; border-radius: var(--radius); margin-bottom: 8px; cursor: pointer }
        .alert-item.error { background: var(--redbg); border: 1px solid rgba(239, 68, 68, .2) }
        .alert-item.warn { background: var(--yellowbg); border: 1px solid rgba(245, 158, 11, .2) }
        .alert-ico { font-size: 13px; margin-top: 1px }
        .alert-item.error .alert-ico { color: var(--red) }
        .alert-item.warn .alert-ico { color: var(--yellow) }
        .alert-text { flex: 1 }
        .alert-title { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 2px }
        .alert-sub { font-size: 11px; color: var(--text2) }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, .65); z-index: 500; align-items: center; justify-content: center; padding: 10px }
        .modal-overlay.open { display: flex }
        .modal { background: var(--bg2); border: 1px solid var(--border2); border-radius: 16px; width: 720px; max-width: 96vw; max-height: 92vh; overflow-y: auto; box-shadow: var(--shadow) }
        .modal.wide { width: 1140px }
        .modal-head { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--bg2); z-index: 3 }
        .modal-title { font-size: 14px; font-weight: 700; color: var(--text) }
        .modal-body { padding: 20px }
        .modal-foot { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; position: sticky; bottom: 0; background: var(--bg2); flex-wrap: wrap; z-index: 3 }
        .modal-foot:empty { display: none }

        .kanban-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px }
        .kanban-col { background: var(--bg3); border-radius: var(--radius2); padding: 12px; border: 1px solid var(--border); min-height: 200px; transition: background .15s, border-color .15s }
        .kanban-col.over { border-color: var(--accent); background: var(--accentbg) }
        .kanban-col-head { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--text3); margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between }
        .kanban-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 11px; margin-bottom: 8px; cursor: grab; transition: border-color .15s, opacity .15s }
        .kanban-card:hover { border-color: var(--accent) }
        .kanban-card.dragging { opacity: .35 }
        .kanban-card-title { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 5px }
        .kanban-card-meta { font-size: 10.5px; color: var(--text3); display: flex; align-items: center; gap: 8px; flex-wrap: wrap }

        .empty { text-align: center; padding: 36px; color: var(--text3) }
        .empty i { font-size: 28px; display: block; margin-bottom: 10px; opacity: .4 }
        .divider { height: 1px; background: var(--border); margin: 14px 0 }
        .tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; background: var(--accentbg); border: 1px solid var(--accent); border-radius: 8px; font-size: 10px; color: var(--accent2); margin: 2px }
        .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 10px; flex-wrap: wrap }
        .section-title { font-size: 16px; font-weight: 700; color: var(--text) }
        .user-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 10px; color: #fff; flex-shrink: 0 }
        .fbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; padding: 12px 14px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius2) }
        .fbar input, .fbar select { width: auto; min-width: 130px }
        .pbar { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; margin-bottom: 16px; display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap }
        .pbar select { width: auto; min-width: 120px }
        .pf { display: flex; flex-direction: column; gap: 4px }
        .pf label { font-size: 9.5px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: .8px }
        .pbadge { font-size: 11px; font-weight: 700; padding: 6px 12px; border-radius: 20px; background: var(--accentbg); color: var(--accent2); white-space: nowrap }
        .cloud-badge { background: var(--accentbg); color: var(--accent2); border: 1px solid var(--accent); padding: 2px 10px; border-radius: 12px; font-size: 9px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; vertical-align: middle }
        .banner { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: 10px; font-size: 12px; margin-bottom: 14px; color: var(--text); line-height: 1.5 }
        .banner.warn { background: var(--yellowbg); border: 1px solid rgba(245, 158, 11, .3) }
        .banner.warn > i { color: var(--yellow) }
        .banner.info { background: var(--bluebg); border: 1px solid rgba(59, 130, 246, .3) }
        .banner.info > i { color: var(--blue) }
        .seg { display: inline-flex; border: 1px solid var(--border2); border-radius: 8px; overflow: hidden; background: var(--bg3) }
        .seg button { background: none; border: none; color: var(--text2); padding: 6px 11px; font: 600 11px 'Inter', sans-serif; cursor: pointer; border-right: 1px solid var(--border2); white-space: nowrap }
        .seg button:last-child { border-right: none }
        .seg button.on { background: var(--accentbg); color: var(--accent2) }
        .seg button:hover:not(.on) { color: var(--text) }

        .notif { position: fixed; bottom: 20px; right: 20px; z-index: 999; display: flex; flex-direction: column; gap: 8px; pointer-events: none }
        .notif-item { background: var(--bg2); border: 1px solid var(--border2); border-radius: 10px; padding: 10px 16px; font-size: 12px; font-weight: 600; color: var(--text); box-shadow: var(--shadow); pointer-events: auto; animation: slideIn .3s ease; display: flex; align-items: center; gap: 8px; max-width: 420px }
        @keyframes slideIn { from { transform: translateX(100px); opacity: 0 } to { transform: translateX(0); opacity: 1 } }
        .loading-indicator { display: none; align-items: center; gap: 10px; padding: 10px 16px; background: var(--accentbg); border-radius: 8px; margin: 12px 20px 0; border: 1px solid var(--accent) }
        .loading-indicator.active { display: flex }
        .sync-status { font-size: 10px; color: var(--text3); padding: 4px 10px; background: var(--bg3); border-radius: 12px; display: flex; align-items: center; gap: 6px }
        .sync-status.synced { color: var(--green) }
        .sync-status.error { color: var(--red) }
        .doc-preview { width: 72px; height: 72px; border-radius: 6px; object-fit: cover; border: 1px solid var(--border); flex-shrink: 0 }
        .card[onclick] { cursor: pointer; transition: border-color .2s, transform .15s }
        .card[onclick]:hover { border-color: var(--accent); transform: translateY(-3px) }
        .dep-list { max-height: 120px; overflow-y: auto; background: var(--bg3); border: 1px solid var(--border2); border-radius: 8px; padding: 6px 10px }
        .dep-list label { display: flex; gap: 7px; align-items: center; font-size: 11.5px; color: var(--text2); padding: 3px 0; cursor: pointer }

        /* ---------- ACCUEIL ---------- */

            background: radial-gradient(circle at 85% 15%, rgba(129, 140, 248, .5), transparent 45%), radial-gradient(circle at 5% 115%, rgba(16, 185, 129, .3), transparent 42%), linear-gradient(135deg, #1E1B4B 0%, #312E81 55%, #4338CA 100%) }

        .hero .kbd { background: rgba(255, 255, 255, .12); color: #fff; border-color: rgba(255, 255, 255, .3) }

        .hero-panel .row { padding: 9px 0; border-bottom: 1px solid rgba(255, 255, 255, .1); font-size: 11.5px }

        .hero-panel .row b { font-size: 17px }

        .hero-panel .bar { height: 5px; background: rgba(255, 255, 255, .15); border-radius: 3px; overflow: hidden; margin-top: 6px }

        .home-h { font-size: 16px; font-weight: 700; margin: 26px 0 12px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap }

        .fi .s { font-size: 10.5px; color: var(--text3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
        .feed { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 11.5px; color: var(--text2) }
        .feed:last-child { border: none }

        .ph { margin-bottom: 11px; cursor: pointer }

        .mod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 12px }

        .why-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px }

        /* ---------- ACCUEIL : CARROUSEL VITRINE ---------- */
        .hs { position: relative; height: max(470px, calc(100vh - 150px)); border-radius: 18px; overflow: hidden; background: #0B1437; color: #fff; box-shadow: 0 18px 50px rgba(2, 6, 23, .45); isolation: isolate }
        .hs-slide { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity 1.1s ease, visibility 1.1s; display: flex; align-items: center; justify-content: center; text-align: center }
        .hs-slide.on { opacity: 1; visibility: visible; z-index: 1 }
        .hs-bg { position: absolute; inset: 0; background-size: cover; background-position: center; transform: scale(1.12); transition: transform 8s ease-out }
        .hs-slide.on .hs-bg { transform: scale(1) }
        .hs-ov { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10, 30, 80, .55) 0%, rgba(12, 35, 95, .62) 45%, rgba(8, 15, 40, .92) 100%), radial-gradient(ellipse at 50% 40%, transparent 0%, rgba(5, 10, 30, .55) 85%); mix-blend-mode: normal }
        .hs-ov::after { content: ''; position: absolute; inset: 0; background: rgba(37, 99, 235, .22); mix-blend-mode: color }
        .hs-content { position: relative; z-index: 2; max-width: 900px; padding: 0 90px }
        .hs-eyebrow { display: inline-flex; align-items: center; gap: 12px; font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: #BFDBFE; opacity: 0; transform: translateY(14px); transition: all .8s .2s }
        .hs-eyebrow span { width: 34px; height: 1px; background: rgba(191, 219, 254, .6) }
        .hs h1 { font-size: 42px; font-weight: 300; line-height: 1.18; letter-spacing: 1.5px; text-transform: uppercase; margin: 16px 0 14px; text-shadow: 0 2px 24px rgba(0, 0, 0, .35); opacity: 0; transform: translateY(22px); transition: all .9s .35s }
        .hs h1 b { font-weight: 800; background: linear-gradient(90deg, #fff, #93C5FD); -webkit-background-clip: text; background-clip: text; color: transparent }
        .hs-content p { font-size: 14.5px; line-height: 1.65; color: rgba(255, 255, 255, .85); max-width: 680px; margin: 0 auto; opacity: 0; transform: translateY(22px); transition: all .9s .5s }
        .hs-cta { display: flex; align-items: center; justify-content: center; gap: 26px; margin-top: 28px; flex-wrap: wrap; opacity: 0; transform: translateY(22px); transition: all .9s .65s }
        .hs-slide.on .hs-eyebrow, .hs-slide.on h1, .hs-slide.on .hs-content p, .hs-slide.on .hs-cta { opacity: 1; transform: none }
        .hs-play { display: flex; align-items: center; gap: 14px; background: none; border: none; color: #fff; cursor: pointer; font-family: inherit; text-align: left }
        .hs-play:focus { outline: none } .hs-play:focus-visible { outline: 2px solid #fff; outline-offset: 6px; border-radius: 10px }
        .hs-play-txt { font-size: 12.5px; line-height: 1.45; color: rgba(255, 255, 255, .9) }
        .hs-play-txt b { display: block; font-size: 11px; letter-spacing: 1.2px; font-weight: 700 }
        .hs-play-btn { position: relative; width: 54px; height: 54px; border-radius: 50%; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; transition: background .25s, color .25s }
        .hs-play-btn i { margin-left: 3px }
        .hs-play-btn::after { content: ''; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .6); animation: hsPulse 2.2s infinite }
        .hs-play:hover .hs-play-btn { background: #fff; color: #1E3A8A }
        @keyframes hsPulse { 0% { transform: scale(1); opacity: .9 } 100% { transform: scale(1.6); opacity: 0 } }
        .hs-btn { background: #fff; color: #1E3A8A; border: none; border-radius: 30px; padding: 12px 24px; font: 700 12.5px 'Inter', sans-serif; letter-spacing: .3px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); transition: transform .2s, box-shadow .2s }
        .hs-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0, 0, 0, .35) }
        .hs-arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 3; width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, .45); background: rgba(255, 255, 255, .06); color: #fff; cursor: pointer; font-size: 14px; backdrop-filter: blur(4px); transition: all .2s }
        .hs-arrow:hover { background: #fff; color: #1E3A8A; border-color: #fff }
        .hs-arrow.l { left: 22px } .hs-arrow.r { right: 22px }
        .hs-dots { position: absolute; right: 26px; bottom: 26px; z-index: 3; display: flex; gap: 8px }
        .hs-dots button { width: 9px; height: 9px; border-radius: 9px; border: none; background: rgba(255, 255, 255, .4); cursor: pointer; padding: 0; transition: all .3s }
        .hs-dots button.on { width: 26px; background: #fff }
        .hs-brand { position: absolute; top: 20px; left: 24px; z-index: 3; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 800; letter-spacing: .5px }
        .hs-brand i { font-style: normal; font-weight: 400; opacity: .7 }
        .hs-brand .m { width: 32px; height: 32px; border-radius: 8px; background: rgba(255, 255, 255, .15); border: 1px solid rgba(255, 255, 255, .3); display: flex; align-items: center; justify-content: center; overflow: hidden }
        .hs-brand .m img { width: 100%; height: 100%; object-fit: contain; background: #fff }
        .hs-hello { position: absolute; top: 24px; right: 26px; z-index: 3; font-size: 11.5px; color: rgba(255, 255, 255, .8) }
        .hs-progress { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255, 255, 255, .12); z-index: 3 }
        .hs-progress div { height: 100%; width: 0; background: linear-gradient(90deg, #60A5FA, #A5B4FC) }
        .hs-strip { position: relative; z-index: 4; display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin: -54px 34px 6px; background: var(--bg2); border: 1px solid var(--border2); border-radius: 16px; box-shadow: 0 16px 40px rgba(2, 6, 23, .35); overflow: hidden }
        .hs-stat { display: flex; align-items: center; gap: 13px; padding: 18px 20px; cursor: pointer; border-right: 1px solid var(--border); transition: background .2s; min-width: 0 }
        .hs-stat:last-child { border-right: none }
        .hs-stat:hover { background: var(--bg3) }
        .hs-stat .ic { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0 }
        .hs-stat b { display: block; font-size: 22px; font-weight: 800; line-height: 1.1; color: var(--text) }
        .hs-stat span { font-size: 11px; color: var(--text3) }
        .tour { text-align: center; padding: 10px 10px 4px }
        .tour-ico { width: 72px; height: 72px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 16px }
        .tour h2 { font-size: 20px; font-weight: 800; color: var(--text); margin-bottom: 8px }
        .tour p { font-size: 13px; color: var(--text2); line-height: 1.6; max-width: 520px; margin: 0 auto }
        .tour ul { list-style: none; display: inline-flex; flex-direction: column; gap: 8px; margin: 18px auto 0; text-align: left }
        .tour li { font-size: 12.5px; color: var(--text); display: flex; gap: 9px; align-items: center }
        .tour li i { color: var(--green) }
        .tour-dots { display: flex; justify-content: center; gap: 7px; margin-top: 22px }
        .tour-dots span { width: 8px; height: 8px; border-radius: 8px; background: var(--border2); cursor: pointer; transition: all .3s }
        .tour-dots span.on { width: 24px; background: var(--accent) }

        /* ---------- RECHERCHE UNIVERSELLE (Ctrl+K) ---------- */
        .cmdk-ov { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); z-index: 600; display: none; align-items: flex-start; justify-content: center; padding: 11vh 10px 0 }
        .cmdk-ov.open { display: flex }
        .cmdk { width: 640px; max-width: 96vw; background: var(--bg2); border: 1px solid var(--border2); border-radius: 14px; box-shadow: 0 20px 60px rgba(0, 0, 0, .5); overflow: hidden; animation: pop .15s ease }
        @keyframes pop { from { transform: scale(.97); opacity: 0 } to { transform: none; opacity: 1 } }
        .cmdk-in { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--border) }
        .cmdk-in i { color: var(--text3) }
        .cmdk-in input { border: none; background: transparent; padding: 15px 0; font-size: 14px; box-shadow: none !important }
        .cmdk-list { max-height: 54vh; overflow: auto; padding: 6px }
        .cmdk-grp { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; padding: 9px 10px 4px; color: var(--text3) }
        .cmdk-it { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 12.5px; color: var(--text) }
        .cmdk-it > i { width: 16px; text-align: center; color: var(--text3) }
        .cmdk-it .l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0 }
        .cmdk-it .s { margin-left: auto; font-size: 10.5px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; padding-left: 10px }
        .cmdk-it.on { background: var(--accentbg); color: var(--accent2) }
        .cmdk-it.on > i { color: var(--accent2) }
        .cmdk-foot { padding: 8px 14px; border-top: 1px solid var(--border); font-size: 10.5px; color: var(--text3); display: flex; gap: 14px; flex-wrap: wrap }

        /* ---------- CALENDRIER ---------- */
        .cal-head { display: grid; grid-template-columns: repeat(7, 1fr); background: var(--bg3); border-bottom: 1px solid var(--border) }
        .cal-head div { padding: 8px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; color: var(--text3); text-align: center }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr) }
        .cal-day { min-height: 114px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 5px; min-width: 0; transition: background .15s }
        .cal-day:nth-child(7n) { border-right: none }
        .cal-day.we { background: rgba(148, 163, 184, .04) }
        .cal-day.out { opacity: .42 }
        .cal-day.over { background: var(--accentbg); outline: 2px dashed var(--accent); outline-offset: -3px }
        .cal-day .n { font-size: 11px; font-weight: 700; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; color: var(--text2); border-radius: 50% }
        .cal-day.today .n { background: var(--accent); color: #fff }
        .cal-ev { font-size: 10.5px; padding: 3px 6px; border-radius: 5px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: grab; color: #fff; font-weight: 600 }
        .cal-ev.late { box-shadow: inset 3px 0 0 #EF4444; outline: 1px solid rgba(239, 68, 68, .6) }
        .cal-ev.done { text-decoration: line-through; opacity: .75 }
        .cal-ev.rp { background: var(--purplebg); color: var(--purple); cursor: pointer }
        .cal-more { font-size: 10px; color: var(--accent2); margin-top: 3px; cursor: pointer; font-weight: 700 }

        /* ---------- COLLABORATION (fiche activité) ---------- */
        .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 14px; flex-wrap: wrap }
        .tabs button { background: none; border: none; border-bottom: 2px solid transparent; padding: 8px 12px; color: var(--text2); font: 600 12px 'Inter', sans-serif; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; margin-bottom: -1px }
        .tabs button.on { color: var(--accent2); border-bottom-color: var(--accent) }
        .cl-item { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 8px; background: var(--bg3); margin-bottom: 5px; font-size: 12px; border: 1px solid var(--border) }
        .cl-item.done span.t { text-decoration: line-through; color: var(--text3) }
        .cm { display: flex; gap: 10px; margin-bottom: 10px }
        .cm-b { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 8px 11px; font-size: 12px; flex: 1; line-height: 1.5; min-width: 0; word-wrap: break-word }
        .cm-b .h { font-size: 10.5px; color: var(--text3); margin-bottom: 3px; display: flex; gap: 8px; align-items: center }
        .timer { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: .5px }
        .timer.run { color: var(--green) }
        .tm-row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; background: var(--bg3); border-radius: 8px; margin-bottom: 5px; font-size: 11.5px }

        /* ---------- GANTT ---------- */
        .gx-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 12px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius2); margin-bottom: 10px }
        .gx-toolbar select { width: auto; min-width: 130px; padding: 6px 10px }
        .gx-scroll { overflow: auto; max-height: calc(100vh - 235px); min-height: 320px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius2); position: relative }
        .gx-grid { position: relative }
        .gx-head { display: flex; position: sticky; top: 0; z-index: 20; height: 56px }
        .gx-corner { position: sticky; left: 0; z-index: 21; background: var(--bg3); border-right: 2px solid var(--border2); border-bottom: 1px solid var(--border2); display: flex; align-items: flex-end; flex-shrink: 0 }
        .gx-cols { display: flex; width: 100%; font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--text3); padding: 0 0 9px }
        .gx-c-name { flex: 1; padding-left: 14px; min-width: 0 }
        .gx-c-resp { width: 82px }
        .gx-c-d { width: 66px; text-align: center }
        .gx-c-p { width: 46px; text-align: right; padding-right: 10px }
        .gx-hscale { position: relative; background: var(--bg3); border-bottom: 1px solid var(--border2); flex-shrink: 0; overflow: hidden }
        .gx-seg { position: absolute; height: 28px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: var(--text2); border-left: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-transform: capitalize }
        .gx-seg.top { top: 0; color: var(--text); justify-content: flex-start; padding-left: 8px; font-size: 10.5px }
        .gx-seg.bot { top: 28px; font-weight: 600; color: var(--text3); font-size: 9.5px; border-top: 1px solid var(--border) }
        .gx-seg.bot small { margin-left: 3px; opacity: .65; font-size: 8.5px }
        .gx-seg.bot.today { color: var(--accent2); background: var(--accentbg); font-weight: 800 }
        .gx-seg.bot.we { background: rgba(148, 163, 184, .08) }
        .gx-body { position: relative }
        .gx-bg { position: absolute; top: 0; z-index: 0; pointer-events: none }
        .gx-we { position: absolute; top: 0; bottom: 0; background: rgba(148, 163, 184, .07) }
        .gx-gl { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--border) }
        .gx-today { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--red); z-index: 6; opacity: .85 }
        .gx-today::before { content: ''; position: absolute; top: 0; left: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--red) }
        .gx-svg { position: absolute; top: 0; z-index: 7; pointer-events: none; overflow: visible }
        .gx-row { display: flex; border-bottom: 1px solid var(--border); position: relative }
        .gx-l { position: sticky; left: 0; z-index: 10; background: var(--bg2); border-right: 2px solid var(--border2); display: flex; align-items: center; font-size: 11.5px; flex-shrink: 0; cursor: pointer }

        .gx-p { width: 46px; text-align: right; padding-right: 10px; font-size: 10.5px; font-weight: 700 }
        .gx-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0 }

        .gx-bar { position: absolute; border-radius: 5px; z-index: 8; cursor: grab; overflow: hidden; touch-action: none; transition: box-shadow .15s }
        .gx-bar:hover { box-shadow: 0 2px 10px rgba(0, 0, 0, .35) }
        .gx-bar:active { cursor: grabbing }
        .gx-bar.nodrag { cursor: pointer }
        .gx-bar .fill { position: absolute; left: 0; top: 0; bottom: 0; opacity: .92; pointer-events: none }
        .gx-bar .lbl { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); font-size: 9.5px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, .7); white-space: nowrap; pointer-events: none }
        .gx-bar .grip { position: absolute; right: 0; top: 0; bottom: 0; width: 8px; cursor: ew-resize }
        .gx-bar:hover .grip { background: rgba(255, 255, 255, .35) }
        .gx-bar.late { outline: 1.5px solid var(--red); outline-offset: 1px }
        .gx-base { position: absolute; height: 6px; border-radius: 3px; background: rgba(148, 163, 184, .6); z-index: 7; pointer-events: none; border: 1px solid rgba(148, 163, 184, .9) }
        .gx-over { position: absolute; border-radius: 0 5px 5px 0; z-index: 7; background: repeating-linear-gradient(45deg, rgba(239, 68, 68, .6) 0 4px, rgba(239, 68, 68, .15) 4px 8px); pointer-events: none }
        .gx-ms { position: absolute; width: 14px; height: 14px; transform: rotate(45deg); z-index: 8; cursor: pointer; border: 2px solid var(--bg2); box-shadow: 0 0 0 1px rgba(0, 0, 0, .2) }
        .gx-sum { position: absolute; height: 9px; top: 11px; z-index: 8; border-radius: 2px; pointer-events: none }
        .gx-sum::before, .gx-sum::after { content: ''; position: absolute; top: 100%; border-top: 6px solid currentColor }
        .gx-sum::before { left: 0; border-right: 6px solid transparent }

        .gx-blbl { position: absolute; font-size: 9.5px; color: var(--text3); white-space: nowrap; z-index: 8; pointer-events: none; top: 50%; transform: translateY(-50%) }
        .gx-legend { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 10px 4px 4px; font-size: 11px; color: var(--text2) }
        .gx-legend .sw { display: inline-block; width: 14px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: middle }
        .gx-hint { font-size: 10.5px; color: var(--text3); padding: 4px }
        .gx-tip { position: fixed; z-index: 1000; background: var(--bg2); border: 1px solid var(--border2); border-radius: 10px; padding: 10px 12px; font-size: 11px; color: var(--text); box-shadow: var(--shadow); pointer-events: none; display: none; max-width: 300px; line-height: 1.6 }

        /* ---------- DASHBOARD ---------- */
        .dw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px }
        .dw-grid .card { margin-bottom: 0 }
        .dw-full { grid-column: 1/-1 }

        .cfg-type { background: var(--bg3); border: 1px solid var(--border2); border-radius: 8px; padding: 8px 4px; text-align: center; cursor: pointer; font-size: 10px; color: var(--text2); font-weight: 600 }

        .cc-list { max-height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; padding-right: 4px }
        .cc-item { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text2) }
        .cc-item input[type=color] { width: 34px; height: 24px; flex-shrink: 0; padding: 1px }

        /* ---------- RAPPORTS ---------- */
        .rp-layout { display: grid; grid-template-columns: 1fr 290px; gap: 16px; align-items: start }
        .rp-side { position: sticky; top: 68px }
        .rp-steps { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap }
        .rp-step { display: flex; align-items: center; gap: 7px; padding: 7px 12px; background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; font-size: 11px; font-weight: 600; color: var(--text2); cursor: pointer }
        .rp-step b { width: 20px; height: 20px; border-radius: 50%; background: var(--accentbg); color: var(--accent2); display: flex; align-items: center; justify-content: center; font-size: 10px }
        .rp-step.ok b { background: var(--greenbg); color: var(--green) }
        .rp-auto { background: var(--bg3); border: 1px dashed var(--border2); border-radius: 10px; padding: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; font-size: 11px }
        .rp-auto .k { color: var(--text3); font-size: 9.5px; text-transform: uppercase; letter-spacing: .4px; font-weight: 700 }
        .rp-auto .v { color: var(--text); font-weight: 600; margin-top: 2px }
        .rp-sec { margin-bottom: 18px }
        .rp-sec-lbl { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; font-weight: 700; color: var(--text); margin-bottom: 6px; flex-wrap: wrap }

        .rp-drop:hover, .rp-drop.over { border-color: var(--accent); background: var(--accentbg); color: var(--accent2) }
        .rp-drop i { font-size: 28px; display: block; margin-bottom: 8px }
        .rp-imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-top: 14px }
        .rp-img { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; overflow: hidden }
        .rp-img img { width: 100%; height: 130px; object-fit: cover; display: block; background: #000 }

        .rp-check.ok i { color: var(--green) }
        .rp-check.ko i { color: var(--text3) }
        .rp-paper-wrap { background: #CBD5E1; padding: 24px; border-radius: 10px; overflow: auto }
        .rp-thumb { height: 120px; background: var(--bg3) center/cover no-repeat; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--text3); font-size: 26px }
        .rp-meta { font-size: 11px; color: var(--text3); line-height: 1.7 }
        .rp-meta b { color: var(--text2); font-weight: 600 }

        /* Quill — thème sombre / clair */
        .ql-toolbar.ql-snow { border: 1px solid var(--border2) !important; background: var(--bg3); border-radius: 8px 8px 0 0; padding: 6px !important }
        .ql-container.ql-snow { border: 1px solid var(--border2) !important; border-top: none !important; background: var(--bg3); color: var(--text); border-radius: 0 0 8px 8px; font-family: 'Inter', sans-serif; font-size: 12.5px }
        .ql-editor { min-height: 110px; line-height: 1.6 }
        .ql-editor.ql-blank::before { color: var(--text3); font-style: normal; font-size: 12px }
        .ql-snow .ql-stroke { stroke: var(--text2) }
        .ql-snow .ql-fill { fill: var(--text2) }
        .ql-snow .ql-picker { color: var(--text2) }
        .ql-snow .ql-picker-options { background: var(--bg2); border-color: var(--border2) !important }
        .ql-snow button:hover .ql-stroke, .ql-snow .ql-active .ql-stroke { stroke: var(--accent2) !important }
        .ql-snow button:hover .ql-fill, .ql-snow .ql-active .ql-fill { fill: var(--accent2) !important }
        .ql-snow .ql-tooltip { background: var(--bg2); border-color: var(--border2); color: var(--text); box-shadow: var(--shadow); z-index: 30 }

        @media(max-width:1100px) {

            .hs { height: 520px } .hs-content { padding: 0 20px } .hs h1 { font-size: 23px; letter-spacing: .5px } .hs-content p { font-size: 13px } .hs-arrow, .hs-hello { display: none } .hs-dots { bottom: 22px; right: 50%; transform: translateX(50%) } .hs-strip { margin: -44px 12px 6px } .hs-stat { padding: 14px } .hs-stat b { font-size: 19px }
            .home-cols, .why-grid { grid-template-columns: 1fr } .flow { grid-template-columns: 1fr 1fr }
        }
        /* =====================================================================
           RESPONSIVE — couche d'adaptation tablette / mobile
           ===================================================================== */
        .sb-backdrop { display: none }
        img, svg, canvas, video { max-width: 100% }
        .gx-svg { max-width: none }
        .card-body, .modal-body { min-width: 0 }

        .topbar .btn-group { flex-wrap: nowrap; flex-shrink: 0 }
        .rp-layout > *, .cfg-layout > *, .dw-grid > *, .g2 > *, .g3 > *, .g4 > *, .home-cols > *, .hero > *, .kanban-board > *, .why-grid > *, .flow > * { min-width: 0 }

        /* ---- Grand écran réduit / tablette paysage ---- */
        @media (max-width: 1100px) {
            .g4 { grid-template-columns: repeat(2, 1fr) }
            .flow { grid-template-columns: 1fr 1fr }
            .hero { grid-template-columns: 1fr }

        /* ---- Tablette portrait & mobile ---- */
        @media (max-width: 800px) {
            .sb { width: min(280px, 85vw); min-width: 0; z-index: 400 }

            /* barres de filtres */

            /* tableaux */

        /* ---- Mobile ---- */
        @media (max-width: 600px) {
            /* champs côte à côte → empilés */

// =====================================================================
//  ONG PROJECT PRO v5.0 — Stockage Google Sheets via Apps Script
// =====================================================================
const GOOGLE_SHEETS_CONFIG = {
    webAppUrl: 'https://script.google.com/macros/s/AKfycbxlB521biVBHT0bijDHv0CwSi_eKNaoWBit8UJJUCaYX3hLM4kiqfHulweZOPLVx04ubg/exec'
};
const API_URL = GOOGLE_SHEETS_CONFIG.webAppUrl;

// ============================================================
// STATE
// ============================================================
let DB = { projets: [], activites: [], ressources: [], documents: [], rapports: [] };
let cur = 'accueil', selectedAct = null, editingReport = null;
let isSyncing = false, isLoaded = false;
let reportsBackend = true; // false si l'Apps Script ne gère pas encore les rapports

// ============================================================
// DATES
// ============================================================
function parseDate(v) {
    if (!v) return null;
    if (v instanceof Date) return isNaN(v) ? null : new Date(v.getFullYear(), v.getMonth(), v.getDate());
    if (typeof v === 'string') {
        const m = v.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
        const f = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        if (f) return new Date(+f[3], +f[2] - 1, +f[1]);
    }
    const d = new Date(v);
    if (isNaN(d.getTime())) return null;
    return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
const isoDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
function formatDateInput(v) { const d = parseDate(v); return d ? isoDate(d) : ''; }
function formatDateFr(v) { const d = parseDate(v); return d ? d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '—'; }
function fdS(v) { const d = parseDate(v); return d ? d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: '2-digit' }) : '—'; }
function getToday() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function compareDates(a, b) { const d1 = parseDate(a), d2 = parseDate(b); return (d1 && d2) ? d1 - d2 : 0; }
function isDatePast(v) { const d = parseDate(v); return d ? d < getToday() : false; }
function daysLeft(v) { const d = parseDate(v); return d ? Math.round((d - getToday()) / 86400000) : Infinity; }
function daysLate(v) { const d = parseDate(v); return d ? Math.round((getToday() - d) / 86400000) : 0; }
function isActivityLate(a) { return !!(a && a.statut !== 'Terminée' && a.fp && isDatePast(a.fp)); }
function isActivitySoon(a, days = 7) { if (!a || a.statut === 'Terminée' || !a.fp) return false; const l = daysLeft(a.fp); return l >= 0 && l <= days; }
function calcProgress(tc, nbt) { tc = +tc || 0; nbt = +nbt || 0; return nbt > 0 ? Math.round(tc / nbt * 100) : 0; }
const toDayNum = d => Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
const fromDayNum = n => { const u = new Date(n * 86400000); return new Date(u.getUTCFullYear(), u.getUTCMonth(), u.getUTCDate()); };
function isoWeek(d) {
    const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    const dn = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - dn);
    const ys = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - ys) / 86400000 + 1) / 7);
}

// ============================================================
// UTILITAIRES
// ============================================================
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pName = id => { const p = DB.projets.find(x => x.id == id); return p ? p.nom : '—'; };
const pById = id => DB.projets.find(x => x.id == id);
const aById = id => DB.activites.find(x => x.id == id);
const maxId = arr => arr.length ? Math.max(...arr.map(x => +x.id || 0)) + 1 : 1;
const fd = formatDateFr;
const fe = v => (parseFloat(v) || 0).toLocaleString('fr-FR', { maximumFractionDigits: 0 }) + ' FCFA';
const feShort = v => { const n = +v || 0, a = Math.abs(n); return a >= 1e9 ? (n / 1e9).toFixed(1).replace('.', ',') + ' Md' : a >= 1e6 ? (n / 1e6).toFixed(1).replace('.', ',') + ' M' : a >= 1e3 ? Math.round(n / 1e3) + ' k' : String(Math.round(n)); };
const pct = calcProgress;
const retards = () => DB.activites.filter(isActivityLate);
const statusColor = s => ({ 'Terminée': 'b-green', 'En cours': 'b-blue', 'Non démarrée': 'b-gray' }[s] || 'b-gray');
const prioColor = p => ({ 'Critique': 'b-red', 'Élevée': 'b-yellow', 'Moyenne': 'b-blue', 'Faible': 'b-gray' }[p] || 'b-gray');
const progColor = p => p >= 80 ? 'var(--green)' : p >= 40 ? 'var(--yellow)' : 'var(--red)';
function avatarColor(name) { const c = ['#6366F1', '#10B981', '#F59E0B', '#EF4444', '#3B82F6', '#A855F7', '#EC4899', '#14B8A6']; const s = String(name || '?'); let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return c[h % c.length]; }
const initial = s => esc(String(s || '?').trim().charAt(0).toUpperCase() || '?');
function autoStatut(nbt, tc) { if (tc >= nbt && nbt > 0) return 'Terminée'; if (tc > 0) return 'En cours'; return 'Non démarrée'; }
function hexA(hex, a) {
    let h = String(hex || '#6366F1').replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    const n = parseInt(h.slice(0, 6), 16) || 0;
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
}
function shade(hex, t) {
    let h = String(hex || '#6366F1').replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    const n = parseInt(h.slice(0, 6), 16) || 0; const T = t < 0 ? 0 : 255, p = Math.abs(t);
    return '#' + [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(x => Math.round((T - x) * p + x).toString(16).padStart(2, '0')).join('');
}
function parseList(v) {
    if (Array.isArray(v)) return v;
    if (v == null || v === '') return [];
    if (typeof v === 'string') {
        const t = v.trim();
        if (t.startsWith('[')) { try { const r = JSON.parse(t); return Array.isArray(r) ? r : []; } catch (e) { } }
        return t.split(',').map(x => x.trim()).filter(Boolean);
    }
    return [v];
}
const toBool = v => v === true || v === 1 || /^(true|vrai|oui|1)$/i.test(String(v || ''));
const normTxt = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const fmtMin = m => { m = Math.round(+m || 0); return `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}`; };
function timeAgo(ts) {
    const s = Math.round((Date.now() - ts) / 1000);
    if (s < 60) return "à l'instant";
    if (s < 3600) return `il y a ${Math.round(s / 60)} min`;
    if (s < 86400) return `il y a ${Math.round(s / 3600)} h`;
    if (s < 7 * 86400) return `il y a ${Math.round(s / 86400)} j`;
    return new Date(ts).toLocaleDateString('fr-FR');
}

// ---------- normalisation des données venant de Sheets ----------
function normalizeProjet(p) { return { ...p, id: +p.id, bprev: +p.bprev || 0, breel: +p.breel || 0, couleur: /^#[0-9a-f]{6}$/i.test(p.couleur || '') ? p.couleur : '#6366F1', nom: p.nom || 'Sans nom', chef: p.chef || '', pays: p.pays || '', desc: p.desc || '', statut: p.statut || 'En préparation' }; }
function normalizeActivite(a) {
    const nbt = Math.max(1, +a.nbt || 1);
    const r = {
        ...a, id: +a.id, pid: +a.pid, nbt, tc: Math.min(+a.tc || 0, nbt), bprev: +a.bprev || 0, breel: +a.breel || 0,
        nom: a.nom || 'Sans nom', resp: a.resp || '—', prio: a.prio || 'Moyenne',
        tags: parseList(a.tags).map(String), deps: parseList(a.deps).map(Number).filter(n => !isNaN(n) && n > 0),
        jalon: toBool(a.jalon), notes: a.notes || ''
    };
    if (r.statut === 'Suspendue' || !r.statut) r.statut = autoStatut(r.nbt, r.tc);
    return r;
}
function normalizeRessource(r) { return { ...r, id: +r.id, nom: r.nom || '—', dispo: r.dispo === '' || r.dispo == null ? 100 : +r.dispo, cout: +r.cout || 0, projets: parseList(r.projets).map(Number) }; }
function normalizeDoc(d) { return { ...d, id: +d.id, projetId: +d.projetId || null, activiteId: +d.activiteId || null }; }
function normalizeReport(r) {
    const b = r.benef || {};
    return {
        ...r, id: +r.id || null, projetId: +r.projetId || null, activiteId: +r.activiteId || null,
        titre: r.titre || '', type: r.type || "Rapport d'activité", statut: r.statut || 'Brouillon',
        sections: r.sections || {}, images: Array.isArray(r.images) ? r.images : [],
        benef: { h: +b.h || 0, f: +b.f || 0, e: +b.e || 0 }, inclureSynthese: r.inclureSynthese !== false
    };
}

// ============================================================
// JOURNAL DES MODIFICATIONS & DONNÉES DE COLLABORATION (navigateur)
// ============================================================
const LOG_KEY = 'ong_journal_v1';
const COLLAB_KEY = 'ong_collab_v1';
function logList() { try { const l = JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); return Array.isArray(l) ? l : []; } catch (e) { return []; } }
function logAction(msg, icon) {
    if (!msg) return;
    const l = logList();
    l.unshift({ ts: Date.now(), msg: String(msg), icon: icon || 'fa-pen', who: getSettings().user || '' });
    try { localStorage.setItem(LOG_KEY, JSON.stringify(l.slice(0, 80))); } catch (e) { }
}
function collabAll() { try { return JSON.parse(localStorage.getItem(COLLAB_KEY) || '{}') || {}; } catch (e) { return {}; } }
function collabGet(id, all) { const src = all || collabAll(); return Object.assign({ checklist: [], comments: [], time: [], running: null, link: true }, src[id] || {}); }
function collabSet(id, d) {
    const all = collabAll(); all[id] = d;
    try { localStorage.setItem(COLLAB_KEY, JSON.stringify(all)); } catch (e) { notify('Stockage du navigateur plein', 'error'); }
}

// ============================================================
// PARAMÈTRES DE L'ORGANISATION (mémorisés dans le navigateur)
// ============================================================
const SETTINGS_KEY = 'ong_pro_settings';
function getSettings() {
    const def = { nom: 'Mon ONG', sigle: '', slogan: '', logo: '', user: '' };
    try { return Object.assign(def, JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}')); } catch (e) { return def; }
}
function saveSettingsObj(s) { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); return true; } catch (e) { notify('Logo trop volumineux pour être mémorisé', 'error'); return false; } }
function applyBrand() {
    const S = getSettings();
    document.getElementById('sb-name').textContent = (S.sigle || S.nom || 'ONG PROJECT').toUpperCase().slice(0, 22);
    document.getElementById('sb-mark').innerHTML = S.logo ? `<img src="${S.logo}" alt="">` : initial(S.sigle || S.nom || 'P');
}
function openSettings() {
    const S = getSettings();
    window.__stLogo = S.logo;
    const noLogo = '<span style="color:var(--text3);font-size:11px">Aucun logo</span>';
    openModal("Paramètres de l'organisation", `
      <div class="g2">
        <div>
          <div class="fld"><label class="fld-lbl">Nom de l'ONG *</label><input id="st-nom" value="${esc(S.nom)}"></div>
          <div class="fld"><label class="fld-lbl">Sigle</label><input id="st-sigle" value="${esc(S.sigle)}" placeholder="Ex : ASD-CI"></div>
          <div class="fld"><label class="fld-lbl">Slogan / adresse (affiché sous le nom)</label><input id="st-slogan" value="${esc(S.slogan)}" placeholder="Ex : Abidjan, Cocody — contact@ong.org"></div>
          <div class="fld"><label class="fld-lbl">Votre nom (commentaires, suivi du temps, journal)</label><input id="st-user" value="${esc(S.user)}" placeholder="Ex : Awa Koné"></div>
        </div>
        <div>
          <div class="fld"><label class="fld-lbl">Logo</label>
            <div id="st-logo-prev" style="height:90px;display:flex;align-items:center;justify-content:center;background:#fff;border-radius:8px;margin-bottom:8px;border:1px solid var(--border2)">${S.logo ? `<img src="${S.logo}" style="max-height:80px;max-width:220px">` : noLogo}</div>
            <input type="file" id="st-logo" accept="image/*">
            <button class="btn btn-ghost btn-sm" style="margin-top:6px" id="st-logo-rm"><i class="fas fa-trash"></i> Retirer le logo</button>
          </div>
          <div class="fld"><label class="fld-lbl">Photos du carrousel d'accueil (jusqu'à 4)</label>
            <div id="st-hero-prev" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px"></div>
            <input type="file" id="st-hero" accept="image/*" multiple>
            <button class="btn btn-ghost btn-sm" style="margin-top:6px" id="st-hero-rm"><i class="fas fa-rotate-left"></i> Photos par défaut</button>
          </div>
        </div>
      </div>
      <div class="banner info" style="margin:6px 0 0"><i class="fas fa-info-circle"></i> Ces informations apparaissent dans l'en-tête des rapports. Elles sont mémorisées dans ce navigateur.</div>`,
        `<button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="saveSettings()"><i class="fas fa-save"></i> Enregistrer</button>`);
    document.getElementById('st-logo').addEventListener('change', async e => {
        const f = e.target.files[0]; if (!f) return;
        try { window.__stLogo = await compressImage(f, 400, 0.92, true); document.getElementById('st-logo-prev').innerHTML = `<img src="${window.__stLogo}" style="max-height:80px;max-width:220px">`; }
        catch (err) { notify('Image illisible', 'error'); }
    });
    document.getElementById('st-logo-rm').addEventListener('click', () => { window.__stLogo = ''; document.getElementById('st-logo-prev').innerHTML = noLogo; });
    try { window.__stHero = JSON.parse(localStorage.getItem('ong_hero_imgs') || '[]'); } catch (e) { window.__stHero = []; }
    const heroPrev = () => { const imgs = heroImgs().map((d, i) => window.__stHero[i] || d); document.getElementById('st-hero-prev').innerHTML = imgs.map((u, i) => `<div style="height:48px;border-radius:6px;background:url('${u}') center/cover,${HERO_GRADS[i]};border:1px solid var(--border2)"></div>`).join(''); };
    heroPrev();

        const files = [...e.target.files].filter(f => f.type.startsWith('image/')).slice(0, 4);
        if (!files.length) return;
        try { window.__stHero = []; for (const f of files) window.__stHero.push(await compressImage(f, 1600, 0.72)); heroPrev(); }
        catch (err) { notify('Image illisible', 'error'); }
    });
    document.getElementById('st-hero-rm').addEventListener('click', () => { window.__stHero = []; heroPrev(); });
}
function saveSettings() {
    const nom = document.getElementById('st-nom').value.trim();
    if (!nom) return notify("Le nom de l'ONG est requis", 'error');
    if (saveSettingsObj({ nom, sigle: document.getElementById('st-sigle').value.trim(), slogan: document.getElementById('st-slogan').value.trim(), user: document.getElementById('st-user').value.trim(), logo: window.__stLogo || '' })) {
        try { if (window.__stHero && window.__stHero.length) localStorage.setItem('ong_hero_imgs', JSON.stringify(window.__stHero)); else localStorage.removeItem('ong_hero_imgs'); }
        catch (e) { notify('Photos trop volumineuses pour être mémorisées : essayez des images plus légères', 'error'); }
        applyBrand(); closeModal(); notify('Paramètres enregistrés'); if (cur === 'accueil') refreshCurrentPage();
    }
}

// Compression d'image côté navigateur (photos terrain, logo)
function compressImage(file, max = 1280, q = 0.78, keepPng = false) {
    return new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onload = e => {
            const img = new Image();
            img.onload = () => {
                const r = Math.min(1, max / Math.max(img.width, img.height));
                const w = Math.max(1, Math.round(img.width * r)), h = Math.max(1, Math.round(img.height * r));
                const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
                const ctx = cv.getContext('2d');
                if (!keepPng) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); }
                ctx.drawImage(img, 0, 0, w, h);
                resolve(keepPng ? cv.toDataURL('image/png') : cv.toDataURL('image/jpeg', q));
            };
            img.onerror = reject;
            img.src = e.target.result;
        };
        fr.onerror = reject;
        fr.readAsDataURL(file);
    });
}

async function apiPost(payload) {
    const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    if (d && d.error) throw new Error(d.error);
    return d;
}
async function readFromSheets() {
    const r = await fetch(API_URL + '?action=readAll');
    if (!r.ok) throw new Error(`HTTP ${r.status}: ${r.statusText}`);
    const data = await r.json();
    if (data.error) throw new Error(data.error);
    return data;
}
function writeToSheets() {
    const payload = {
        action: 'writeAll',
        projets: DB.projets.map(p => ({ ...p, debut: p.debut || null, fin: p.fin || null })),
        activites: DB.activites.map(a => ({ ...a, dp: a.dp || null, fp: a.fp || null, dr: a.dr || null, fr: a.fr || null, tags: Array.isArray(a.tags) ? a.tags : [], deps: Array.isArray(a.deps) ? a.deps : [], jalon: !!a.jalon })),
        ressources: DB.ressources,
        documents: DB.documents.map(d => ({ ...d, date: d.date || null }))
    };
    return apiPost(payload);
}

async function syncAll(showNotification = true) {
    if (isSyncing) { if (showNotification) notify('Synchronisation déjà en cours...', 'info'); return; }
    const btn = document.getElementById('syncBtn');
    try {
        isSyncing = true; showLoading(true);
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Chargement...'; btn.disabled = true;
        const data = await readFromSheets();
        DB.projets = (data.projets || []).filter(p => p && p.id !== '' && p.id != null).map(normalizeProjet);
        DB.activites = (data.activites || []).filter(a => a && a.id !== '' && a.id != null).map(normalizeActivite);
        DB.ressources = (data.ressources || []).filter(r => r && r.id !== '' && r.id != null).map(normalizeRessource);
        DB.documents = (data.documents || []).filter(d => d && d.id !== '' && d.id != null).map(normalizeDoc);
        const serverReports = await fetchReports(data.rapports);
        DB.rapports = serverReports.map(normalizeReport).concat(localReports().map(r => ({ ...normalizeReport(r), _local: true })));
        isLoaded = true;
        updateSyncStatus(true, `${DB.activites.length} act. · ${DB.projets.length} proj.`);
        if (showNotification) notify(`✅ ${DB.activites.length} activités chargées`, 'success');
    } catch (error) {
        console.error('Erreur de chargement:', error);
        updateSyncStatus(false, 'Erreur de connexion');
        if (showNotification) notify('⚠️ ' + (error.message || 'Impossible de charger les données'), 'error');
        DB.rapports = localReports().map(r => ({ ...normalizeReport(r), _local: true }));
        reportsBackend = false;
        isLoaded = true;
    } finally {
        isSyncing = false; showLoading(false);
        btn.innerHTML = '<i class="fas fa-sync"></i> Synchroniser'; btn.disabled = false;
        refreshCurrentPage(true);
        updateBadges();
    }
}

// msg : notification ; logMsg / icon : entrée du journal des modifications
function save(msg, logMsg, icon) {
    if (logMsg) logAction(logMsg, icon);
    return writeToSheets()
        .then(() => { updateSyncStatus(true, `${DB.activites.length} act. · ${DB.projets.length} proj.`); notify(msg || '✅ Données sauvegardées sur Google Sheets', 'success'); })
        .catch(err => { console.error(err); updateSyncStatus(false, 'Erreur de sauvegarde'); notify('⚠️ Erreur : ' + (err.message || 'Impossible de sauvegarder'), 'error'); });
}

function periodBind(prefix, onChange) {
    const keys = ['pid', 'period', 'year', 'semester', 'quarter', 'month'];
    const val = k => document.getElementById(`${prefix}-${k}`)?.value;
    const toggle = () => {
        const p = val('period');
        const show = (k, v) => { const el = document.getElementById(`${prefix}-${k}-wrap`); if (el) el.style.display = v ? 'flex' : 'none'; };
        show('year', p !== 'global'); show('semester', p === 'semestriel'); show('quarter', p === 'trimestriel'); show('month', p === 'mensuel');
        const MN = ['', 'Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Juin', 'Juil', 'Aoû', 'Sep', 'Oct', 'Nov', 'Déc'];
        const y = val('year');
        const lbl = { global: '🌐 Toutes périodes', annuel: `📅 Année ${y}`, semestriel: `📆 S${val('semester')} ${y}`, trimestriel: `🗓 T${val('quarter')} ${y}`, mensuel: `📄 ${MN[+val('month')]} ${y}` }[p];
        document.getElementById(`${prefix}-badge`).textContent = lbl;
    };
    keys.forEach(k => document.getElementById(`${prefix}-${k}`).addEventListener('change', e => { sessionStorage.setItem(`${prefix}-${k}`, e.target.value); toggle(); onChange(); }));
    document.getElementById(`${prefix}-reset`).addEventListener('click', () => {
        const d = periodDefaults();
        keys.forEach(k => { sessionStorage.removeItem(`${prefix}-${k}`); document.getElementById(`${prefix}-${k}`).value = d[k]; });
        toggle(); onChange();
    });
    toggle();
}
function periodFilter(prefix, acts) {
    const v = k => document.getElementById(`${prefix}-${k}`)?.value;
    const period = v('period') || 'global';
    if (period === 'global') return acts;
    const year = +v('year'), sem = +v('semester'), q = +v('quarter'), month = +v('month');
    return acts.filter(a => {
        const d = parseDate(a.dr || a.dp);
        if (!d || d.getFullYear() !== year) return false;
        const m = d.getMonth() + 1;
        if (period === 'annuel') return true;
        if (period === 'semestriel') return sem === 1 ? m <= 6 : m > 6;
        if (period === 'trimestriel') return Math.ceil(m / 3) === q;
        if (period === 'mensuel') return m === month;
        return true;
    });
}

function heroSlides(S, k) {

    ].map((s, i) => ({ ...s, img: img[i], grad: HERO_GRADS[i] }));
}
function hsInit() {
    clearInterval(window.__hsInt);
    const root = document.getElementById('hs'); if (!root) return;
    const slides = [...root.querySelectorAll('.hs-slide')], dots = [...root.querySelectorAll('[data-dot]')];
    const bar = root.querySelector('.hs-progress div');
    const DUR = 7000;
    let i = 0, paused = false, t0 = Date.now();
    const show = n => {
        i = (n + slides.length) % slides.length;
        slides.forEach((s, k) => s.classList.toggle('on', k === i));
        dots.forEach((d, k) => d.classList.toggle('on', k === i));
        t0 = Date.now();
    };
    root.querySelectorAll('.hs-arrow').forEach(b => b.onclick = () => show(i + +b.dataset.d));
    dots.forEach(d => d.onclick = () => show(+d.dataset.dot));
    root.onmouseenter = () => { paused = true; };
    root.onmouseleave = () => { paused = false; t0 = Date.now() - (+bar.dataset.p || 0) * DUR; };
    let x0 = null;
    root.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
    root.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) show(i + (dx < 0 ? 1 : -1)); x0 = null; });
    window.__hsInt = setInterval(() => {
        if (!document.body.contains(root)) return clearInterval(window.__hsInt);
        if (paused) return;
        const p = Math.min(1, (Date.now() - t0) / DUR);
        bar.style.width = (p * 100) + '%'; bar.dataset.p = p;
        if (p >= 1) show(i + 1);
    }, 60);
}
