let RP = null, RPQ = {}, rpTimer = null, rpDirty = false;

function rpEdit(id) { const r = rpGet(id); if (!r) return; editingReport = JSON.parse(JSON.stringify(r)); go('rapport'); }
function rpDuplicate(id) {
    const r = rpGet(id); if (!r) return;
    const c = JSON.parse(JSON.stringify(r));
    delete c.id; delete c._local; delete c.createdAt; delete c.updatedAt; delete c.valideLe;
    c.titre = (c.titre || '') + ' (copie)'; c.statut = 'Brouillon'; c.date = isoDate(getToday());
    editingReport = c; go('rapport');
    notify('Copie créée : modifiez-la puis enregistrez', 'info');
}
function rpLeave() {
    clearInterval(rpTimer); rpTimer = null;
    if (rpDirty && document.getElementById('rp-form')) rpAutosave();
}
function rpAutosave() {
    if (!rpDirty || !document.getElementById('rp-form')) return;
    const r = rpCollect();
    const payload = { ts: Date.now(), report: r };
    try { localStorage.setItem(DRAFT_KEY, JSON.stringify(payload)); }
    catch (e) { try { payload.report = { ...r, images: r.images.filter(i => !i.dataUrl) }; localStorage.setItem(DRAFT_KEY, JSON.stringify(payload)); } catch (e2) { } }
    const st = document.getElementById('rp-autosave'); if (st) st.textContent = 'Brouillon local sauvegardé à ' + new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
}

function buildRapport(c) {
    clearInterval(rpTimer);
    if (!DB.projets.length) { c.innerHTML = `<div class="card"><div class="empty"><i class="fas fa-folder-open"></i>Créez d'abord un projet pour pouvoir rédiger un rapport.<br><br><button class="btn btn-primary" onclick="go('projets')">Créer un projet</button></div></div>`; return; }
    const base = editingReport ? JSON.parse(JSON.stringify(editingReport)) : {};
    RP = normalizeReport({ date: isoDate(getToday()), redacteur: getSettings().user || '', ...base });
    RP.id = base.id ? +base.id : null;
    if (base._local) RP._local = true;
    rpDirty = false; RPQ = {};
    const S = getSettings();
    const opt = (v, l, sel) => `<option value="${v}" ${String(sel) === String(v) ? 'selected' : ''}>${l}</option>`;
    c.innerHTML = `
    ${!reportsBackend ? `<div class="banner warn"><i class="fas fa-triangle-exclamation"></i><div><b>Mode local :</b> votre Apps Script ne gère pas encore les rapports. Ils seront enregistrés dans ce navigateur uniquement. Ajoutez le code Apps Script fourni pour les stocker sur Google Sheets et Drive.</div></div>` : ''}
    <div id="rp-draft-banner"></div>
    <div class="rp-steps">
      <div class="rp-step" data-go="rp-c1"><b>1</b> Identification</div>
      <div class="rp-step" data-go="rp-c2"><b>2</b> Infos activité</div>
      <div class="rp-step" data-go="rp-c3"><b>3</b> Rédaction</div>
      <div class="rp-step" data-go="rp-c4"><b>4</b> Photos</div>
    </div>
    <div class="rp-layout" id="rp-form">
      <div>
        <div class="card" id="rp-c1">
          <div class="card-head"><span class="card-title"><i class="fas fa-id-card" style="color:var(--accent2);margin-right:6px"></i>1. Identification du rapport</span></div>
          <div class="card-body">
            <div class="g2">
              <div class="fld"><label class="fld-lbl">Projet *</label><select id="rp-pid"><option value="">Sélectionner…</option>${DB.projets.map(p => opt(p.id, esc(p.nom), RP.projetId)).join('')}</select></div>
              <div class="fld"><label class="fld-lbl">Activité concernée</label><select id="rp-aid"></select></div>
            </div>
            <div style="display:flex;gap:12px;flex-wrap:wrap">
              <div class="fld" style="flex:2;min-width:240px"><label class="fld-lbl">Titre du rapport</label><input id="rp-titre" value="${esc(RP.titre)}" placeholder="Généré automatiquement si vide"></div>
              <div class="fld" style="flex:1;min-width:180px"><label class="fld-lbl">Type de rapport</label><select id="rp-type">${RP_TYPES.map(t => `<option value="${esc(t)}" ${RP.type === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></div>
            </div>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
              <div class="fld"><label class="fld-lbl">Date du rapport *</label><input type="date" id="rp-date" value="${formatDateInput(RP.date)}"></div>
              <div class="fld"><label class="fld-lbl">Période du</label><input type="date" id="rp-du" value="${formatDateInput(RP.periodeDu)}"></div>
              <div class="fld"><label class="fld-lbl">au</label><input type="date" id="rp-au" value="${formatDateInput(RP.periodeAu)}"></div>
            </div>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
              <div class="fld"><label class="fld-lbl">Rédigé par *</label><input id="rp-redac" list="rp-res-list" value="${esc(RP.redacteur)}" placeholder="Nom du rédacteur"></div>
              <div class="fld"><label class="fld-lbl">Lieu / zone d'intervention</label><input id="rp-lieu" value="${esc(RP.lieu || '')}" placeholder="Ex : Bouaké, quartier Dar-es-Salam"></div>
              <div class="fld"><label class="fld-lbl">Validé par</label><input id="rp-valide" list="rp-res-list" value="${esc(RP.validePar || '')}" placeholder="Nom du superviseur"></div>
            </div>
            <datalist id="rp-res-list">${DB.ressources.map(r => `<option value="${esc(r.nom)}">`).join('')}${[...new Set(DB.projets.map(p => p.chef).filter(Boolean))].map(n => `<option value="${esc(n)}">`).join('')}</datalist>
            <div class="fld-lbl" style="margin-top:4px"><i class="fas fa-bolt" style="color:var(--yellow)"></i> Informations reprises automatiquement de la base</div>
            <div class="rp-auto" id="rp-auto"></div>
            <label class="chk" style="margin-top:10px"><input type="checkbox" id="rp-synth" ${RP.inclureSynthese !== false ? 'checked' : ''}> Inclure la fiche synthèse (avancement, dates, budget) dans le rapport</label>
          </div>
        </div>

        <div class="card" id="rp-c2">
          <div class="card-head"><span class="card-title"><i class="fas fa-people-group" style="color:var(--green);margin-right:6px"></i>2. Informations sur l'activité</span></div>
          <div class="card-body">
            <div class="fld"><label class="fld-lbl">Objectif de l'activité</label><textarea id="rp-objectif" rows="2" placeholder="Ex : Sensibiliser 200 ménages aux bonnes pratiques d'hygiène…">${esc(RP.objectif || '')}</textarea></div>
            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
              <div class="fld"><label class="fld-lbl">Bénéficiaires hommes</label><input type="number" min="0" id="rp-bh" value="${RP.benef.h || ''}"></div>
              <div class="fld"><label class="fld-lbl">Bénéficiaires femmes</label><input type="number" min="0" id="rp-bf" value="${RP.benef.f || ''}"></div>
              <div class="fld"><label class="fld-lbl">Enfants</label><input type="number" min="0" id="rp-be" value="${RP.benef.e || ''}"></div>
              <div class="fld"><label class="fld-lbl">Total</label><div id="rp-btot" style="padding:8px 11px;background:var(--accentbg);border-radius:8px;font-weight:700;color:var(--accent2)">0</div></div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 3fr;gap:12px">
              <div class="fld"><label class="fld-lbl">Nb participants</label><input type="number" min="0" id="rp-part" value="${RP.participants || ''}"></div>
              <div class="fld"><label class="fld-lbl">Partenaires impliqués</label><input id="rp-partn" value="${esc(RP.partenaires || '')}" placeholder="Ex : Mairie, District sanitaire, UNICEF…"></div>
            </div>
          </div>
        </div>

        <div class="card" id="rp-c3">
          <div class="card-head"><span class="card-title"><i class="fas fa-pen-nib" style="color:var(--purple);margin-right:6px"></i>3. Rédaction du rapport</span><span style="font-size:10.5px;color:var(--text3)">Les sections laissées vides n'apparaîtront pas</span></div>
          <div class="card-body">
            ${RP_SECTIONS.map((s, i) => `<div class="rp-sec"><div class="rp-sec-lbl">${i + 1}. ${s.t} <small>${s.h}</small></div><div id="rp-q-${s.k}"></div></div>`).join('')}
          </div>
        </div>

        <div class="card" id="rp-c4">
          <div class="card-head"><span class="card-title"><i class="fas fa-images" style="color:var(--orange);margin-right:6px"></i>4. Photos de l'activité</span><span style="font-size:10.5px;color:var(--text3)" id="rp-imgcount"></span></div>
          <div class="card-body">
            <div class="rp-drop" id="rp-drop"><i class="fas fa-cloud-arrow-up"></i><b>Glissez vos photos ici</b> ou cliquez pour les sélectionner<div style="font-size:10.5px;margin-top:4px">JPG, PNG… · compressées automatiquement · 30 photos max</div></div>
            <input type="file" id="rp-file" accept="image/*" multiple style="display:none">
            <div class="rp-imgs" id="rp-imgs"></div>
          </div>
        </div>
      </div>

      <div class="rp-side">
        <div class="card">
          <div class="card-head"><span class="card-title">Rapport</span><span id="rp-status"></span></div>
          <div class="card-body">
            <div id="rp-checks" style="margin-bottom:12px"></div>
            <div style="display:flex;flex-direction:column;gap:8px">
              <button class="btn btn-primary rp-act" onclick="rpPreview()" style="justify-content:center"><i class="fas fa-file-lines"></i> Générer / Aperçu du rapport</button>
              <button class="btn btn-ghost rp-act" onclick="rpSave('Brouillon')" style="justify-content:center"><i class="fas fa-floppy-disk"></i> Enregistrer le brouillon</button>
              <button class="btn btn-success rp-act" onclick="rpSave('Validé')" style="justify-content:center"><i class="fas fa-circle-check"></i> Valider le rapport</button>
              <div style="display:flex;gap:8px">
                <button class="btn btn-ghost btn-sm" style="flex:1;justify-content:center" onclick="exportReportPDF(rpPrepared())"><i class="fas fa-file-pdf"></i> PDF</button>
                <button class="btn btn-ghost btn-sm" style="flex:1;justify-content:center" onclick="exportReportWord(rpPrepared())"><i class="fas fa-file-word"></i> Word</button>
              </div>
              <button class="btn btn-ghost btn-sm" onclick="rpNew()" style="justify-content:center"><i class="fas fa-plus"></i> Nouveau rapport</button>
            </div>
            <div id="rp-progress" style="font-size:11px;color:var(--accent2);margin-top:10px;min-height:14px"></div>
            <div id="rp-autosave" style="font-size:10px;color:var(--text3);margin-top:4px"></div>
          </div>
        </div>
        <div style="font-size:10.5px;color:var(--text3);padding:0 4px;line-height:1.6"><i class="fas fa-circle-info"></i> L'en-tête du rapport utilise le nom et le logo de « ${esc(S.nom)} ». <a href="#" onclick="openSettings();return false" style="color:var(--accent2)">Modifier</a></div>
      </div>

    // Éditeurs de texte riches

    RP_SECTIONS.forEach(s => {

            RPQ[s.k] = new Quill(el, { theme: 'snow', placeholder: s.h, modules: { toolbar } });
            if (RP.sections[s.k]) RPQ[s.k].clipboard.dangerouslyPasteHTML(window.DOMPurify ? DOMPurify.sanitize(RP.sections[s.k]) : RP.sections[s.k]);

    $id('rp-aid').addEventListener('change', e => { RP.activiteId = +e.target.value || null; rpOnActivity(); });
    ['rp-bh', 'rp-bf', 'rp-be'].forEach(i => $id(i).addEventListener('input', rpBenefTotal));
    $id('rp-form').addEventListener('input', () => { rpDirty = true; rpChecks(); });
    $id('rp-form').addEventListener('change', () => { rpDirty = true; rpChecks(); });
    document.querySelectorAll('.rp-step').forEach(s => s.addEventListener('click', () => document.getElementById(s.dataset.go).scrollIntoView({ behavior: 'smooth', block: 'start' })));
    const drop = $id('rp-drop'), file = $id('rp-file');

    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); rpAddFiles(e.dataTransfer.files); });

    rpBenefTotal(); rpAutoBox(); rpRenderImgs(); rpRenderStatus(); rpChecks();
    if (RP.activiteId && !RP.id) rpOnActivity();

    // Proposer de restaurer un brouillon non enregistré
    try {
        const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null');
        const same = d && d.report && ((d.report.id || null) == (RP.id || null));
        const newer = d && (!RP.updatedAt || d.ts > new Date(RP.updatedAt).getTime());
        if (same && newer && (!editingReport || editingReport.id)) {
            $id('rp-draft-banner').innerHTML = `<div class="banner info"><i class="fas fa-clock-rotate-left"></i><div style="flex:1">Un brouillon non enregistré du <b>${new Date(d.ts).toLocaleString('fr-FR')}</b> a été trouvé${d.report.titre ? ` (« ${esc(d.report.titre)} »)` : ''}.</div><button class="btn btn-primary btn-sm" id="rp-restore">Restaurer</button><button class="btn btn-ghost btn-sm" id="rp-ignore">Ignorer</button></div>`;
            $id('rp-restore').onclick = () => { editingReport = d.report; localStorage.removeItem(DRAFT_KEY); buildRapport(c); rpDirty = true; };
            $id('rp-ignore').onclick = () => { localStorage.removeItem(DRAFT_KEY); $id('rp-draft-banner').innerHTML = ''; };
        }
    } catch (e) { }
    rpTimer = setInterval(rpAutosave, 15000);
}

async function rpAddFiles(files) {

    if (RP.images.length + list.length > 30) return notify('30 photos maximum par rapport', 'error');
    document.getElementById('rp-progress').textContent = `Compression de ${list.length} photo(s)…`;
    for (const f of list) {
        try { RP.images.push({ dataUrl: await compressImage(f), legende: '' }); }

function rpSectionsFilled() {

function rpChecks() {
    const box = document.getElementById('rp-checks'); if (!box) return;

    ];
    box.innerHTML = items.map(([ok, l]) => `<div class="rp-check ${ok ? 'ok' : 'ko'}"><i class="fas fa-${ok ? 'circle-check' : 'circle'}"></i>${l}</div>`).join('');
    const steps = document.querySelectorAll('.rp-step');

function rpCollect() {
    const v = i => (document.getElementById(i)?.value || '').trim();
    const sections = {};
    RP_SECTIONS.forEach(s => {
        const q = RPQ[s.k];
        if (q) sections[s.k] = q.getText().trim().length ? q.root.innerHTML : '';
        else { const t = v('rp-q-' + s.k); sections[s.k] = t ? '<p>' + esc(t).replace(/\n/g, '<br>') + '</p>' : ''; }
    });
    const r = {
        ...RP,
        projetId: +v('rp-pid') || null, activiteId: +v('rp-aid') || null, titre: v('rp-titre'), type: v('rp-type'),
        date: v('rp-date'), periodeDu: v('rp-du'), periodeAu: v('rp-au'), redacteur: v('rp-redac'), lieu: v('rp-lieu'), validePar: v('rp-valide'),
        objectif: v('rp-objectif'), benef: { h: +v('rp-bh') || 0, f: +v('rp-bf') || 0, e: +v('rp-be') || 0 },
        participants: +v('rp-part') || 0, partenaires: v('rp-partn'), inclureSynthese: document.getElementById('rp-synth').checked, sections
    };

function rpPreview() {

         <button class="btn btn-success" onclick="closeModal();rpSave('Validé')"><i class="fas fa-circle-check"></i> Valider</button>`, { wide: true });

async function rpSave(statut) {
    const r = rpCollect();
    if (!r.projetId) return notify('Sélectionnez un projet', 'error');
    if (!r.redacteur) return notify('Indiquez le rédacteur du rapport', 'error');
    if (!r.date) return notify('Indiquez la date du rapport', 'error');
    if (r.periodeDu && r.periodeAu && compareDates(r.periodeDu, r.periodeAu) > 0) return notify('La période est incohérente (début après fin)', 'error');
    if (statut === 'Validé' && !RP_SECTIONS.some(s => r.sections[s.k])) return notify('Rédigez au moins une section avant de valider', 'error');
    if (!r.titre) r.titre = rpAutoTitle(r);
    const btns = document.querySelectorAll('.rp-act'); btns.forEach(b => b.disabled = true);
    const prog = m => { const el = document.getElementById('rp-progress'); if (el) el.innerHTML = m ? `<i class="fas fa-spinner fa-spin"></i> ${m}` : ''; };
    try {
        if (!r.id) { r.id = maxId(DB.rapports); r.createdAt = new Date().toISOString(); }
        r.statut = statut; r.updatedAt = new Date().toISOString();
        if (statut === 'Validé' && !r.valideLe) r.valideLe = isoDate(getToday());
        if (statut !== 'Validé') delete r.valideLe;
        if (reportsBackend && !r._local) {
            const pending = r.images.map((im, i) => ({ im, i })).filter(x => x.im.dataUrl && !x.im.url);
            let n = 0;
            for (const { im, i } of pending) {
                prog(`Envoi photo ${++n}/${pending.length} vers Google Drive…`);
                const up = await uploadReportImage(im, r);
                im.url = up.url; im.fileId = up.fileId; delete im.dataUrl;
                if (RP.images[i]) { RP.images[i].url = up.url; RP.images[i].fileId = up.fileId; delete RP.images[i].dataUrl; }
            }
        }
        prog('Enregistrement du rapport…');
        const saved = await persistReport(r);
        const idx = DB.rapports.findIndex(x => x.id == saved.id && !!x._local === !!saved._local);
        if (idx >= 0) DB.rapports[idx] = saved; else DB.rapports.push(saved);
        RP = JSON.parse(JSON.stringify(saved));
        editingReport = JSON.parse(JSON.stringify(saved));
        rpDirty = false;
        try { localStorage.removeItem(DRAFT_KEY); } catch (e) { }
        logAction(`Rapport « ${saved.titre} » ${statut === 'Validé' ? 'validé' : 'enregistré en brouillon'}`, statut === 'Validé' ? 'fa-circle-check' : 'fa-file-signature');
        updateBadges(); rpRenderImgs(); rpRenderStatus(); rpChecks();
        const as = document.getElementById('rp-autosave'); if (as) as.textContent = 'Enregistré à ' + new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        if (saved._local) notify('💾 Rapport enregistré dans ce navigateur (Apps Script Rapports non installé)', 'info');
        else notify(statut === 'Validé' ? '✅ Rapport validé et enregistré sur Google Sheets' : '💾 Brouillon enregistré sur Google Sheets');
        return saved;
    } catch (e) {
        console.error(e);
        notify('⚠️ ' + (e.message || "Échec de l'enregistrement"), 'error');
    } finally {
        btns.forEach(b => b.disabled = false); prog('');
    }
}

                  <button class="btn btn-ghost btn-sm" onclick="exportReportPDF(rpGet(${r.id}))" title="PDF"><i class="fas fa-file-pdf"></i></button>
                  <button class="btn btn-ghost btn-sm" onclick="exportReportWord(rpGet(${r.id}))" title="Word"><i class="fas fa-file-word"></i></button>
                  <button class="btn btn-danger btn-sm" onclick="rpDelete(${r.id})" title="Supprimer"><i class="fas fa-trash"></i></button>
                </div>
              </div>
            </div>`;
        }).join('') || `<div class="empty" style="grid-column:1/-1"><i class="fas fa-book-open"></i>Aucun rapport${DB.rapports.length ? ' pour ces filtres' : ' pour le moment'}.<br><br><button class="btn btn-primary btn-sm" onclick="editingReport=null;go('rapport')"><i class="fas fa-pen-nib"></i> Rédiger le premier rapport</button></div>`;
    }
    document.getElementById('rps-pid').addEventListener('change', e => {
        const pid = e.target.value;
        document.getElementById('rps-aid').innerHTML = '<option value="">Toutes les activités</option>' + (pid ? DB.activites.filter(a => a.pid == pid).map(a => `<option value="${a.id}">${esc(a.nom)}</option>`).join('') : '');
        refresh();
    });
    ['rps-aid', 'rps-st', 'rps-type'].forEach(i => document.getElementById(i).addEventListener('change', refresh));
    document.getElementById('rps-q').addEventListener('input', refresh);
    kpi(); refresh();
}
function rpDelete(id) {
    const r = rpGet(id); if (!r) return;
    askConfirm('Supprimer le rapport', `<p>Supprimer définitivement « <b>${esc(r.titre)}</b> » ?</p>${r.images.length && !r._local ? '<p style="margin-top:8px;color:var(--text3);font-size:11.5px">Ses photos seront aussi placées dans la corbeille Google Drive.</p>' : ''}`, '<i class="fas fa-trash"></i> Supprimer', async () => {
        try { await removeReport(r); logAction(`Rapport « ${r.titre} » supprimé`, 'fa-trash'); notify('Rapport supprimé'); updateBadges(); refreshCurrentPage(); }
        catch (e) { notify('⚠️ ' + (e.message || 'Échec de la suppression'), 'error'); }
    }, null, true);
}

// ============================================================
// RECHERCHE UNIVERSELLE (Ctrl + K)
// ============================================================
const CMDK = { items: [], sel: 0 };
function toggleTheme() { const s = document.getElementById('theme-sel'); s.value = s.value === 'light' ? 'dark' : 'light'; s.dispatchEvent(new Event('change')); }
function cmdkSource() {
    const L = [];
    const add = (grp, label, icon, run, sub) => L.push({ grp, label, icon, run, sub: sub || '' });
    add('Actions', 'Nouvelle activité', 'fa-plus-circle', () => { selectedAct = null; go('saisie'); }, 'Alt N');
    add('Actions', 'Nouveau projet', 'fa-folder-plus', () => { go('projets'); showProjetForm(); });
    add('Actions', 'Rédiger un rapport', 'fa-pen-nib', () => { editingReport = null; go('rapport'); }, 'Alt R');
    add('Actions', 'Ajouter une ressource', 'fa-user-plus', () => { go('ressources'); showRessourceForm(); });
    add('Actions', 'Ajouter un indicateur au tableau de bord', 'fa-gauge-high', () => { go('tableau'); kpiManage(); });
    add('Actions', 'Synchroniser avec Google Sheets', 'fa-sync', () => syncAll(true), 'Ctrl S');
    add('Actions', 'Exporter les activités (CSV)', 'fa-download', exportCSV);
    add('Actions', 'Basculer le thème clair / sombre', 'fa-circle-half-stroke', toggleTheme);
    add('Actions', "Paramètres de l'organisation", 'fa-gear', openSettings);
    Object.entries(PAGE_TITLES).forEach(([k, t]) => add('Pages', t, PAGE_ICONS[k] || 'fa-file', () => { if (k === 'rapport') editingReport = null; if (k === 'saisie') selectedAct = null; go(k); }, 'Ouvrir'));
    DB.projets.forEach(p => add('Projets', p.nom, 'fa-folder', () => openProjetDetail(p.id), `${p.chef || ''} · ${p.statut}`));
    DB.activites.forEach(a => add('Activités', a.nom, a.jalon ? 'fa-diamond' : 'fa-list-check', () => gxOpen(a.id), `${pName(a.pid)} · ${a.resp} · ${isActivityLate(a) ? '⚠ ' + daysLate(a.fp) + ' j retard' : a.statut}`));
    DB.rapports.forEach(r => add('Rapports', r.titre || 'Rapport', 'fa-file-signature', () => viewReport(r.id), `${pName(r.projetId)} · ${fd(r.date)} · ${r.statut}`));
    DB.ressources.forEach(r => add('Personnes', r.nom, 'fa-user', () => { go('ressources'); showRessourceForm(r.id); }, [r.role, r.dept].filter(Boolean).join(' · ')));
    DB.documents.forEach(d => add('Fichiers', d.nom || 'Fichier', 'fa-paperclip', () => d.driveUrl ? window.open(d.driveUrl, '_blank') : go('docs'), `${pName(d.projetId)}${d.fileName ? ' · ' + d.fileName : ''}`));
    return L;
}
function cmdkOpen() {
    document.getElementById('cmdk-ov').classList.add('open');
    const q = document.getElementById('cmdk-q'); q.value = ''; cmdkFilter(); setTimeout(() => q.focus(), 10);
}
function cmdkClose() { document.getElementById('cmdk-ov')?.classList.remove('open'); }
const cmdkIsOpen = () => document.getElementById('cmdk-ov').classList.contains('open');
function cmdkFilter() {
    const q = normTxt(document.getElementById('cmdk-q').value.trim());
    const src = cmdkSource();
    let items;
    if (!q) items = src.filter(x => x.grp === 'Actions' || x.grp === 'Pages').slice(0, 14);
    else {
        const toks = q.split(/\s+/);
        const per = {};
        items = src.filter(x => { const h = normTxt(x.label + ' ' + x.sub + ' ' + x.grp); return toks.every(t => h.includes(t)); })
            .sort((a, b) => (normTxt(b.label).startsWith(q) ? 1 : 0) - (normTxt(a.label).startsWith(q) ? 1 : 0))
            .filter(x => (per[x.grp] = (per[x.grp] || 0) + 1) <= 8);
    }
    const order = ['Actions', 'Pages', 'Projets', 'Activités', 'Rapports', 'Personnes', 'Fichiers'];
    items.sort((a, b) => order.indexOf(a.grp) - order.indexOf(b.grp));
    CMDK.items = items; CMDK.sel = 0; cmdkRender();
}
function cmdkRender() {
    const box = document.getElementById('cmdk-list');
    if (!CMDK.items.length) { box.innerHTML = '<div class="empty" style="padding:28px"><i class="fas fa-magnifying-glass"></i>Aucun résultat</div>'; return; }
    let html = '', g = null;
    CMDK.items.forEach((it, i) => {
        if (it.grp !== g) { g = it.grp; html += `<div class="cmdk-grp">${g}</div>`; }
        html += `<div class="cmdk-it ${i === CMDK.sel ? 'on' : ''}" data-i="${i}"><i class="fas ${it.icon}"></i><span class="l">${esc(it.label)}</span><span class="s">${esc(it.sub)}</span></div>`;
    });
    box.innerHTML = html;
    box.querySelector('.cmdk-it.on')?.scrollIntoView({ block: 'nearest' });
}
function cmdkRun(i) { const it = CMDK.items[i]; if (!it) return; cmdkClose(); closeModal(); it.run(); }
document.getElementById('cmdk-q').addEventListener('input', cmdkFilter);
document.getElementById('cmdk-q').addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); CMDK.sel = Math.min(CMDK.sel + 1, CMDK.items.length - 1); cmdkRender(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); CMDK.sel = Math.max(CMDK.sel - 1, 0); cmdkRender(); }
    else if (e.key === 'Enter') { e.preventDefault(); cmdkRun(CMDK.sel); }
});
document.getElementById('cmdk-list').addEventListener('click', e => { const it = e.target.closest('.cmdk-it'); if (it) cmdkRun(+it.dataset.i); });
document.getElementById('cmdk-list').addEventListener('mousemove', e => { const it = e.target.closest('.cmdk-it'); if (it && +it.dataset.i !== CMDK.sel) { CMDK.sel = +it.dataset.i; document.querySelectorAll('.cmdk-it').forEach(x => x.classList.toggle('on', x === it)); } });
document.getElementById('cmdk-ov').addEventListener('click', e => { if (e.target.id === 'cmdk-ov') cmdkClose(); });

// ============================================================
// THÈME, RACCOURCIS, NAVIGATION, INITIALISATION
// ============================================================
document.getElementById('theme-sel').addEventListener('change', function () {
    document.body.className = this.value === 'light' ? 'light' : '';
    localStorage.setItem('ong_pro_theme', this.value);
    if (cur === 'tableau') dashRefresh();
});
(function () {
    const th = localStorage.getItem('ong_pro_theme') || 'dark';
    document.body.className = th === 'light' ? 'light' : '';
    document.getElementById('theme-sel').value = th;
})();
document.addEventListener('keydown', e => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); cmdkIsOpen() ? cmdkClose() : cmdkOpen(); return; }
    if (e.key === '/' && !typing && !cmdkIsOpen() && !document.getElementById('modal-overlay').classList.contains('open')) { e.preventDefault(); cmdkOpen(); return; }
    if (e.key === 'Escape') { if (cmdkIsOpen()) cmdkClose(); else closeModal(); return; }
    if (e.altKey && e.key === 'n') { selectedAct = null; go('saisie'); }
    if (e.altKey && e.key === 'r') { editingReport = null; go('rapport'); }
    if (e.altKey && e.key === 'b') go('bdd');
    if (e.altKey && e.key === 'g') go('gantt');
    if (e.altKey && e.key === 'a') go('alertes');
    if (e.ctrlKey && e.key === 's') { e.preventDefault(); if (cur === 'rapport' && document.getElementById('rp-form')) rpSave(RP?.statut === 'Validé' ? 'Validé' : 'Brouillon'); else syncAll(true); }
});
document.querySelectorAll('.nav-btn[data-p]').forEach(b => b.addEventListener('click', function () {
    if (this.dataset.p === 'rapport') editingReport = null;
    if (this.dataset.p === 'saisie') selectedAct = null;
    go(this.dataset.p);
}));
document.getElementById('modal-overlay').addEventListener('click', function (e) { if (e.target === this) closeModal(); });
// ---- Responsive : menu mobile + redessin du Gantt au changement de taille ----
function sbClose() { document.getElementById('sidebar').classList.remove('open'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') sbClose(); });
(function () {
    let t, lastW = window.innerWidth;
    window.addEventListener('resize', () => {
        clearTimeout(t);
        t = setTimeout(() => {
            if (window.innerWidth > 800) sbClose();
            const old = GX_LEFT; gxCalcLeft();
            if (old !== GX_LEFT && cur === 'gantt' && document.getElementById('gx-legend')) gxDraw(false);
            lastW = window.innerWidth;
        }, 180);
    });
})();
window.addEventListener('beforeunload', e => { if (cur === 'rapport' && rpDirty) { rpAutosave(); e.preventDefault(); e.returnValue = ''; } });

applyBrand();
refreshCurrentPage();
syncAll(true).then(() => go('accueil'));

    </script>
</body>
