          ${C.checklist.map((it, i) => `<div class="cl-item ${it.done ? 'done' : ''}"><input type="checkbox" data-ck="${i}" ${it.done ? 'checked' : ''}><span class="t" style="flex:1">${esc(it.t)}</span>${it.who ? `<span class="tag">${esc(it.who)}</span>` : ''}<button class="btn btn-ghost btn-icon btn-sm" data-cdel="${i}" title="Retirer"><i class="fas fa-xmark"></i></button></div>`).join('') || '<div class="empty" style="padding:18px"><i class="fas fa-list-check"></i>Découpez l\'activité en sous-tâches</div>'}
          <label class="chk" style="margin-top:8px;white-space:normal"><input type="checkbox" id="cl-link" ${C.link !== false ? 'checked' : ''}> Lier la checklist à l'avancement (« Nb tâches » et « Complétées » du formulaire)</label>
          <div id="cl-hint" style="font-size:11px;color:var(--yellow);margin-top:6px"></div>`;
        const syncForm = () => {
            if (C.link === false || !C.checklist.length) return;
            const nb = document.getElementById('s-nbt'), tc = document.getElementById('s-tc');
            const n = C.checklist.length, d = C.checklist.filter(x => x.done).length;
            if (+nb.value === n && +tc.value === d) return;
            nb.value = n; tc.value = d; tc.dispatchEvent(new Event('input'));
            document.getElementById('cl-hint').innerHTML = '<i class="fas fa-floppy-disk"></i> Avancement mis à jour dans le formulaire : cliquez sur « Enregistrer » pour l\'envoyer sur Sheets.';
        };
        const add = () => {
            const t = document.getElementById('cl-new').value.trim(); if (!t) return;
            C.checklist.push({ t, done: false, who: document.getElementById('cl-who').value.trim() });
            persist(); renderCollab(a); syncForm(); document.getElementById('cl-new')?.focus();
        };
        document.getElementById('cl-add').onclick = add;
        document.getElementById('cl-new').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
        body.querySelectorAll('[data-ck]').forEach(b => b.addEventListener('change', () => { C.checklist[+b.dataset.ck].done = b.checked; persist(); if (b.checked) logAction(`Sous-tâche « ${C.checklist[+b.dataset.ck].t} » cochée (${a.nom})`, 'fa-square-check'); renderCollab(a); syncForm(); }));
        body.querySelectorAll('[data-cdel]').forEach(b => b.addEventListener('click', () => { C.checklist.splice(+b.dataset.cdel, 1); persist(); renderCollab(a); syncForm(); }));
        document.getElementById('cl-link').addEventListener('change', e => { C.link = e.target.checked; persist(); syncForm(); });
        syncForm();
    }

    if (tab === 'com') {
        const fmtTxt = t => esc(t).replace(/@([\wÀ-ÿ\-]+)/g, '<b style="color:var(--accent2)">@$1</b>').replace(/\n/g, '<br>');
        body.innerHTML = `
          <div style="max-height:340px;overflow:auto;margin-bottom:10px" id="cm-list">
            ${C.comments.map((m, i) => `<div class="cm"><div class="user-avatar" style="background:${avatarColor(m.who)}">${initial(m.who)}</div><div class="cm-b"><div class="h"><b style="color:var(--text)">${esc(m.who)}</b>${timeAgo(m.ts)}<button class="btn btn-ghost btn-icon btn-sm" data-mdel="${i}" style="margin-left:auto;width:20px;height:20px" title="Supprimer"><i class="fas fa-xmark"></i></button></div>${fmtTxt(m.t)}</div></div>`).join('') || '<div class="empty" style="padding:18px"><i class="fas fa-comments"></i>Aucun commentaire. Lancez la discussion !</div>'}
          </div>
          <div style="display:flex;gap:10px;align-items:flex-start"><div class="user-avatar" style="background:${avatarColor(me)}">${initial(me)}</div>
            <div style="flex:1"><textarea id="cm-txt" rows="2" placeholder="Écrire un commentaire… mentionnez un collègue avec @Nom (Ctrl + Entrée pour envoyer)"></textarea>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><span style="font-size:10.5px;color:var(--text3)">Publié en tant que <b>${esc(me)}</b> · <a href="#" onclick="openSettings();return false" style="color:var(--accent2)">changer</a></span><button class="btn btn-primary btn-sm" id="cm-send"><i class="fas fa-paper-plane"></i> Publier</button></div></div></div>`;
        const send = () => {
            const t = document.getElementById('cm-txt').value.trim(); if (!t) return;
            C.comments.push({ t, who: me, ts: Date.now() }); persist();
            logAction(`Commentaire sur « ${a.nom} »`, 'fa-comment'); renderCollab(a);
        };
        document.getElementById('cm-send').onclick = send;
        document.getElementById('cm-txt').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); } });
        body.querySelectorAll('[data-mdel]').forEach(b => b.addEventListener('click', () => { C.comments.splice(+b.dataset.mdel, 1); persist(); renderCollab(a); }));
        const l = document.getElementById('cm-list'); l.scrollTop = l.scrollHeight;
    }

    if (tab === 'time') {
        body.innerHTML = `
          <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px">
            <div class="timer ${C.running ? 'run' : ''}" id="tm-disp">00:00:00</div>
            <button class="btn ${C.running ? 'btn-danger' : 'btn-success'}" id="tm-toggle"><i class="fas fa-${C.running ? 'stop' : 'play'}"></i> ${C.running ? 'Arrêter le chrono' : 'Démarrer le chrono'}</button>
            <div style="font-size:11.5px;color:var(--text2)">Total : <b style="color:var(--text)">${fmtMin(totMin)}</b>${cost ? ` · coût main-d'œuvre estimé <b style="color:var(--text)">${fe(cost)}</b> <span style="color:var(--text3)">(base ${esc(res.nom)} : ${fe(res.cout)}/mois, 160 h)</span>` : ''}</div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center">
            <span style="font-size:11px;color:var(--text3)">Saisie manuelle :</span>
            <input type="date" id="tm-d" value="${isoDate(getToday())}" style="width:auto">
            <input type="number" id="tm-h" min="0" placeholder="h" style="width:70px"><input type="number" id="tm-m" min="0" max="59" placeholder="min" style="width:70px">
            <input id="tm-note" placeholder="Note (ex : réunion communautaire)" style="flex:1;min-width:160px">
            <button class="btn btn-primary btn-sm" id="tm-add"><i class="fas fa-plus"></i> Ajouter</button>
          </div>
          ${C.time.slice().reverse().map((t, ri) => { const i = C.time.length - 1 - ri; return `<div class="tm-row"><i class="fas fa-stopwatch" style="color:var(--accent2)"></i><b style="width:70px">${fmtMin(t.min)}</b><span style="color:var(--text3);width:90px">${fd(t.d)}</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.note || '')}</span><span style="color:var(--text3)">${esc(t.who || '')}</span><button class="btn btn-ghost btn-icon btn-sm" data-tdel="${i}" title="Retirer"><i class="fas fa-xmark"></i></button></div>`; }).join('') || '<div class="empty" style="padding:18px"><i class="fas fa-stopwatch"></i>Aucun temps enregistré</div>'}`;
        const disp = document.getElementById('tm-disp');
        const tick = () => { if (!C.running) return; const s = Math.floor((Date.now() - C.running) / 1000); disp.textContent = [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map(x => String(x).padStart(2, '0')).join(':'); };
        if (C.running) { tick(); window.__tmInt = setInterval(tick, 1000); }
        document.getElementById('tm-toggle').onclick = () => {
            if (C.running) {
                const min = Math.max(1, Math.round((Date.now() - C.running) / 60000));
                C.time.push({ d: isoDate(getToday()), min, note: 'Chronomètre', who: me }); C.running = null;
                logAction(`${fmtMin(min)} enregistrées sur « ${a.nom} »`, 'fa-stopwatch');
            } else C.running = Date.now();
            persist(); renderCollab(a);
        };
        document.getElementById('tm-add').onclick = () => {
            const min = (+document.getElementById('tm-h').value || 0) * 60 + (+document.getElementById('tm-m').value || 0);
            if (min <= 0) return notify('Indiquez une durée', 'error');
            C.time.push({ d: document.getElementById('tm-d').value || isoDate(getToday()), min, note: document.getElementById('tm-note').value.trim(), who: me });
            persist(); logAction(`${fmtMin(min)} saisies sur « ${a.nom} »`, 'fa-stopwatch'); renderCollab(a);
        };
        body.querySelectorAll('[data-tdel]').forEach(b => b.addEventListener('click', () => { C.time.splice(+b.dataset.tdel, 1); persist(); renderCollab(a); }));
    }
}

function buildBDD(c) {
    c.innerHTML = `
    <div class="fbar">
      <input id="bdd-q" placeholder="🔍 Rechercher..." style="width:200px">
      <select id="bdd-pid"><option value="">Tous projets</option>${DB.projets.map(p => `<option value="${p.id}">${esc(p.nom)}</option>`).join('')}</select>
      <select id="bdd-st"><option value="">Tous statuts</option><option>Non démarrée</option><option>En cours</option><option>Terminée</option></select>
      <select id="bdd-pr"><option value="">Toutes priorités</option><option>Faible</option><option>Moyenne</option><option>Élevée</option><option>Critique</option></select>
      <div class="tb-space"></div>
      <button class="btn btn-ghost btn-sm" onclick="exportCSV()"><i class="fas fa-download"></i> CSV</button>
      <button class="btn btn-primary btn-sm" onclick="selectedAct=null;go('saisie')"><i class="fas fa-plus"></i> Ajouter</button>
      <button class="btn btn-ghost btn-sm" onclick="syncAll()"><i class="fas fa-sync"></i> Rafraîchir</button>
    </div>
    <div class="card">
      <div class="card-head"><span class="card-title">Activités <span class="cloud-badge"><i class="fas fa-cloud"></i> Sheets</span></span><span id="bdd-cnt" style="font-size:11px;color:var(--text3)"></span></div>
      <div class="card-body" style="overflow-x:auto"><table id="tbl-bdd" class="display" width="100%"></table></div>
    </div>`;
    function refresh() {
        const q = document.getElementById('bdd-q').value.toLowerCase();
        const pid = document.getElementById('bdd-pid').value, st = document.getElementById('bdd-st').value, pr = document.getElementById('bdd-pr').value;
        let data = DB.activites;
        if (q) data = data.filter(a => a.nom.toLowerCase().includes(q) || String(a.resp).toLowerCase().includes(q) || (a.tags || []).some(t => t.toLowerCase().includes(q)));
        if (pid) data = data.filter(a => a.pid == pid);
        if (st) data = data.filter(a => a.statut === st);
        if (pr) data = data.filter(a => a.prio === pr);
        document.getElementById('bdd-cnt').textContent = data.length + ' activité(s)';
        const rows = data.map(a => {
            const p = pct(a.tc, a.nbt);
            return [
                a.id, esc(pName(a.pid)),
                `<span style="font-weight:600;color:var(--text)">${a.jalon ? '<i class="fas fa-diamond" style="color:var(--yellow);font-size:8px"></i> ' : ''}${esc(a.nom)}</span>${a.tags && a.tags.length ? `<div>${a.tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>` : ''}`,
                `<div style="display:flex;align-items:center;gap:6px"><div class="user-avatar" style="background:${avatarColor(a.resp)};width:22px;height:22px;font-size:9px">${initial(a.resp)}</div>${esc(a.resp)}</div>`,
                `<span class="badge ${prioColor(a.prio)}">${esc(a.prio)}</span>`,
                `<span class="badge ${statusColor(a.statut)}">${esc(a.statut)}</span>`,
                `<div style="display:flex;align-items:center;gap:8px;min-width:90px"><div class="prog-track" style="flex:1"><div class="prog-fill" style="width:${p}%;background:${progColor(p)}"></div></div><span style="font-size:10px;font-weight:700;color:var(--text3);width:30px">${p}%</span></div>`,
                fd(a.fp),
                isActivityLate(a) ? `<span class="badge b-red">⚠ ${daysLate(a.fp)}j retard</span>` : `<span style="font-size:11px;color:var(--text3)">${a.statut === 'Terminée' ? '✓ Terminée' : (a.fp ? daysLeft(a.fp) + 'j restants' : '—')}</span>`
            ];
        });
        if ($.fn.DataTable.isDataTable('#tbl-bdd')) $('#tbl-bdd').DataTable().destroy();
        $('#tbl-bdd').DataTable({
            data: rows,
            columns: [{ title: '#' }, { title: 'Projet' }, { title: 'Activité' }, { title: 'Responsable' }, { title: 'Priorité' }, { title: 'Statut' }, { title: 'Avancement' }, { title: 'Fin prévue' }, { title: 'Délai' }],
            pageLength: 10, order: [[0, 'asc']],
            language: { url: 'https://cdn.datatables.net/plug-ins/1.13.6/i18n/fr-FR.json' }
        });
        $('#tbl-bdd tbody').off('click').on('click', 'tr', function () {
            const act = aById(parseInt($(this).find('td:first').text()));
            if (act) { selectedAct = act; go('saisie'); }
        });
    }
    refresh();
    document.getElementById('bdd-q').addEventListener('input', refresh);
    ['bdd-pid', 'bdd-st', 'bdd-pr'].forEach(id => document.getElementById(id).addEventListener('change', refresh));
}

function showProjetForm(id) {
    const p = id ? pById(id) : null;

    openModal(p ? `Modifier le projet : ${p.nom}` : 'Nouveau projet', `

      <div class="fld"><label class="fld-lbl">Chef de projet *</label><input id="pj-chef" list="pj-chef-list" value="${esc(p ? p.chef : '')}"><datalist id="pj-chef-list">${DB.ressources.map(r => `<option value="${esc(r.nom)}">`).join('')}</datalist></div>
      <div class="fld"><label class="fld-lbl">Pays / Zone</label><input id="pj-pays" value="${esc(p ? p.pays : '')}"></div>
    </div><div>
      <div style="display:flex;gap:8px"><div class="fld" style="flex:1"><label class="fld-lbl">Début</label><input type="date" id="pj-deb" value="${p ? formatDateInput(p.debut) : ''}"></div><div class="fld" style="flex:1"><label class="fld-lbl">Fin</label><input type="date" id="pj-fin" value="${p ? formatDateInput(p.fin) : ''}"></div></div>
      <div class="fld"><label class="fld-lbl">Budget prévu (FCFA)</label><input type="number" id="pj-bp" value="${p ? p.bprev : ''}" min="0"></div>
      <div class="fld"><label class="fld-lbl">Statut</label><select id="pj-st">${['En préparation', 'En cours', 'Terminé', 'Suspendu'].map(s => `<option ${p && p.statut === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
      <div class="fld"><label class="fld-lbl">Couleur</label><input type="color" id="pj-col" value="${p ? p.couleur : '#6366F1'}" style="width:60px"></div>
    </div></div>
    ${p ? `<div class="banner info" style="margin:0"><i class="fas fa-info-circle"></i> ${nbA} activité(s) associée(s) à ce projet.</div>` : ''}`,
        `<button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="saveProjet(${p ? p.id : 'null'})"><i class="fas fa-save"></i> ${p ? 'Mettre à jour' : 'Créer'}</button>`);
}
function saveProjet(id) {
    const v = k => document.getElementById('pj-' + k).value;
    const nom = v('nom').trim(), chef = v('chef').trim();
    if (!nom) return notify('Nom du projet requis', 'error');
    if (!chef) return notify('Chef de projet requis', 'error');
    if (v('deb') && v('fin') && compareDates(v('deb'), v('fin')) > 0) return notify('La date de début est après la date de fin', 'error');
    const data = { nom, desc: v('desc'), chef, pays: v('pays'), debut: v('deb') || null, fin: v('fin') || null, bprev: parseFloat(v('bp')) || 0, statut: v('st'), couleur: v('col') };
    if (id) Object.assign(pById(id), data);
    else DB.projets.push({ id: maxId(DB.projets), breel: 0, ...data });
    save(id ? `✅ Projet « ${nom} » mis à jour` : '✅ Projet créé sur Sheets', `Projet « ${nom} » ${id ? 'modifié' : 'créé'}`, 'fa-folder-tree');
    closeModal(); refreshCurrentPage();
}
function deleteProjet(id) {
    const p = pById(id); if (!p) return;
    const n = DB.activites.filter(a => a.pid == id).length;
    askConfirm('Supprimer le projet', `<p>Supprimer définitivement <b>${esc(p.nom)}</b> et ses <b>${n}</b> activité(s) ?</p>`, '<i class="fas fa-trash"></i> Supprimer', () => {
        DB.activites = DB.activites.filter(a => a.pid != id);
        DB.projets = DB.projets.filter(x => x.id != id);
        save('🗑️ Projet et activités supprimés', `Projet « ${p.nom} » supprimé`, 'fa-trash'); refreshCurrentPage(); updateBadges();
    }, null, true);
}
function openProjetDetail(id) {
    const p = pById(id); if (!p) return;

    openModal(`Détail : ${p.nom}`, `

const KB = { pid: '', resp: '', q: '' };
function buildKanban(c) {
    const cols = [
        { key: 'Non démarrée', color: 'var(--text3)', badge: 'b-gray' },
        { key: 'En cours', color: 'var(--blue)', badge: 'b-blue' },
        { key: 'Terminée', color: 'var(--green)', badge: 'b-green' }
    ];
    const resps = [...new Set(DB.activites.map(a => a.resp).filter(Boolean))].sort();
    c.innerHTML = `<div class="fbar">
      <select id="kb-pid"><option value="">Tous projets</option>${DB.projets.map(p => `<option value="${p.id}" ${KB.pid == p.id ? 'selected' : ''}>${esc(p.nom)}</option>`).join('')}</select>
      <select id="kb-resp"><option value="">Tous responsables</option>${resps.map(r => `<option ${KB.resp === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select>
      <input id="kb-q" placeholder="🔍 Filtrer les cartes…" value="${esc(KB.q)}" style="min-width:180px">
      <span class="gx-hint" style="margin-left:auto"><i class="fas fa-hand-pointer"></i> Glissez une carte dans une autre colonne pour changer son statut</span>
    </div><div class="kanban-board" id="kb-board"></div>`;
    function draw() {
        let acts = DB.activites;
        if (KB.pid) acts = acts.filter(a => a.pid == KB.pid);
        if (KB.resp) acts = acts.filter(a => a.resp === KB.resp);
        if (KB.q) { const q = normTxt(KB.q); acts = acts.filter(a => normTxt(a.nom + ' ' + a.resp + ' ' + (a.tags || []).join(' ')).includes(q)); }
        const CA = collabAll();
        document.getElementById('kb-board').innerHTML = cols.map(col => {
            const items = acts.filter(a => a.statut === col.key);
            return `<div class="kanban-col" data-st="${col.key}">
              <div class="kanban-col-head"><span style="color:${col.color}">${col.key}</span><span class="badge ${col.badge}">${items.length}</span></div>
              ${items.map(a => {
                const C = collabGet(a.id, CA), ck = C.checklist.length, ckd = C.checklist.filter(x => x.done).length;
                return `<div class="kanban-card" draggable="true" data-id="${a.id}" style="border-left:3px solid ${pById(a.pid)?.couleur || 'var(--border)'}">
                <div class="kanban-card-title">${a.jalon ? '<i class="fas fa-diamond" style="color:var(--yellow);font-size:8px"></i> ' : ''}${esc(a.nom)}</div>
                <div style="font-size:10px;color:var(--text3);margin-bottom:4px">${esc(pName(a.pid))}</div>
                <div class="prog-track" style="margin:5px 0"><div class="prog-fill" style="width:${pct(a.tc, a.nbt)}%;background:${col.color}"></div></div>
                <div class="kanban-card-meta">
                  <div class="user-avatar" style="background:${avatarColor(a.resp)};width:18px;height:18px;font-size:8px">${initial(a.resp)}</div>
                  <span>${esc(String(a.resp).split(' ')[0])}</span><span class="badge ${prioColor(a.prio)}">${esc(a.prio)}</span>
                  ${a.fp ? `<span>${fdS(a.fp)}</span>` : ''}${isActivityLate(a) ? '<span style="color:var(--red);font-weight:700">⚠ Retard</span>' : ''}
                  ${ck ? `<span title="Checklist"><i class="fas fa-square-check"></i> ${ckd}/${ck}</span>` : ''}${C.comments.length ? `<span title="Commentaires"><i class="fas fa-comment"></i> ${C.comments.length}</span>` : ''}${C.running ? '<span style="color:var(--green)" title="Chrono en cours"><i class="fas fa-stopwatch"></i></span>' : ''}
                  <span style="margin-left:auto;font-weight:700">${pct(a.tc, a.nbt)}%</span>
                </div>
              </div>`;
            }).join('')}
              ${!items.length ? '<div style="text-align:center;padding:20px;color:var(--text3);font-size:11px">Déposez une carte ici</div>' : ''}
            </div>`;
        }).join('');
    }
    draw();
    document.getElementById('kb-pid').addEventListener('change', e => { KB.pid = e.target.value; draw(); });
    document.getElementById('kb-resp').addEventListener('change', e => { KB.resp = e.target.value; draw(); });
    document.getElementById('kb-q').addEventListener('input', e => { KB.q = e.target.value; draw(); });
    const board = document.getElementById('kb-board');
    let dragId = null;
    board.addEventListener('click', e => { const card = e.target.closest('.kanban-card'); if (card) gxOpen(+card.dataset.id); });
    board.addEventListener('dragstart', e => { const card = e.target.closest('.kanban-card'); if (!card) return; dragId = +card.dataset.id; card.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(dragId)); });
    board.addEventListener('dragend', e => { e.target.closest('.kanban-card')?.classList.remove('dragging'); board.querySelectorAll('.over').forEach(x => x.classList.remove('over')); });
    board.addEventListener('dragover', e => { const col = e.target.closest('.kanban-col'); if (!col) return; e.preventDefault(); board.querySelectorAll('.kanban-col').forEach(x => x.classList.toggle('over', x === col)); });
    board.addEventListener('drop', e => {
        const col = e.target.closest('.kanban-col'); if (!col) return;
        e.preventDefault(); col.classList.remove('over');
        const a = aById(dragId || +e.dataTransfer.getData('text/plain')); dragId = null;
        if (!a || a.statut === col.dataset.st) return;
        kbMove(a, col.dataset.st); draw();
    });
}
function kbMove(a, st) {
    const today = isoDate(getToday());
    if (st === 'Terminée') { a.tc = a.nbt; if (!a.dr) a.dr = a.dp && compareDates(a.dp, today) <= 0 ? a.dp : today; if (!a.fr) a.fr = today; }
    else if (st === 'Non démarrée') { a.tc = 0; a.fr = null; }
    else { if (a.nbt < 2) { a.nbt = 2; a.tc = 1; } else a.tc = Math.min(Math.max(a.tc, 1), a.nbt - 1); if (!a.dr) a.dr = today; a.fr = null; }
    a.statut = autoStatut(a.nbt, a.tc); a.progress = pct(a.tc, a.nbt);
    save(`✅ « ${a.nom} » → ${a.statut}`, `« ${a.nom} » déplacée vers ${a.statut}`, 'fa-columns');
    updateBadges();
}

const CAL = { y: null, m: null, pid: '', reports: true };
function buildCalendrier(c) {
    if (CAL.y === null) { const t = getToday(); CAL.y = t.getFullYear(); CAL.m = t.getMonth(); }
    c.innerHTML = `<div class="gx-toolbar">
      <button class="btn btn-ghost btn-icon btn-sm" id="cal-prev" title="Mois précédent"><i class="fas fa-chevron-left"></i></button>
      <span id="cal-lbl" style="font-weight:700;font-size:14px;min-width:150px;text-align:center;text-transform:capitalize"></span>
      <button class="btn btn-ghost btn-icon btn-sm" id="cal-next" title="Mois suivant"><i class="fas fa-chevron-right"></i></button>
      <button class="btn btn-ghost btn-sm" id="cal-today"><i class="fas fa-crosshairs"></i> Aujourd'hui</button>
      <select id="cal-pid"><option value="">Tous les projets</option>${DB.projets.map(p => `<option value="${p.id}" ${CAL.pid == p.id ? 'selected' : ''}>${esc(p.nom)}</option>`).join('')}</select>
      <label class="chk"><input type="checkbox" id="cal-rp" ${CAL.reports ? 'checked' : ''}> Afficher les rapports</label>
      <div class="tb-space"></div><span class="pbadge" id="cal-sum"></span>
    </div>
    <div class="card" style="overflow-x:auto"><div style="min-width:760px">
      <div class="cal-head">${['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'].map(d => `<div>${d}</div>`).join('')}</div>
      <div class="cal-grid" id="cal-grid"></div>
    </div></div>
    <div class="gx-hint"><i class="fas fa-hand-pointer"></i> Les activités apparaissent à leur date de fin prévue. Glissez-en une sur un autre jour pour décaler son échéance (la durée est conservée) · cliquez pour ouvrir la fiche.</div>`;
    const shift = n => { const d = new Date(CAL.y, CAL.m + n, 1); CAL.y = d.getFullYear(); CAL.m = d.getMonth(); calDraw(); };
    document.getElementById('cal-prev').onclick = () => shift(-1);
    document.getElementById('cal-next').onclick = () => shift(1);
    document.getElementById('cal-today').onclick = () => { const t = getToday(); CAL.y = t.getFullYear(); CAL.m = t.getMonth(); calDraw(); };
    document.getElementById('cal-pid').onchange = e => { CAL.pid = e.target.value; calDraw(); };
    document.getElementById('cal-rp').onchange = e => { CAL.reports = e.target.checked; calDraw(); };
    const grid = document.getElementById('cal-grid');
    let dragId = null;
    grid.addEventListener('click', e => {
        const ev = e.target.closest('[data-id]'); if (ev) return gxOpen(+ev.dataset.id);
        const rp = e.target.closest('[data-rp]'); if (rp) return viewReport(+rp.dataset.rp);
        const more = e.target.closest('[data-more]'); if (more) return calDayModal(+more.dataset.more);
    });
    grid.addEventListener('dragstart', e => { const ev = e.target.closest('[data-id]'); if (!ev) return; dragId = +ev.dataset.id; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(dragId)); });
    grid.addEventListener('dragover', e => { const d = e.target.closest('.cal-day'); if (!d || !dragId) return; e.preventDefault(); grid.querySelectorAll('.over').forEach(x => x !== d && x.classList.remove('over')); d.classList.add('over'); });
    grid.addEventListener('dragend', () => { grid.querySelectorAll('.over').forEach(x => x.classList.remove('over')); dragId = null; });
    grid.addEventListener('drop', e => {
        const d = e.target.closest('.cal-day'); if (!d) return;
        e.preventDefault(); d.classList.remove('over');
        const a = aById(dragId); dragId = null; if (!a || !a.fp) return;
        const old = toDayNum(parseDate(a.fp)), nw = +d.dataset.day, delta = nw - old;
        if (!delta) return;
        askConfirm('Décaler l\'échéance', `<p style="margin-bottom:10px">Activité : <b>${esc(a.nom)}</b></p>
          <div style="display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12px;background:var(--bg3);padding:12px;border-radius:8px">
            <span style="color:var(--text3)">Dates prévues actuelles</span><span>${fd(a.dp)} → ${fd(a.fp)}</span>
            <span style="color:var(--text3)">Nouvelles dates</span><b style="color:var(--accent2)">${a.dp ? fd(fromDayNum(toDayNum(parseDate(a.dp)) + delta)) : '—'} → ${fd(fromDayNum(nw))}</b>
          </div><p style="font-size:11px;color:var(--text3);margin-top:8px">${delta > 0 ? '+' : ''}${delta} jour(s) · la durée de l'activité est conservée.</p>`,
            '<i class="fas fa-save"></i> Enregistrer', () => {
                if (a.dp) a.dp = isoDate(fromDayNum(toDayNum(parseDate(a.dp)) + delta));
                a.fp = isoDate(fromDayNum(nw));
                save('✅ Échéance mise à jour sur Sheets', `Échéance de « ${a.nom} » déplacée au ${fd(a.fp)}`, 'fa-calendar-days');
                updateBadges(); calDraw();
            });
    });
    calDraw();
}
function calEvents() {
    let acts = DB.activites.filter(a => parseDate(a.fp));
    if (CAL.pid) acts = acts.filter(a => a.pid == CAL.pid);
    const byDay = {};
    acts.forEach(a => { const d = toDayNum(parseDate(a.fp)); (byDay[d] = byDay[d] || []).push({ t: 'a', a }); });
    if (CAL.reports) DB.rapports.filter(r => parseDate(r.date) && (!CAL.pid || r.projetId == CAL.pid)).forEach(r => { const d = toDayNum(parseDate(r.date)); (byDay[d] = byDay[d] || []).push({ t: 'r', r }); });
    return byDay;
}
function calEvHTML(e) {
    if (e.t === 'r') return `<div class="cal-ev rp" data-rp="${e.r.id}" title="${esc(e.r.titre)}"><i class="fas fa-file-signature"></i> ${esc(e.r.titre || 'Rapport')}</div>`;
    const a = e.a, col = pById(a.pid)?.couleur || '#6366F1', late = isActivityLate(a), done = a.statut === 'Terminée';
    return `<div class="cal-ev ${late ? 'late' : ''} ${done ? 'done' : ''}" draggable="true" data-id="${a.id}" style="background:${done ? hexA(col, .5) : col}" title="${esc(a.nom)} — ${esc(a.resp)} · ${pct(a.tc, a.nbt)}%">${a.jalon ? '◆ ' : ''}${done ? '✓ ' : ''}${esc(a.nom)}</div>`;
}
function calDraw() {
    const grid = document.getElementById('cal-grid'); if (!grid) return;
    const first = new Date(CAL.y, CAL.m, 1), last = new Date(CAL.y, CAL.m + 1, 0);
    const start = toDayNum(first) - ((first.getDay() + 6) % 7), end = toDayNum(last) + (6 - (last.getDay() + 6) % 7);
    const tN = toDayNum(getToday()), byDay = calEvents();
    let html = '', nAct = 0, nLate = 0;
    for (let d = start; d <= end; d++) {
        const dt = fromDayNum(d), out = dt.getMonth() !== CAL.m, evs = byDay[d] || [];
        if (!out) evs.forEach(e => { if (e.t === 'a') { nAct++; if (isActivityLate(e.a)) nLate++; } });
        html += `<div class="cal-day ${out ? 'out' : ''} ${d === tN ? 'today' : ''} ${[0, 6].includes(dt.getDay()) ? 'we' : ''}" data-day="${d}"><div class="n">${dt.getDate()}</div>
          ${evs.slice(0, 4).map(calEvHTML).join('')}${evs.length > 4 ? `<div class="cal-more" data-more="${d}">+${evs.length - 4} autre(s)</div>` : ''}</div>`;
    }
    grid.innerHTML = html;
    document.getElementById('cal-lbl').textContent = first.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
    document.getElementById('cal-sum').textContent = `${nAct} échéance(s) ce mois${nLate ? ` · ${nLate} en retard` : ''}`;
}
function calDayModal(d) {
    const evs = calEvents()[d] || [];
    openModal('Échéances du ' + fd(fromDayNum(d)), evs.map(e => e.t === 'r'
        ? `<div class="fi" onclick="closeModal();viewReport(${e.r.id})"><div class="ic" style="background:var(--purplebg);color:var(--purple)"><i class="fas fa-file-signature"></i></div><div style="min-width:0"><div class="t">${esc(e.r.titre)}</div><div class="s">Rapport · ${esc(pName(e.r.projetId))}</div></div></div>`
        : `<div class="fi" onclick="closeModal();gxOpen(${e.a.id})"><div class="ic" style="background:${hexA(pById(e.a.pid)?.couleur || '#6366F1', .2)};color:${pById(e.a.pid)?.couleur || '#6366F1'}"><i class="fas fa-list-check"></i></div><div style="min-width:0;flex:1"><div class="t">${esc(e.a.nom)}</div><div class="s">${esc(pName(e.a.pid))} · ${esc(e.a.resp)}</div></div><span class="badge ${statusColor(e.a.statut)}">${esc(e.a.statut)}</span></div>`).join(''),
        '<button class="btn btn-ghost" onclick="closeModal()">Fermer</button>');
}

    </div>`, `<button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="saveRessource(${r ? r.id : 'null'})"><i class="fas fa-save"></i> Enregistrer</button>`);
}
function saveRessource(id) {
    const v = k => document.getElementById('rs-' + k).value;
    const nom = v('nom').trim();
    if (!nom) return notify('Nom requis', 'error');
    const dispo = Math.max(0, Math.min(100, parseInt(v('dispo'))));
    const data = { nom, role: v('role'), dept: v('dept'), dispo: isNaN(dispo) ? 100 : dispo, cout: parseFloat(v('cout')) || 0 };
    if (id) {
        const r = DB.ressources.find(x => x.id == id);
        if (r.nom !== nom) DB.activites.forEach(a => { if (a.resp === r.nom) a.resp = nom; });
        Object.assign(r, data);
    } else DB.ressources.push({ id: maxId(DB.ressources), projets: [], ...data });
    save(id ? 'Ressource mise à jour' : 'Ressource ajoutée', `Ressource « ${nom} » ${id ? 'modifiée' : 'ajoutée'}`, 'fa-user'); closeModal(); refreshCurrentPage();
}
function deleteRessource(id) {
    const r = DB.ressources.find(x => x.id == id); if (!r) return;
    const used = DB.activites.filter(a => a.resp === r.nom).length;
    askConfirm('Supprimer la ressource', `<p>Supprimer <b>${esc(r.nom)}</b> ?</p>${used ? `<p style="margin-top:8px;color:var(--yellow)">⚠️ Responsable de ${used} activité(s) : elles conserveront ce nom.</p>` : ''}`, '<i class="fas fa-trash"></i> Supprimer', () => {
        DB.ressources = DB.ressources.filter(x => x.id != id); save('Ressource supprimée', `Ressource « ${r.nom} » supprimée`, 'fa-trash'); refreshCurrentPage();
    }, null, true);
}

// ============================================================
// DIAGRAMME DE GANTT PROFESSIONNEL
// ============================================================
const GX = { zoom: 'week', mode: 'prev', colorBy: 'projet', deps: true, pid: '', grp: 'all', collapsed: new Set() };
const GX_PPD = { day: 34, week: 15, month: 4.2, quarter: 1.5 };
const GX_ROW = 34; let GX_LEFT = 450;
function gxCalcLeft() { const w = window.innerWidth; GX_LEFT = w <= 560 ? 175 : w <= 800 ? 240 : w <= 1100 ? 360 : 450; return GX_LEFT; }
gxCalcLeft();
let GX_STATE = null;

function buildGantt(c) {
    const seg = (id, items, val) => `<div class="seg" id="${id}">${items.map(([v, l]) => `<button data-v="${v}" class="${val === v ? 'on' : ''}">${l}</button>`).join('')}</div>`;
    const sel = (id, items, val, title) => `<select id="${id}" title="${title || ''}">${items.map(([v, l]) => `<option value="${v}" ${String(val) === String(v) ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
    c.innerHTML = `
    <div class="gx-toolbar">
      ${sel('gx-pid', [['', 'Tous les projets'], ...DB.projets.map(p => [p.id, esc(p.nom)])], GX.pid)}
      ${seg('gx-mode', [['prev', 'Prévu'], ['reel', 'Réel'], ['cmp', 'Prévu vs Réel']], GX.mode)}
      ${sel('gx-grp', [['all', 'Toutes les activités'], ['cours', 'En cours'], ['nd', 'Non démarrées'], ['term', 'Terminées'], ['retard', 'En retard']], GX.grp)}
      ${seg('gx-zoom', [['day', 'Jour'], ['week', 'Semaine'], ['month', 'Mois'], ['quarter', 'Trimestre']], GX.zoom)}
      ${sel('gx-color', [['projet', 'Couleur : projet'], ['statut', 'Couleur : statut'], ['prio', 'Couleur : priorité'], ['resp', 'Couleur : responsable']], GX.colorBy, 'Couleur des barres')}
      <label class="chk"><input type="checkbox" id="gx-deps" ${GX.deps ? 'checked' : ''}> Dépendances</label>
      <div class="tb-space"></div>
      <button class="btn btn-ghost btn-sm" id="gx-today"><i class="fas fa-crosshairs"></i> Aujourd'hui</button>
      <button class="btn btn-ghost btn-sm" id="gx-fold"><i class="fas fa-layer-group"></i> Replier / Déplier</button>
      <button class="btn btn-ghost btn-sm" onclick="window.print()"><i class="fas fa-print"></i> Imprimer</button>
    </div>
    <div class="gx-scroll" id="gx-scroll"><div id="gx-inner"></div></div>
    <div class="gx-legend" id="gx-legend"></div>
    <div class="gx-hint"><i class="fas fa-hand-pointer"></i> Glissez une barre pour décaler l'activité · tirez son bord droit pour changer la durée · cliquez sur une barre ou un nom pour ouvrir la fiche · cliquez sur un projet pour le replier.</div>`;

    const bindSeg = (id, key) => document.querySelectorAll(`#${id} button`).forEach(b => b.addEventListener('click', () => {
        GX[key] = b.dataset.v;
        document.querySelectorAll(`#${id} button`).forEach(x => x.classList.toggle('on', x === b));
        gxDraw(key === 'zoom');
    }));
    bindSeg('gx-mode', 'mode'); bindSeg('gx-zoom', 'zoom');
    document.getElementById('gx-pid').addEventListener('change', e => { GX.pid = e.target.value; gxDraw(true); });
    document.getElementById('gx-grp').addEventListener('change', e => { GX.grp = e.target.value; gxDraw(false); });
    document.getElementById('gx-color').addEventListener('change', e => { GX.colorBy = e.target.value; gxDraw(false); });
    document.getElementById('gx-deps').addEventListener('change', e => { GX.deps = e.target.checked; gxDraw(false); });
    document.getElementById('gx-today').addEventListener('click', gxScrollToday);
    document.getElementById('gx-fold').addEventListener('click', () => {
        const ids = DB.projets.map(p => p.id).concat([0]);
        const allClosed = ids.every(id => GX.collapsed.has(id));
        GX.collapsed = allClosed ? new Set() : new Set(ids);
        gxDraw(false);
    });
    gxBindPointer();
    gxDraw(true);
}

function gxDates(a, kind) {
    if (kind === 'prev') {
        let s = parseDate(a.dp), e = parseDate(a.fp);
        if (!s && !e) return null;
        s = s || e; e = e || s; if (e < s) e = s;
        return { s: toDayNum(s), e: toDayNum(e) };
    }
    const s = parseDate(a.dr); if (!s) return null;
    let e = parseDate(a.fr), open = false;
    if (!e) { open = true; const t = getToday(); e = a.statut === 'Terminée' ? (parseDate(a.fp) || s) : (t > s ? t : s); }
    if (e < s) e = s;
    return { s: toDayNum(s), e: toDayNum(e), open };
}
const GX_STATUT_COL = { 'Terminée': '#10B981', 'En cours': '#3B82F6', 'Non démarrée': '#94A3B8' };
const GX_PRIO_COL = { 'Critique': '#EF4444', 'Élevée': '#F59E0B', 'Moyenne': '#3B82F6', 'Faible': '#94A3B8' };
function gxColor(a) {
    if (GX.colorBy === 'statut') return GX_STATUT_COL[a.statut] || '#94A3B8';
    if (GX.colorBy === 'prio') return GX_PRIO_COL[a.prio] || '#94A3B8';
    if (GX.colorBy === 'resp') return avatarColor(a.resp);
    return pById(a.pid)?.couleur || '#6366F1';
}

function gxDraw(scrollToday) {
    gxCalcLeft();
    const inner = document.getElementById('gx-inner'); if (!inner) return;
    const tN = toDayNum(getToday());
    let acts = DB.activites.slice();
    if (GX.pid) acts = acts.filter(a => a.pid == GX.pid);
    const gf = { cours: a => a.statut === 'En cours', nd: a => a.statut === 'Non démarrée', term: a => a.statut === 'Terminée', retard: isActivityLate }[GX.grp];
    if (gf) acts = acts.filter(gf);

    const groups = [];
    DB.projets.forEach(p => { const list = acts.filter(a => a.pid == p.id); if (list.length) groups.push({ p, list }); });
    const orph = acts.filter(a => !pById(a.pid));
    if (orph.length) groups.push({ p: { id: 0, nom: 'Sans projet', couleur: '#64748B', chef: '' }, list: orph });
    const sk = a => { const d = gxDates(a, 'prev') || gxDates(a, 'reel'); return d ? d.s : 1e9; };
    groups.forEach(g => g.list.sort((x, y) => sk(x) - sk(y)));
    if (!groups.length) {
        inner.innerHTML = '<div class="empty"><i class="fas fa-stream"></i>Aucune activité pour ce filtre</div>';
        document.getElementById('gx-legend').innerHTML = ''; GX_STATE = null; return;
    }
    const mainKind = GX.mode === 'prev' ? 'prev' : 'reel';

    // ---- plage temporelle ----
    let min = Infinity, max = -Infinity;
    acts.forEach(a => ['prev', 'reel'].forEach(k => { const d = gxDates(a, k); if (d) { min = Math.min(min, d.s); max = Math.max(max, d.e); } }));
    if (!isFinite(min)) { min = tN - 7; max = tN + 30; }
    min = Math.min(min, tN); max = Math.max(max, tN);
    const z = GX.zoom;
    if (z === 'day') { min -= 3; max += 10; }
    else if (z === 'week') { min -= 7; max += 21; min -= (fromDayNum(min).getDay() + 6) % 7; max += (7 - fromDayNum(max).getDay()) % 7; }
    else if (z === 'month') { const a = fromDayNum(min), b = fromDayNum(max); min = toDayNum(new Date(a.getFullYear(), a.getMonth() - 1, 1)); max = toDayNum(new Date(b.getFullYear(), b.getMonth() + 2, 0)); }
    else { const a = fromDayNum(min), b = fromDayNum(max); min = toDayNum(new Date(a.getFullYear(), Math.floor(a.getMonth() / 3) * 3, 1)); max = toDayNum(new Date(b.getFullYear(), Math.floor(b.getMonth() / 3) * 3 + 6, 0)); }
    const ppd = GX_PPD[z];
    const TW = Math.ceil((max - min + 1) * ppd);
    const X = d => (d - min) * ppd;

    // ---- en-tête à deux niveaux ----
    const segs = (keyFn, labelFn) => {
        const out = []; let ck = null, start = min;
        for (let d = min; d <= max + 1; d++) {
            const k = d <= max ? keyFn(fromDayNum(d)) : '__end';
            if (k !== ck) { if (ck !== null) out.push({ s: start, e: d - 1, label: labelFn(fromDayNum(start)) }); ck = k; start = d; }
        }
        return out;
    };
    const MO = d => d.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
    let top, bot;
    if (z === 'day') { top = segs(d => d.getFullYear() * 12 + d.getMonth(), MO); bot = segs(d => toDayNum(d), d => `${d.getDate()}<small>${'DLMMJVS'[d.getDay()]}</small>`); }
    else if (z === 'week') { top = segs(d => d.getFullYear() * 12 + d.getMonth(), MO); bot = segs(d => toDayNum(d) - (d.getDay() + 6) % 7, d => `S${isoWeek(d)} <small>${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}</small>`); }
    else if (z === 'month') { top = segs(d => d.getFullYear(), d => String(d.getFullYear())); bot = segs(d => d.getFullYear() * 12 + d.getMonth(), d => d.toLocaleDateString('fr-FR', { month: 'short' })); }
    else { top = segs(d => d.getFullYear(), d => String(d.getFullYear())); bot = segs(d => d.getFullYear() * 4 + Math.floor(d.getMonth() / 3), d => 'T' + (Math.floor(d.getMonth() / 3) + 1)); }

    // ---- lignes ----
    const rows = [];
    groups.forEach(g => { rows.push({ t: 'p', g }); if (!GX.collapsed.has(g.p.id)) g.list.forEach(a => rows.push({ t: 'a', a, g })); });
    const H = rows.length * GX_ROW;

    // ---- fond : week-ends, grille, aujourd'hui ----
    let bg = '';
    if (z === 'day' || z === 'week') for (let d = min; d <= max; d++) if (fromDayNum(d).getDay() === 6) bg += `<div class="gx-we" style="left:${X(d)}px;width:${ppd * 2}px"></div>`;
    bot.forEach(s => bg += `<div class="gx-gl" style="left:${X(s.s)}px"></div>`);
    bg += `<div class="gx-today" style="left:${X(tN) + (z === 'day' ? ppd / 2 : 0)}px"></div>`;

    const pos = {};
    let html = '';
    rows.forEach((r, idx) => {
        if (r.t === 'p') {
            const g = r.g, col = g.p.couleur || '#6366F1';
            let s = Infinity, e = -Infinity;
            g.list.forEach(a => { const d = gxDates(a, mainKind) || gxDates(a, 'prev'); if (d) { s = Math.min(s, d.s); e = Math.max(e, d.e); } });
            const av = Math.round(g.list.reduce((t, a) => t + pct(a.tc, a.nbt), 0) / g.list.length);
            const late = g.list.filter(isActivityLate).length;
            const closed = GX.collapsed.has(g.p.id);
            html += `<div class="gx-row gx-prow" style="height:${GX_ROW}px">
              <div class="gx-l" style="width:${GX_LEFT}px" data-fold="${g.p.id}" title="Cliquer pour ${closed ? 'déplier' : 'replier'}">
                <div class="gx-name"><i class="fas fa-chevron-down gx-caret ${closed ? 'closed' : ''}"></i><span class="gx-dot" style="background:${col};border-radius:3px;width:10px;height:10px"></span><span class="t" style="font-weight:700">${esc(g.p.nom)}</span><span class="badge b-gray">${g.list.length}</span>${late ? `<span class="badge b-red">⚠ ${late}</span>` : ''}</div>
                <div class="gx-resp">${esc(g.p.chef || '')}</div>
                <div class="gx-d">${isFinite(s) ? fdS(fromDayNum(s)) : '—'}</div><div class="gx-d">${isFinite(e) ? fdS(fromDayNum(e)) : '—'}</div>

        }

        const base = GX.mode === 'cmp' ? gxDates(a, 'prev') : null;
        let t = '';
        if (base) t += `<div class="gx-base" style="left:${X(base.s)}px;width:${Math.max((base.e - base.s + 1) * ppd, 4)}px;top:${GX_ROW - 10}px" title="Prévu"></div>`;
        if (main) {
            const isMs = a.jalon || (main.s === main.e && GX.mode !== 'cmp');
            if (isMs) {
                const cx = X(main.e) + ppd / 2;
                t += `<div class="gx-ms" data-id="${a.id}" style="left:${cx - 7}px;top:${(GX_ROW - 14) / 2}px;background:${col}"></div>`;
                t += `<div class="gx-blbl" style="left:${cx + 12}px">${esc(a.nom)}</div>`;
                pos[a.id] = { y: idx, sX: cx - 9, eX: cx + 9 };
            } else {
                const top = base ? 5 : 8, h = base ? 17 : 18;
                const left = X(main.s), width = Math.max((main.e - main.s + 1) * ppd, 6);
                const drag = GX.mode !== 'cmp';
                t += `<div class="gx-bar ${drag ? '' : 'nodrag'} ${late ? 'late' : ''}" data-id="${a.id}" data-kind="${mainKind}" data-s="${main.s}" data-e="${main.e}" style="left:${left}px;width:${width}px;top:${top}px;height:${h}px;background:${hexA(col, .3)};border:1px solid ${col}"><div class="fill" style="width:${Math.min(p_, 100)}%;background:${col}"></div>${width > 40 ? `<span class="lbl">${p_}%</span>` : ''}${drag ? '<div class="grip"></div>' : ''}</div>`;
                let extra = 0;
                if (late && GX.mode === 'prev' && tN > main.e) {
                    extra = (tN - main.e) * ppd;
                    t += `<div class="gx-over" style="left:${X(main.e + 1)}px;width:${extra}px;top:${top}px;height:${h}px"></div>`;
                }
                t += `<div class="gx-blbl" style="left:${left + width + extra + 6}px">${esc(String(a.resp || '').split(' ')[0])}</div>`;
                pos[a.id] = { y: idx, sX: left, eX: left + width };
            }
        } else {
            t += `<div class="gx-blbl" style="left:${base ? X(base.e + 1) + 8 : 8}px;font-style:italic">${GX.mode === 'prev' ? 'Dates prévues non renseignées' : 'Pas encore démarrée (aucune date réelle)'}</div>`;
        }

            <div class="gx-resp" title="${esc(a.resp)}">${esc(a.resp)}</div>

        </div>`;
    });

    // ---- dépendances (flèches) ----
    let svg = '';
    if (GX.deps) rows.forEach(r => {
        if (r.t !== 'a') return;
        (r.a.deps || []).forEach(did => {
            const P = pos[did], S = pos[r.a.id]; if (!P || !S) return;
            const y1 = P.y * GX_ROW + GX_ROW / 2, y2 = S.y * GX_ROW + GX_ROW / 2, x1 = P.eX, x2 = S.sX;
            const bad = x2 < x1 - 1, c = bad ? '#EF4444' : '#94A3B8';
            let d;
            if (x2 - x1 >= 14) d = `M${x1},${y1} H${x1 + 7} V${y2} H${x2 - 1}`;
            else { const ym = y2 > y1 ? S.y * GX_ROW + 2 : (S.y + 1) * GX_ROW - 2; d = `M${x1},${y1} H${x1 + 7} V${ym} H${x2 - 12} V${y2} H${x2 - 1}`; }
            svg += `<path d="${d}" fill="none" stroke="${c}" stroke-width="1.5" marker-end="url(#gx-arr${bad ? 'r' : ''})" ${bad ? 'stroke-dasharray="4 3"' : ''}/>`;
        });
    });
    const defs = `<defs><marker id="gx-arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94A3B8"/></marker><marker id="gx-arrr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#EF4444"/></marker></defs>`;

    const scale = top.map(s => `<div class="gx-seg top" style="left:${X(s.s)}px;width:${(s.e - s.s + 1) * ppd}px">${s.label}</div>`).join('')
        + bot.map(s => `<div class="gx-seg bot ${tN >= s.s && tN <= s.e ? 'today' : ''} ${z === 'day' && [0, 6].includes(fromDayNum(s.s).getDay()) ? 'we' : ''}" style="left:${X(s.s)}px;width:${(s.e - s.s + 1) * ppd}px">${s.label}</div>`).join('');
    const isPrev = GX.mode === 'prev';
    inner.innerHTML = `<div class="gx-grid" style="width:${GX_LEFT + TW}px">
      <div class="gx-head">
        <div class="gx-corner" style="width:${GX_LEFT}px"><div class="gx-cols"><div class="gx-c-name">Projet / Activité</div><div class="gx-c-resp">Responsable</div><div class="gx-c-d">${isPrev ? 'Début' : 'Début réel'}</div><div class="gx-c-d">${isPrev ? 'Fin' : 'Fin réelle'}</div><div class="gx-c-p">%</div></div></div>
        <div class="gx-hscale" style="width:${TW}px;height:56px">${scale}</div>
      </div>
      <div class="gx-body" style="height:${H}px">
        <div class="gx-bg" style="left:${GX_LEFT}px;width:${TW}px;height:${H}px">${bg}</div>
        <svg class="gx-svg" style="left:${GX_LEFT}px" width="${TW}" height="${H}">${defs}${svg}</svg>
        ${html}
      </div>
    </div>`;
    GX_STATE = { min, ppd };
    gxLegend(acts);
    if (scrollToday) gxScrollToday();
}

function gxScrollToday() {
    const sc = document.getElementById('gx-scroll'); if (!sc || !GX_STATE) return;
    const x = (toDayNum(getToday()) - GX_STATE.min) * GX_STATE.ppd;

function gxTip(e, html) {

    const w = tip.offsetWidth, h = tip.offsetHeight;

}
function gxOpen(id) { const a = aById(id); if (a) { selectedAct = a; go('saisie'); } }

function gxBindPointer() {
    const inner = document.getElementById('gx-inner');
    const tip = document.getElementById('gx-tip');
    let drag = null;
    inner.addEventListener('click', e => {
        const f = e.target.closest('[data-fold]');
        if (f) { const id = +f.dataset.fold; GX.collapsed.has(id) ? GX.collapsed.delete(id) : GX.collapsed.add(id); gxDraw(false); return; }
        const o = e.target.closest('[data-open]'); if (o) return gxOpen(+o.dataset.open);
        const m = e.target.closest('.gx-ms, .gx-bar.nodrag'); if (m) return gxOpen(+m.dataset.id);
    });
    inner.addEventListener('pointerdown', e => {
        const bar = e.target.closest('.gx-bar');
        if (!bar || bar.classList.contains('nodrag') || e.button !== 0) return;
        drag = { bar, id: +bar.dataset.id, kind: bar.dataset.kind, s: +bar.dataset.s, e: +bar.dataset.e, x0: e.clientX, left0: parseFloat(bar.style.left), w0: parseFloat(bar.style.width), mode: e.target.classList.contains('grip') ? 'resize' : 'move', days: 0, moved: false };
        bar.setPointerCapture(e.pointerId);
        e.preventDefault();
    });
    inner.addEventListener('pointermove', e => {
        if (drag) {
            const dx = e.clientX - drag.x0;
            if (Math.abs(dx) > 3) drag.moved = true;
            if (!drag.moved) return;
            const ppd = GX_STATE.ppd;
            let days = Math.round(dx / ppd);
            if (drag.mode === 'resize') days = Math.max(days, drag.s - drag.e);
            drag.days = days;
            if (drag.mode === 'move') drag.bar.style.left = (drag.left0 + days * ppd) + 'px';
            else drag.bar.style.width = Math.max(ppd, drag.w0 + days * ppd) + 'px';
            const ns = drag.mode === 'move' ? drag.s + days : drag.s, ne = drag.e + days;
            gxTip(e, `<b>${drag.mode === 'move' ? 'Décaler' : 'Changer la durée'}</b><br>${fd(fromDayNum(ns))} → ${fd(fromDayNum(ne))}<br><span class="k">${days > 0 ? '+' : ''}${days} jour(s) · durée ${ne - ns + 1} j</span>`);
            return;
        }
        const el = e.target.closest('.gx-bar, .gx-ms');
        if (el) { const a = aById(+el.dataset.id); if (a) gxTip(e, gxTipHTML(a)); }
        else tip.style.display = 'none';
    });
    inner.addEventListener('pointerleave', () => { if (!drag) tip.style.display = 'none'; });
    inner.addEventListener('pointerup', () => {
        if (!drag) return;
        const d = drag; drag = null; tip.style.display = 'none';
        if (!d.moved) return gxOpen(d.id);
        if (!d.days) return gxDraw(false);
        gxConfirmShift(d);
    });
    inner.addEventListener('pointercancel', () => { if (drag) { drag = null; gxDraw(false); } });
}

function gxConfirmShift(d) {
    const a = aById(d.id); if (!a) return gxDraw(false);
    const ns = d.mode === 'move' ? d.s + d.days : d.s, ne = d.e + d.days;

let DASH = null, dashData = [], CFG = null;
function dashLoad() {
    const defs = DEFAULT_WIDGETS();
    let list = null;
    try { const w = JSON.parse(localStorage.getItem(DASH_KEY) || 'null'); if (Array.isArray(w)) list = w; } catch (e) { }
    if (!list || !list.length) return defs;
    // Migration : reconnaître les graphiques préconçus enregistrés avant cette version
    list.forEach(w => {
        if (w.sys) return;
        const d = defs.find(x => x.id === w.id && x.dim === w.dim && x.measure === w.measure && !list.some(y => y.sys === x.sys));
        if (d) w.sys = d.sys;
    });
    // Les graphiques préconçus ne peuvent pas disparaître : on rajoute ceux qui manquent
    defs.forEach(d => { if (!list.some(w => w.sys === d.sys)) { const c = { ...d }; if (list.some(w => w.id === c.id)) c.id = maxId(list); list.push(c); } });

function kpiLoad() {

}

function kpiFilterBy(d, dim, val) {
    if (!dim || val === '' || val == null) return d;
    switch (dim) {
        case 'statut': return d.filter(a => a.statut === val);
        case 'prio': return d.filter(a => a.prio === val);
        case 'projet': return d.filter(a => a.pid == val);

// ---------- agrégation ----------
function dashValue(list, m) {
    switch (m) {
        case 'count': return list.length;
        case 'bprev': return list.reduce((s, a) => s + (a.bprev || 0), 0);
        case 'breel': return list.reduce((s, a) => s + (a.breel || 0), 0);
        case 'ecart': return list.reduce((s, a) => s + (a.bprev || 0) - (a.breel || 0), 0);
        case 'avancement': return list.length ? Math.round(list.reduce((s, a) => s + pct(a.tc, a.nbt), 0) / list.length) : 0;
        case 'taches': return list.reduce((s, a) => s + (a.tc || 0), 0);
    }
    return 0;
}
function dashAggregate(data, w) {
    const groups = new Map(), labelOf = new Map();
    const add = (k, a, l) => { if (!groups.has(k)) { groups.set(k, []); labelOf.set(k, l ?? k); } groups.get(k).push(a); };
    data.forEach(a => {
        switch (w.dim) {
            case 'statut': add(a.statut || '—', a); break;
            case 'prio': add(a.prio || '—', a); break;
            case 'projet': add(pName(a.pid), a); break;
            case 'resp': add(a.resp || '—', a); break;
            case 'domaine': ((a.tags && a.tags.length) ? a.tags : ['Non classé']).forEach(t => add(t, a)); break;
            case 'mois': { const d = parseDate(a.dp || a.dr); if (d) add(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`, a, d.toLocaleDateString('fr-FR', { month: 'short', year: 'numeric' })); else add('9999', a, 'Sans date'); break; }
            case 'activite': add('A' + a.id, a, a.nom.length > 30 ? a.nom.slice(0, 29) + '…' : a.nom); break;
        }
    });
    const ORDER = { statut: ['Non démarrée', 'En cours', 'Terminée'], prio: ['Faible', 'Moyenne', 'Élevée', 'Critique'] };
    let keys = [...groups.keys()];
    if (ORDER[w.dim]) { ORDER[w.dim].forEach(k => { if (!groups.has(k)) { groups.set(k, []); labelOf.set(k, k); } }); keys = ORDER[w.dim].concat(keys.filter(k => !ORDER[w.dim].includes(k))); }
    if (w.dim === 'mois') keys.sort();
    let rows = keys.map(k => ({ label: labelOf.get(k), v1: dashValue(groups.get(k), w.measure), v2: w.measure2 ? dashValue(groups.get(k), w.measure2) : null }));
    if (w.sort === 'asc') rows.sort((a, b) => a.v1 - b.v1);
    if (w.sort === 'desc') rows.sort((a, b) => b.v1 - a.v1);
    if (+w.topN > 0) rows = rows.slice(0, +w.topN);
    return rows;
}

// ---------- couleurs ----------
const dashIsCirc = t => ['pie', 'doughnut', 'polarArea'].includes(t);
const dashSeriesCount = w => (w.measure2 && !dashIsCirc(w.type)) ? 2 : 1;
const dashPerCat = w => dashSeriesCount(w) === 1 && (dashIsCirc(w.type) || (['bar', 'hbar', 'stacked'].includes(w.type) && w.colorMode === 'categorie'));
const dashSeuil = w => w.colorMode === 'seuil' && dashSeriesCount(w) === 1 && ['bar', 'hbar', 'stacked'].includes(w.type);
function dashPal(w) {
    if (w.palette === 'mono') { const b = w.monoColor || '#6366F1'; return [0, .3, -.25, .5, -.45, .65, .15, -.12, .4, -.6].map(t => shade(b, t)); }
    return PALETTES[w.palette] || PALETTES.ong;
}
const dashCatColor = (w, label, i) => (w.customColors && w.customColors[label]) || dashPal(w)[i % 10];
function dashSeriesColor(w, si) {
    if (w.customColors && w.customColors['__s' + si]) return w.customColors['__s' + si];
    if (si === 0 && w.colorMode === 'unique') return w.monoColor || '#6366F1';
    return dashPal(w)[si % 10];
}
const dashFmt = (v, m) => m === 'avancement' ? v + '%' : (['bprev', 'breel', 'ecart'].includes(m) ? feShort(v) : Number(v).toLocaleString('fr-FR'));

// ---------- rendu Chart.js ----------
function dashRender(canvas, w, data) {
    if (canvas._chart) { canvas._chart.destroy(); canvas._chart = null; }
    const inner = canvas.parentElement;
    inner.querySelector('.dw-empty')?.remove();
    canvas.style.display = '';
    if (!window.Chart) { inner.insertAdjacentHTML('beforeend', '<div class="dw-empty"><i class="fas fa-plug"></i>Bibliothèque graphique non chargée (connexion internet ?)</div>'); return; }
    const rows = dashAggregate(data, w);
    const hasData = rows.some(r => r.v1 || r.v2);
    if (!rows.length || !hasData) { canvas.style.display = 'none'; inner.insertAdjacentHTML('beforeend', '<div class="dw-empty"><i class="fas fa-chart-simple" style="font-size:22px;opacity:.5"></i>Aucune donnée pour ces filtres</div>'); return; }

    const isDark = !document.body.classList.contains('light');
    const tc = isDark ? 'rgba(226,232,240,0.8)' : 'rgba(30,41,59,0.8)';
    const gc = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.07)';
    const circ = dashIsCirc(w.type);
    const baseType = { bar: 'bar', hbar: 'bar', stacked: 'bar', line: 'line', area: 'line', pie: 'pie', doughnut: 'doughnut', polarArea: 'polarArea', radar: 'radar' }[w.type] || 'bar';
    const labels = rows.map(r => r.label);
    const series = [{ label: MEASURES[w.measure], data: rows.map(r => r.v1), m: w.measure }];
    if (dashSeriesCount(w) === 2) series.push({ label: MEASURES[w.measure2], data: rows.map(r => r.v2), m: w.measure2 });

    const datasets = series.map((s, si) => {
        let col;
        if (dashSeuil(w)) col = s.data.map(v => v >= 80 ? '#10B981' : v >= 40 ? '#F59E0B' : '#EF4444');
        else if (dashPerCat(w)) col = labels.map((l, i) => dashCatColor(w, l, i));
        else col = dashSeriesColor(w, si);
        const alpha = circ ? 0.88 : (w.type === 'area' || w.type === 'radar') ? 0.25 : 0.6;
        return {
            label: s.label, data: s.data, _m: s.m,
            backgroundColor: Array.isArray(col) ? col.map(c => hexA(c, alpha)) : hexA(col, alpha),
            borderColor: circ ? (isDark ? '#1E293B' : '#FFFFFF') : col,
            borderWidth: circ ? 2 : (baseType === 'line' ? 2.5 : 1.5),
            borderRadius: baseType === 'bar' ? 5 : 0,
            fill: w.type === 'area' || w.type === 'radar',
            tension: .32, pointRadius: baseType === 'line' ? 3.5 : 3,
            pointBackgroundColor: col, maxBarThickness: 48
        };
    });

    // hauteur adaptée aux barres horizontales nombreuses
    inner.style.height = (w.type === 'hbar' && labels.length > 8) ? (labels.length * 28 + 50) + 'px' : '100%';

    const stacked = w.type === 'stacked';
    const valueAxis = w.type === 'hbar' ? 'x' : 'y';
    const allMoney = series.every(s => ['bprev', 'breel', 'ecart'].includes(s.m));
    const allPct = series.every(s => s.m === 'avancement');
    const scales = {};
    if (!circ && baseType !== 'radar') {
        const cat = { ticks: { color: tc, font: { size: 10.5 }, autoSkip: true, maxRotation: 45 }, grid: { display: false }, stacked };
        const val = { ticks: { color: tc, font: { size: 10.5 }, callback: v => allMoney ? feShort(v) : (allPct ? v + '%' : v) }, grid: { color: gc }, stacked, beginAtZero: true };
        if (allPct && !stacked) val.max = 100;
        scales[valueAxis] = val;
        scales[valueAxis === 'x' ? 'y' : 'x'] = cat;
    } else if (circ && baseType === 'polarArea') {
        scales.r = { ticks: { color: tc, backdropColor: 'transparent' }, grid: { color: gc } };
    } else if (baseType === 'radar') {
        scales.r = { ticks: { color: tc, backdropColor: 'transparent' }, grid: { color: gc }, angleLines: { color: gc }, pointLabels: { color: tc, font: { size: 10.5 } }, beginAtZero: true };
    }
    const inside = circ || stacked;
    const plugins = {
        legend: { display: w.legend !== 'none', position: w.legend === 'none' ? 'top' : w.legend, labels: { color: tc, boxWidth: 12, font: { size: 11 } } },
        tooltip: { callbacks: { label: ctx => ` ${circ ? ctx.label : ctx.dataset.label} : ${dashFmt(ctx.raw, ctx.dataset._m)}` } },
        datalabels: {
            display: w.labels === 'none' ? false : ctx => { const v = ctx.dataset.data[ctx.dataIndex]; return v !== 0 && v != null; },
            color: inside ? '#fff' : tc,
            textStrokeColor: inside ? 'rgba(0,0,0,.35)' : 'transparent', textStrokeWidth: inside ? 2 : 0,
            anchor: inside ? 'center' : 'end', align: inside ? 'center' : (baseType === 'line' || baseType === 'radar' ? 'top' : 'end'),
            offset: 2, clamp: true, font: { weight: '700', size: 10.5 },
            formatter: (v, ctx) => {
                const ds = ctx.dataset, tot = ds.data.reduce((s, x) => s + Math.abs(+x || 0), 0);
                const p = tot ? (Math.round(Math.abs(v) / tot * 1000) / 10).toLocaleString('fr-FR') : 0;
                switch (w.labels) {
                    case 'value': return dashFmt(v, ds._m);
                    case 'percent': return p + '%';
                    case 'both': return dashFmt(v, ds._m) + ' (' + p + '%)';
                    case 'category': return ctx.chart.data.labels[ctx.dataIndex];
                }
                return '';
            }
        }
    };
    canvas._chart = new Chart(canvas, {
        type: baseType, data: { labels, datasets },
        options: { responsive: true, maintainAspectRatio: false, indexAxis: w.type === 'hbar' ? 'y' : 'x', layout: { padding: { top: inside ? 4 : 20, right: w.type === 'hbar' ? 46 : 10 } }, plugins, scales },
        plugins: window.ChartDataLabels ? [ChartDataLabels] : []
    });
    return canvas._chart;
}

function dashDup(id) { const w = DASH.find(x => x.id === id); if (!w) return; const c = JSON.parse(JSON.stringify(w)); c.id = maxId(DASH); delete c.sys; delete c.hidden; c.title += ' (copie)'; DASH.splice(DASH.indexOf(w) + 1, 0, c); dashSave(); dashRefresh(); }
function dashDel(id) { const w = DASH.find(x => x.id === id); if (dashIsSys(w)) { notify('Ce graphique préconçu ne peut pas être supprimé : vous pouvez le masquer.', 'info'); return; } askConfirm('Supprimer le graphique', `<p>Supprimer « <b>${esc(w?.title)}</b> » du tableau de bord ?</p>`, 'Supprimer', () => { DASH = DASH.filter(x => x.id !== id); dashSave(); dashRefresh(); }, null, true); }

    ['cfg-title', 'cfg-dim', 'cfg-size', 'cfg-m1', 'cfg-m2', 'cfg-lab', 'cfg-leg', 'cfg-sort', 'cfg-top', 'cfg-cmode', 'cfg-mono'].forEach(i => {

function cfgRead() {
    const v = i => document.getElementById(i).value;
    Object.assign(CFG, { title: v('cfg-title') || 'Graphique', dim: v('cfg-dim'), size: v('cfg-size'), measure: v('cfg-m1'), measure2: v('cfg-m2'), labels: v('cfg-lab'), legend: v('cfg-leg'), sort: v('cfg-sort'), topN: +v('cfg-top'), colorMode: v('cfg-cmode'), monoColor: v('cfg-mono') });
    if (CFG.measure2 === CFG.measure) CFG.measure2 = '';
}
function cfgRenderCC() {
    const box = document.getElementById('cfg-cc'); if (!box) return;
    if (dashSeuil(CFG)) { box.innerHTML = '<div style="font-size:11px;color:var(--text3)">Couleurs déterminées par les seuils : <span style="color:#EF4444">■</span> &lt; 40 · <span style="color:#F59E0B">■</span> 40–79 · <span style="color:#10B981">■</span> ≥ 80</div>'; return; }
    let items;
    if (dashPerCat(CFG)) items = dashAggregate(dashData, CFG).map((r, i) => ({ k: r.label, l: r.label, c: dashCatColor(CFG, r.label, i) }));
    else items = Array.from({ length: dashSeriesCount(CFG) }, (_, si) => ({ k: '__s' + si, l: MEASURES[si === 0 ? CFG.measure : CFG.measure2], c: dashSeriesColor(CFG, si) }));
    box.innerHTML = items.length ? items.map(it => `<label class="cc-item"><input type="color" data-k="${esc(it.k)}" value="${it.c}"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(it.l)}</span></label>`).join('') : '<div style="font-size:11px;color:var(--text3)">Aucune catégorie</div>';
    box.querySelectorAll('input[type=color]').forEach(inp => inp.addEventListener('input', () => { CFG.customColors = CFG.customColors || {}; CFG.customColors[inp.dataset.k] = inp.value; cfgPreview(); }));
}
function cfgPreview() { const cv = document.getElementById('cfg-cv'); if (cv) dashRender(cv, CFG, dashData); }
function cfgSave() {
    cfgRead();
    const w = JSON.parse(JSON.stringify(CFG));
    if (!w.id) { w.id = maxId(DASH); DASH.push(w); }
    else DASH[DASH.findIndex(x => x.id === w.id)] = w;
    dashSave(); closeModal(); dashRefresh(); notify('Graphique enregistré');
}

function renderDocList() {

    if (type === 'document') docs = docs.filter(d => !(d.fileType || '').startsWith('image/'));
    if (q) docs = docs.filter(d => ((d.description || '') + ' ' + (d.nom || '')).toLowerCase().includes(q));
    let reps = (type === '' || type === 'rapport') ? DB.rapports.slice() : [];

            <div style="font-weight:600;font-size:12.5px">${esc(d.nom)}</div>
            <div style="font-size:11px;color:var(--text3)">${esc(d.projet || pName(d.projetId))}${d.activite ? ' · ' + esc(d.activite) : ''} · ${d.date ? fd(d.date) : '—'} · <span class="badge ${isImg ? 'b-purple' : 'b-blue'}" style="font-size:9px">${isImg ? 'Image' : 'Document'}</span>${d.driveUrl ? ' <span class="badge b-green" style="font-size:9px"><i class="fab fa-google-drive"></i> Drive</span>' : ''}</div>
            ${d.description ? `<div style="font-size:11.5px;margin-top:5px;padding:6px 9px;background:var(--bg2);border-left:3px solid var(--accent);border-radius:4px;line-height:1.5">${esc(d.description)}</div>` : ''}
            ${d.fileName ? `<div style="font-size:10px;color:var(--text2);margin-top:5px"><i class="fas fa-paperclip"></i> ${esc(d.fileName)}</div>` : ''}

function saveDocument() {
    const nom = document.getElementById('doc-nom').value.trim();
    const pid = parseInt(document.getElementById('doc-pid').value);
    const aid = parseInt(document.getElementById('doc-aid').value) || null;
    const date = document.getElementById('doc-date').value;
    const description = document.getElementById('doc-desc').value.trim();
    const file = document.getElementById('doc-file').files[0] || null;
    if (!nom) return notify('Veuillez saisir un titre', 'error');
    if (!pid) return notify('Veuillez sélectionner un projet', 'error');
    if (file && file.size > 25000000) return notify('Le fichier est trop lourd (max 25 Mo)', 'error');
    const btn = document.getElementById('doc-save'), old = btn.innerHTML;
    btn.disabled = true; btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${file ? 'Envoi vers Drive...' : 'Enregistrement...'}`;
    const send = extra => apiPost({ action: 'uploadDocument', nom, description, projet: pName(pid), projetId: pid, activite: aid ? (aById(aid)?.nom || '') : '', activiteId: aid, date, ...extra })
        .then(res => {
            DB.documents.push(normalizeDoc(res.doc));
            logAction(`Fichier « ${nom} » ajouté (${pName(pid)})`, 'fa-paperclip');
            notify(file ? '✅ Document enregistré sur Google Drive !' : '✅ Document enregistré !');
            ['doc-nom', 'doc-desc', 'doc-file'].forEach(i => document.getElementById(i).value = '');
            renderDocList();
        })
        .catch(err => notify('⚠️ Erreur : ' + (err.message || "Échec de l'enregistrement"), 'error'))
        .finally(() => { btn.disabled = false; btn.innerHTML = old; });
    if (file) {
        const reader = new FileReader();
        reader.onload = e => send({ fileName: file.name, fileType: file.type, fileData: e.target.result.split(',')[1] });
        reader.onerror = () => { notify('Erreur lors de la lecture du fichier', 'error'); btn.disabled = false; btn.innerHTML = old; };
        reader.readAsDataURL(file);
    } else send({ fileName: '', fileType: '', fileData: null });
}
function deleteDoc(id) {
    askConfirm('Supprimer le document', '<p>Supprimer ce document ? Il sera aussi supprimé de Google Drive.</p>', '<i class="fas fa-trash"></i> Supprimer', () => {
        apiPost({ action: 'deleteDocument', id })
            .then(() => { const d = DB.documents.find(x => x.id === id); DB.documents = DB.documents.filter(d => d.id !== id); if (d) logAction(`Fichier « ${d.nom} » supprimé`, 'fa-trash'); notify('Document supprimé'); renderDocList(); })
            .catch(err => notify('⚠️ Erreur : ' + (err.message || 'Échec de la suppression'), 'error'));
    }, null, true);
}

const LOCAL_RP_KEY = 'ong_rapports_local';
const DRAFT_KEY = 'ong_report_draft';
const RP_TYPES = ["Rapport d'activité", 'Rapport de mission', "Rapport d'atelier / formation", 'Rapport de distribution', 'Rapport de suivi-évaluation', 'Autre'];
const RP_SECTIONS = [
    { k: 'contexte', t: 'Contexte et justification', h: 'Pourquoi cette activité ? Situation initiale, besoins identifiés…' },
    { k: 'deroulement', t: "Déroulement de l'activité", h: 'Ce qui a été fait : étapes, méthodologie, chronologie…' },
    { k: 'resultats', t: 'Résultats obtenus', h: 'Réalisations concrètes, chiffres clés, effets observés…' },
    { k: 'difficultes', t: 'Difficultés rencontrées', h: 'Contraintes, retards, problèmes et solutions apportées…' },
    { k: 'recommandations', t: 'Recommandations et prochaines étapes', h: 'Leçons apprises, actions à venir, besoins identifiés…' }
];
const rpGet = id => DB.rapports.find(r => r.id == id);
function localReports() { try { return JSON.parse(localStorage.getItem(LOCAL_RP_KEY) || '[]'); } catch (e) { return []; } }
function storeLocalReports(list) { localStorage.setItem(LOCAL_RP_KEY, JSON.stringify(list.map(r => { const c = { ...r }; delete c._local; return c; }))); }
async function fetchReports(fromReadAll) {
    if (Array.isArray(fromReadAll)) { reportsBackend = true; return fromReadAll; }
    try {
        const r = await fetch(API_URL + '?action=readRapports');
        const d = await r.json();
        if (d && Array.isArray(d.rapports)) { reportsBackend = true; return d.rapports; }
    } catch (e) { }
    reportsBackend = false;
    return [];
}
async function persistReport(report) {
    const clean = { ...report }; delete clean._local;
    if (reportsBackend && !report._local) {
        const d = await apiPost({ action: 'saveReport', report: clean });
        return normalizeReport(d.report || clean);
    }
    const list = localReports().filter(r => r.id != clean.id);
    list.push(clean);
    try { storeLocalReports(list); } catch (e) { throw new Error('Stockage du navigateur plein : retirez quelques photos ou configurez l\'Apps Script.'); }
    return { ...normalizeReport(clean), _local: true };
}
async function uploadReportImage(img, report) {
    const d = await apiPost({ action: 'uploadReportImage', fileName: `rapport_${report.id}_${Date.now()}.jpg`, fileType: 'image/jpeg', fileData: img.dataUrl.split(',')[1], projet: pName(report.projetId) });
    if (!d.url) throw new Error('Photo envoyée mais lien Drive manquant');
    return d;
}
async function removeReport(r) {
    if (r._local) storeLocalReports(localReports().filter(x => x.id != r.id));
    else await apiPost({ action: 'deleteReport', id: r.id });
    DB.rapports = DB.rapports.filter(x => !(x.id == r.id && !!x._local === !!r._local));
}
async function pushLocalReports() {
    const locals = DB.rapports.filter(r => r._local);
    if (!locals.length || !reportsBackend) return;
    let ok = 0;
    for (const r of locals) {
        try {
            const copy = JSON.parse(JSON.stringify(r)); delete copy._local;
            copy.id = maxId(DB.rapports.filter(x => !x._local));
            for (const im of copy.images) if (im.dataUrl && !im.url) { const up = await uploadReportImage(im, copy); im.url = up.url; im.fileId = up.fileId; delete im.dataUrl; }
            const saved = await persistReport(copy);
            storeLocalReports(localReports().filter(x => x.id != r.id));
            DB.rapports = DB.rapports.filter(x => x !== r); DB.rapports.push(saved); ok++;
        } catch (e) { notify(`⚠️ « ${r.titre} » : ${e.message}`, 'error'); }
    }
    notify(`✅ ${ok} rapport(s) transféré(s) vers Google Sheets`);
    updateBadges(); refreshCurrentPage();
}

@media print{@page{size:A4;margin:12mm}body{margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}.rp-doc{box-shadow:none;padding:0;max-width:none;border-radius:0}.rp-gal tr,.rp-kpi,.rp-sign,.rp-id{page-break-inside:avoid}.rp-h2{page-break-after:avoid}}`;
function rpRef(r) { const y = (parseDate(r.date) || getToday()).getFullYear(); return `RPT-${y}-${String(r.id || 0).padStart(4, '0')}`; }
function rpAutoTitle(r) { const a = aById(r.activiteId), p = pById(r.projetId); return `${r.type || "Rapport d'activité"} — ${a ? a.nom : (p ? p.nom : '')}`; }

function buildReportHTML(r, opts = {}) {
    const S = getSettings(), p = pById(r.projetId), a = r.activiteId ? aById(r.activiteId) : null;
    const col = p && /^#[0-9a-f]{6}$/i.test(p.couleur) ? p.couleur : '#4F46E5';
    const clean = h => window.DOMPurify ? DOMPurify.sanitize(h || '') : esc(h || '');
    const b = r.benef || {}, bh = +b.h || 0, bf = +b.f || 0, be = +b.e || 0, bt = bh + bf + be;
    let n = 0;
    const H2 = t => `<div class="rp-h2">${++n}. ${t}</div>`;
    const periode = r.periodeDu || r.periodeAu ? `${fd(r.periodeDu)} → ${fd(r.periodeAu)}` : '—';
    let html = `<style>${REPORT_CSS.replace(/RPCOL/g, col)}</style><div class="rp-doc">`;
    if (r.statut !== 'Validé' && !opts.word) html += '<div class="rp-wm">BROUILLON</div>';
    html += `<table class="rp-head"><tr>
        <td style="width:72px">${S.logo ? `<img class="rp-logo" src="${S.logo}" alt="logo">` : `<div class="rp-logo-ph">${initial(S.sigle || S.nom)}</div>`}</td>
        <td style="padding-left:12px"><div class="rp-org-name">${esc(S.nom)}${S.sigle ? ` <span style="font-weight:600;color:#64748B;font-size:13px">(${esc(S.sigle)})</span>` : ''}</div><div class="rp-org-sub">${esc(S.slogan)}</div></td>
        <td class="rp-ref">Réf. <b>${rpRef(r)}</b><br>Date : ${fd(r.date)}<br>Statut : ${esc(r.statut || 'Brouillon')}</td>
      </tr></table>
      <div class="rp-band"><div class="rp-type">${esc(r.type)}</div><h1>${esc(r.titre || rpAutoTitle(r))}</h1><div class="rp-proj">Projet : ${esc(p ? p.nom : '—')}</div></div>
      <table class="rp-id">
        <tr><td class="k">Projet</td><td>${esc(p ? p.nom : '—')}</td><td class="k">Activité</td><td>${esc(a ? a.nom : 'Rapport général du projet')}</td></tr>
        <tr><td class="k">Date du rapport</td><td>${fd(r.date)}</td><td class="k">Période couverte</td><td>${periode}</td></tr>
        <tr><td class="k">Lieu / zone</td><td>${esc(r.lieu || (p && p.pays) || '—')}</td><td class="k">Rédigé par</td><td>${esc(r.redacteur || '—')}</td></tr>
        <tr><td class="k">Responsable activité</td><td>${esc(a ? a.resp : '—')}</td><td class="k">Chef de projet</td><td>${esc(p ? p.chef : '—')}</td></tr>
      </table>`;
    if (r.inclureSynthese !== false && a) {
        const pr = pct(a.tc, a.nbt), ec = (a.bprev || 0) - (a.breel || 0);
        html += H2("Fiche synthèse de l'activité") + `<table class="rp-kpi">
          <tr><td><div class="k">Avancement</div><div class="v">${pr}%</div><div class="rp-bar"><div style="width:${Math.min(pr, 100)}%"></div></div><div class="s">${a.tc}/${a.nbt} tâches</div></td>
              <td><div class="k">Statut</div><div class="v" style="font-size:13px">${esc(a.statut)}</div>${isActivityLate(a) ? `<div class="s rp-neg">${daysLate(a.fp)} j de retard</div>` : ''}</td>
              <td><div class="k">Dates prévues</div><div class="v" style="font-size:11.5px">${fd(a.dp)}<br>→ ${fd(a.fp)}</div></td>
              <td><div class="k">Dates réelles</div><div class="v" style="font-size:11.5px">${a.dr ? fd(a.dr) : '—'}<br>→ ${a.fr ? fd(a.fr) : (a.dr ? 'en cours' : '—')}</div></td></tr>
          <tr><td><div class="k">Budget prévu</div><div class="v" style="font-size:12.5px">${fe(a.bprev)}</div></td>
              <td><div class="k">Budget réel</div><div class="v" style="font-size:12.5px">${fe(a.breel)}</div></td>
              <td><div class="k">Écart</div><div class="v ${ec >= 0 ? 'rp-pos' : 'rp-neg'}" style="font-size:12.5px">${ec >= 0 ? '+' : '−'} ${fe(Math.abs(ec))}</div></td>
              <td><div class="k">Taux d'exécution</div><div class="v" style="font-size:12.5px">${pct(a.breel, a.bprev)}%</div></td></tr>
        </table>`;
    }
    if ((r.objectif || '').trim()) html += H2("Objectif de l'activité") + `<div class="rp-txt"><p>${esc(r.objectif).replace(/\n/g, '<br>')}</p></div>`;
    if (bt > 0 || +r.participants > 0 || (r.partenaires || '').trim()) {
        html += H2('Bénéficiaires et participants') + `<table class="rp-kpi"><tr>
          <td><div class="k">Hommes</div><div class="v">${bh}</div></td><td><div class="k">Femmes</div><div class="v">${bf}</div></td>
          <td><div class="k">Enfants</div><div class="v">${be}</div></td><td><div class="k">Total bénéficiaires</div><div class="v" style="color:${col}">${bt}</div></td>
        </tr></table>`;
        if (+r.participants > 0 || (r.partenaires || '').trim()) html += `<div class="rp-txt" style="margin-top:8px">${+r.participants > 0 ? `<p><b>Participants :</b> ${+r.participants}</p>` : ''}${(r.partenaires || '').trim() ? `<p><b>Partenaires impliqués :</b> ${esc(r.partenaires)}</p>` : ''}</div>`;
    }
    RP_SECTIONS.forEach(s => { const h = (r.sections || {})[s.k]; if (h && h.replace(/<[^>]*>/g, '').trim()) html += H2(s.t) + `<div class="rp-txt">${clean(h)}</div>`; });
    const imgs = r.images || [];
    if (imgs.length) {
        let rows = '';
        for (let i = 0; i < imgs.length; i += 2) rows += '<tr>' + [imgs[i], imgs[i + 1]].map((im, j) => im ? `<td><img src="${esc(im.dataUrl || im.url)}" ${opts.word ? 'width="310" height="210"' : ''} alt=""><div class="cap"><b>Photo ${i + j + 1}</b>${im.legende ? ' — ' + esc(im.legende) : ''}</div></td>` : '<td></td>').join('') + '</tr>';
        html += H2('Galerie photos') + `<table class="rp-gal">${rows}</table>`;
    }
    html += `<table class="rp-sign" style="margin-top:30px"><tr>
        <td>Rédigé par<br><b>${esc(r.redacteur || '')}</b><br>Le ${fd(r.date)}<div class="ln"></div>Signature</td>
        <td>Validé par<br><b>${esc(r.validePar || '')}</b>&nbsp;<br>${r.valideLe ? 'Le ' + fd(r.valideLe) : 'Date : ……………'}<div class="ln"></div>Signature et cachet</td>
      </tr></table>
      <div class="rp-foot">${esc(S.nom)} · ${rpRef(r)} · Document généré le ${fd(getToday())} — ONG Project Pro</div>
    </div>`;
    return html;
}
function rpFileName(r) { return (r.titre || 'rapport').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w\-]+/g, '_').slice(0, 80); }
function exportReportPDF(r) {
    if (!r) return;
    const w = window.open('', '_blank');
    if (!w) return notify('Autorisez les fenêtres pop-up pour exporter en PDF', 'error');
    w.document.write(`<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>${esc(rpFileName(r))}</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><style>body{margin:0;padding:20px;background:#fff}@media print{body{padding:0}}</style></head><body>${buildReportHTML(r)}<script>window.onload=function(){setTimeout(function(){window.print()},700)}<\/script></body></html>`);
    w.document.close();
    notify('Dans la fenêtre d\'impression, choisissez « Enregistrer au format PDF »', 'info');
}
function exportReportWord(r) {
    if (!r) return;
    const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${esc(r.titre)}</title></head><body>${buildReportHTML(r, { word: true })}</body></html>`;
    const blob = new Blob(['\ufeff' + html], { type: 'application/msword' });
    const l = document.createElement('a'); l.href = URL.createObjectURL(blob); l.download = rpFileName(r) + '.doc'; l.click();
    notify('Fichier Word téléchargé');
}
function viewReport(id) {
    const r = rpGet(id); if (!r) return;
    openModal(r.titre || 'Rapport', `<div class="rp-paper-wrap">${buildReportHTML(r)}</div>`,
        `<button class="btn btn-ghost" onclick="closeModal()">Fermer</button>
         <button class="btn btn-ghost" onclick="exportReportWord(rpGet(${r.id}))"><i class="fas fa-file-word"></i> Word</button>
         <button class="btn btn-ghost" onclick="exportReportPDF(rpGet(${r.id}))"><i class="fas fa-file-pdf"></i> PDF</button>
         <button class="btn btn-primary" onclick="closeModal();rpEdit(${r.id})"><i class="fas fa-edit"></i> Modifier</button>`, { wide: true });
}
